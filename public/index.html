<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuaderno · Examen de Español</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEBE2;
  --bg-soft:#E5E0D3;
  --card:#FFFFFF;
  --ink:#22303A;
  --ink-soft:#5B6670;
  --line:#D9D2C0;
  --accent:#8B2635;
  --accent-soft:#F3DCDD;
  --amber:#B9772E;
  --amber-soft:#F3E3CC;
  --good:#3E7A58;
  --good-soft:#DCEBE1;
  --bad:#A63B3B;
  --bad-soft:#F4DCDC;
  --radius-card:14px;
  --radius-chip:999px;
  --shadow:0 1px 2px rgba(34,48,58,.06), 0 6px 20px rgba(34,48,58,.05);
}
[data-theme="dark"]{
  --bg:#1A1D21;
  --bg-soft:#212429;
  --card:#24272C;
  --ink:#EAE6DC;
  --ink-soft:#A3A99F;
  --line:#33373D;
  --accent:#E2828F;
  --accent-soft:#3A2429;
  --amber:#E0A667;
  --amber-soft:#3A2E1C;
  --good:#7FC49A;
  --good-soft:#1E2E26;
  --bad:#E08A8A;
  --bad-soft:#332022;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
button{font-family:inherit;}
.app{display:flex;min-height:100vh;}

/* ---- Nav rail ---- */
.rail{
  width:220px;flex-shrink:0;
  background:var(--bg-soft);
  border-right:1px solid var(--line);
  padding:22px 14px;
  display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
.rail-brand{
  font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;
  padding:0 10px 18px 10px;line-height:1.25;
  border-bottom:1px solid var(--line);margin-bottom:12px;
}
.rail-brand span{display:block;font-family:'Inter';font-weight:500;font-size:.72rem;color:var(--ink-soft);margin-top:3px;}
.nav-btn{
  display:flex;align-items:center;gap:10px;
  background:none;border:none;text-align:left;
  padding:10px 12px;border-radius:10px;cursor:pointer;
  color:var(--ink-soft);font-size:.92rem;font-weight:500;
  transition:background .15s ease, color .15s ease;
}
.nav-btn:hover{background:var(--card);}
.nav-btn.active{background:var(--accent);color:#fff;}
.nav-btn .ic{width:18px;text-align:center;font-size:1rem;}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);}
.theme-toggle{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;cursor:pointer;color:var(--ink);font-size:.85rem;
}

/* ---- mobile bottom nav ---- */
.mobile-nav{display:none;}
@media (max-width:820px){
  .rail{display:none;}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:var(--bg-soft);border-top:1px solid var(--line);
    padding:6px 4px;z-index:50;overflow-x:auto;gap:2px;
  }
  .mobile-nav .nav-btn{flex-direction:column;gap:3px;font-size:.62rem;padding:7px 8px;min-width:58px;text-align:center;}
  main{padding-bottom:78px !important;}
}

main{flex:1;padding:34px 40px;max-width:980px;margin:0 auto;width:100%;}
@media (max-width:820px){ main{padding:20px 16px;} }

.pagehead{margin-bottom:26px;}
.pagehead h1{font-size:1.7rem;font-weight:600;margin:0 0 4px 0;}
.pagehead p{color:var(--ink-soft);margin:0;font-size:.95rem;}

/* ---- cards / grids ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:20px;box-shadow:var(--shadow);}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:720px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;} }
@media (max-width:480px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} }

/* ---- dashboard ring ---- */
.dash-top{display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
.ring-wrap{position:relative;width:150px;height:150px;flex-shrink:0;}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-num b{font-family:'Fraunces';font-size:2rem;font-weight:600;}
.ring-num span{font-size:.7rem;color:var(--ink-soft);}
.stat-box{padding:14px 16px;}
.stat-box b{display:block;font-family:'Fraunces';font-size:1.5rem;font-weight:600;}
.stat-box span{color:var(--ink-soft);font-size:.8rem;}

.topic-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.topic-row:last-child{border-bottom:none;}
.topic-row .tname{width:150px;flex-shrink:0;font-weight:600;font-size:.9rem;}
.bar-track{flex:1;height:8px;background:var(--bg-soft);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;background:var(--accent);transition:width .4s ease;}
.pill{font-size:.68rem;padding:3px 9px;border-radius:var(--radius-chip);font-weight:600;white-space:nowrap;}
.pill-none{background:var(--bg-soft);color:var(--ink-soft);}
.pill-progress{background:var(--amber-soft);color:var(--amber);}
.pill-almost{background:#DCE6F3;color:#3A5D8A;}
.pill-mastered{background:var(--good-soft);color:var(--good);}

.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:11px 18px;font-size:.92rem;font-weight:600;cursor:pointer;
  transition:transform .1s ease, opacity .15s ease;
}
.btn:hover{opacity:.92;}
.btn:active{transform:scale(.98);}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.soft{background:var(--accent-soft);color:var(--accent);}
.btn.amber{background:var(--amber);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--radius-chip);border:1px solid var(--line);background:var(--card);font-size:.82rem;font-weight:500;cursor:pointer;color:var(--ink);}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
[data-theme="dark"] .chip.active{background:var(--accent);border-color:var(--accent);}

.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 10px 2px;font-weight:600;}
/* deliberately used sparingly, only as small section labels above lists — not as a decorative eyebrow on every block */

.mode-card{cursor:pointer;transition:border-color .15s ease, transform .1s ease;}
.mode-card:hover{border-color:var(--accent);}
.mode-card h3{margin:0 0 6px 0;font-size:1rem;}
.mode-card p{margin:0;color:var(--ink-soft);font-size:.83rem;line-height:1.4;}
.mode-card .ic{font-size:1.4rem;margin-bottom:8px;display:block;}

/* ---- question view ---- */
.q-wrap{max-width:700px;margin:0 auto;}
.q-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:.82rem;color:var(--ink-soft);}
.q-progress{height:6px;background:var(--bg-soft);border-radius:999px;overflow:hidden;margin-bottom:22px;}
.q-progress-fill{height:100%;background:var(--accent);transition:width .3s ease;}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow);}
.q-topic-tag{display:inline-block;background:var(--bg-soft);color:var(--ink-soft);font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:12px;}
.q-prompt{font-size:1.15rem;line-height:1.5;margin:0 0 20px 0;font-weight:500;}
.q-reading{background:var(--bg-soft);border-radius:10px;padding:16px 18px;margin-bottom:18px;font-size:.95rem;line-height:1.65;}
.q-reading .sent{cursor:pointer;padding:1px 2px;border-radius:4px;}
.q-reading .sent:hover{background:var(--accent-soft);}
.q-reading .sent.picked{background:var(--accent);color:#fff;}
.q-reading .sent.correct{background:var(--good-soft);color:var(--good);}
.q-reading .sent.incorrect{background:var(--bad-soft);color:var(--bad);}

.opt-list{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px solid var(--line);
  border-radius:11px;cursor:pointer;background:var(--card);font-size:.95rem;transition:border-color .12s ease, background .12s ease;
}
.opt:hover{border-color:var(--accent);}
.opt.selected{border-color:var(--accent);background:var(--accent-soft);}
.opt.correct{border-color:var(--good);background:var(--good-soft);}
.opt.incorrect{border-color:var(--bad);background:var(--bad-soft);}
.opt-letter{width:26px;height:26px;border-radius:50%;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;flex-shrink:0;}

.tf-row{display:flex;gap:12px;}
.tf-row .opt{flex:1;justify-content:center;}

.seg-word{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;justify-content:center;}
.seg-chunk{display:flex;flex-direction:column;align-items:center;gap:6px;}
.seg-chunk .txt{font-family:'Fraunces';font-size:1.4rem;font-weight:600;padding:6px 10px;background:var(--bg-soft);border-radius:8px;}
.seg-chunk select{padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:.78rem;font-weight:600;}
.seg-chunk select.correct{border-color:var(--good);background:var(--good-soft);}
.seg-chunk select.incorrect{border-color:var(--bad);background:var(--bad-soft);}
.seg-key{font-size:.78rem;color:var(--ink-soft);text-align:center;margin-bottom:10px;}

.fill-input{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:11px;font-size:1rem;background:var(--card);color:var(--ink);}
.fill-input:focus{outline:none;border-color:var(--accent);}
.fill-input.correct{border-color:var(--good);background:var(--good-soft);}
.fill-input.incorrect{border-color:var(--bad);background:var(--bad-soft);}

.feedback{margin-top:18px;padding:15px 17px;border-radius:11px;font-size:.9rem;line-height:1.5;}
.feedback.good{background:var(--good-soft);color:var(--good);}
.feedback.bad{background:var(--bad-soft);color:var(--bad);}
.feedback b{display:block;margin-bottom:4px;font-size:.95rem;}
.feedback .exp{color:var(--ink);margin-top:6px;}
.feedback .detail-block{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb, var(--line) 80%, transparent);}
.feedback .detail-title{font-weight:800;color:var(--ink);margin-bottom:4px;}
.feedback .detail-answer{font-weight:800;}
.feedback .detail-tip{margin-top:8px;color:var(--ink-soft);}
.feedback .detail-tip b{display:inline;color:inherit;font-size:inherit;margin:0;}

.hint-box{margin-top:14px;background:var(--amber-soft);border-radius:10px;padding:12px 15px;font-size:.87rem;color:var(--ink);}
.hint-box b{color:var(--amber);}

.q-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap;gap:10px;}
.icon-btn{background:none;border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--ink-soft);font-size:.85rem;display:flex;align-items:center;gap:6px;}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-soft);}
.icon-btn.starred{color:var(--amber);border-color:var(--amber);}

.mini-review{background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;padding:18px;margin-bottom:18px;}
.mini-review h4{margin:0 0 8px 0;color:var(--amber);}

.results-hero{text-align:center;padding:30px 20px;}
.results-hero .big{font-family:'Fraunces';font-size:3rem;font-weight:600;}
.err-item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.err-item .q{font-weight:600;margin-bottom:4px;}
.err-item .meta{font-size:.78rem;color:var(--ink-soft);}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .ic{font-size:2.2rem;margin-bottom:10px;display:block;}

.kbd-hint{font-size:.75rem;color:var(--ink-soft);text-align:center;margin-top:10px;}
kbd{background:var(--bg-soft);border-radius:5px;padding:1px 6px;font-family:inherit;border:1px solid var(--line);}

.hist-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:.88rem;}
.hist-row:last-child{border-bottom:none;}
.spark{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:6px;}
.spark div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;}

.trick{background:var(--amber-soft);border-left:3px solid var(--amber);padding:9px 13px;border-radius:0 8px 8px 0;font-size:.85rem;margin-top:14px;}

@media (max-width:520px){
  .q-card{padding:18px;}
  .grid-2{grid-template-columns:1fr;}
}

/* ===== MEJORA VISUAL SEGURA ===== */
:root{
  --bg:#F3F0E8;
  --bg-soft:#E9E4D9;
  --card:#FCFBF7;
  --ink:#28343B;
  --ink-soft:#616B72;
  --line:#D6D0C5;
  --accent:#74414A;
  --accent-soft:#EEE1E3;
  --amber:#8C6B43;
  --amber-soft:#F1E8DB;
  --good:#5D7966;
  --good-soft:#E2ECE5;
  --bad:#925D5D;
  --bad-soft:#F0E3E2;
  --radius-card:15px;
  --shadow:0 1px 2px rgba(40,52,59,.04),0 8px 22px rgba(40,52,59,.05);
}
[data-theme="dark"]{
  --bg:#1C2023;
  --bg-soft:#22272B;
  --card:#282D31;
  --ink:#ECE8DF;
  --ink-soft:#B2B7B3;
  --line:#3A4044;
  --accent:#C1848D;
  --accent-soft:#3A2E31;
  --amber:#C09A68;
  --amber-soft:#382F25;
  --good:#87A48F;
  --good-soft:#28342C;
  --bad:#C78686;
  --bad-soft:#382A2A;
  --shadow:0 1px 2px rgba(0,0,0,.20),0 8px 22px rgba(0,0,0,.18);
}
body{line-height:1.55;}
.nav-btn.active{background:var(--accent);color:#FFF9F7;}
.btn{background:var(--accent);color:#FFF9F7;}
.btn:hover{opacity:.96;}
.card,.q-card{box-shadow:var(--shadow);}
.q-card{border-radius:15px;}
.feedback.good,.feedback.bad{color:var(--ink);}
.feedback.good b{color:var(--good);}
.feedback.bad b{color:var(--bad);}
.hint-box{
  border:1px solid var(--line);
  border-left:3px solid var(--amber);
  background:var(--amber-soft);
  color:var(--ink);
  line-height:1.58;
}
.hint-box b{color:var(--ink);}

/* Repaso visual */
.review-card{text-align:left !important;}
.review-definition{
  font-size:1.05rem;
  line-height:1.68;
  margin:0 auto;
  max-width:62ch;
}
.study-example{
  margin-top:20px;
  padding:16px 18px;
  background:var(--bg-soft);
  border:1px solid var(--line);
  border-radius:12px;
}
.study-example-label{
  display:block;
  font-size:.72rem;
  color:var(--ink-soft);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:10px;
}
.study-quote{
  font-family:'Fraunces',Georgia,serif;
  font-size:1.18rem;
  line-height:1.85;
}
.study-highlight{
  font-weight:700;
  padding:0 2px 1px;
  border-radius:3px;
  background:var(--accent-soft);
  border-bottom:2px solid var(--accent);
}
.study-note{
  border-top:1px solid var(--line);
  margin-top:14px;
  padding-top:12px;
  font-size:.9rem;
  line-height:1.55;
}
.study-note b{color:var(--accent);}

.morph-example{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin:14px 0 4px;
}
.morph-piece{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.morph-word{
  font-family:'Fraunces',Georgia,serif;
  font-size:1.3rem;
  font-weight:650;
  padding:9px 11px;
  border:1px solid var(--line);
  border-bottom:3px solid var(--accent);
  background:var(--card);
  border-radius:9px;
}
.morph-label{
  color:var(--ink-soft);
  font-size:.7rem;
  font-weight:700;
}
.morph-piece.infix .morph-word{
  background:var(--amber-soft);
  border-bottom-color:var(--amber);
}
.morph-piece.suffix .morph-word{
  background:var(--good-soft);
  border-bottom-color:var(--good);
}
.morph-piece.flex .morph-word{
  background:#E9E5EE;
  border-bottom-color:#756780;
}
[data-theme="dark"] .morph-piece.flex .morph-word{
  background:#342F39;
  border-bottom-color:#A99AB5;
}
.morph-plus{
  align-self:center;
  color:var(--ink-soft);
  font-weight:700;
  margin-top:8px;
}
.study-sequence{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}
.study-step{
  padding:7px 10px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:9px;
  font-weight:600;
  font-size:.86rem;
}
.study-arrow{color:var(--ink-soft);font-weight:700;}

@media (max-width:520px){
  .study-example{padding:14px;}
  .study-quote{font-size:1.08rem;}
  .morph-word{font-size:1.12rem;}
  .q-card{padding:18px 16px;}
}


/* ---- Añadidos funcionales v1.2 (mantienen el diseño original) ---- */
.nav-badge{margin-left:auto;font-size:.62rem;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:999px;background:var(--accent);color:#fff;}
.setting-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:1px solid var(--line);}
.setting-row:last-child{border-bottom:none;}
.setting-copy{min-width:0;}
.setting-copy b{display:block;margin-bottom:3px;}
.setting-copy span{display:block;color:var(--ink-soft);font-size:.84rem;line-height:1.45;}
.setting-control{flex-shrink:0;}
.setting-control select{min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:0 10px;font:inherit;}
.check-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:10px;}
.check-line{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer;}
.check-line input{width:18px;height:18px;accent-color:var(--accent);}
.save-note{font-size:.82rem;color:var(--good);margin-left:8px;}
.update-item{padding:16px 0;border-bottom:1px solid var(--line);}
.update-item:last-child{border-bottom:none;}
.update-item h3{font-size:1rem;margin:0 0 5px;}
.update-item p{margin:0;color:var(--ink-soft);font-size:.87rem;line-height:1.55;}
.new-pill{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:999px;background:var(--accent);color:#fff;font-family:'Inter',sans-serif;font-size:.62rem;font-weight:700;vertical-align:middle;}
.practice-count-box{display:flex;align-items:center;gap:9px;margin:0 0 20px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:.88rem;}
.practice-count-box input{width:18px;height:18px;accent-color:var(--accent);}
@media(max-width:640px){.setting-row{flex-direction:column;gap:10px}.setting-control{width:100%}.setting-control select{width:100%}.check-list{grid-template-columns:1fr}}

</style>
</head>

<div class="app">
  <nav class="rail" id="rail"></nav>
  <main id="main">
      <div class="card" style="margin:30px auto;max-width:680px;">
        <h2 style="margin-top:0;">Cuaderno · Examen de Español</h2>
        <p>La aplicación está cargando.</p>
        <p style="color:var(--ink-soft);font-size:.9rem;">Si este mensaje no desaparece, el visor donde abriste el archivo no permite ejecutar JavaScript. Abre el archivo directamente en Safari, Chrome, Edge o Firefox.</p>
      </div>
    </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<script>
/* =========================================================
   DATOS: temas
========================================================= */
const TOPICS = [

/* ---------- SECCIÓN 3: ANÁLISIS MORFOLÓGICO (segmentación) ---------- */
// roles: MDP, LEX, INF, MDS, MF
function segQ(word, parts, dif, note){
  return {id:nid(), topic:'morfologia', type:'seg', dif,
    prompt:`Divide la palabra "${word}" y asigna la función correcta a cada parte.`,
    word, parts,
    hints:[
      'Busca primero el lexema: la parte con el significado principal.',
      'Revisa si hay algo antes del lexema (prefijo) o después (sufijo/flexivo).',
      note || 'Recuerda: MDP = prefijo, LEX = lexema, INF = infijo, MDS = sufijo, MF = morfema flexivo.'
    ],
    exp: 'PAN | EC | ILLO'.length ? explainSeg(word, parts) : ''
  };
}
function explainSeg(word, parts){
  return parts.map(p=>`${p.text.toUpperCase()} (${roleName(p.role)})`).join(' + ');
}
function roleName(r){
  return {MDP:'prefijo', LEX:'lexema', INF:'infijo', MDS:'sufijo', MF:'morfema flexivo'}[r];
}

/* ---------- SECCIÓN 9: FIGURAS LITERARIAS ---------- */
function figQ(name, sentence, options, correctIdx, hints, exp, dif){
  return {id:nid(), topic:'figuras', type:'mc', dif: dif||'facil',
   prompt:`¿Qué figura literaria aparece en: "${sentence}"?`,
   options, correct: correctIdx, hints, exp};
}
const FIG_ALL = ['Símil','Metáfora','Personificación','Hipérbole','Antítesis','Anáfora','Retruécano','Aliteración','Asíndeton','Polisíndeton','Onomatopeya','Hipérbaton','Redundancia','Encabalgamiento','Oxímoron','Paradoja','Alegoría'];
function pickOpts(correctName, n){
  const others = FIG_ALL.filter(f=>f!==correctName);
  const shuffled = others.sort(()=>Math.random()-0.5).slice(0,n-1);
  const opts = [correctName, ...shuffled];
  return opts.sort(()=>Math.random()-0.5);
}
function mkFig(name, sentence, hints, exp, dif){
  const opts = pickOpts(name,4);
  return figQ(name, sentence, opts, opts.indexOf(name), hints, exp, dif);
}

const APP_VERSION = '1.7.0';
// Clave estable: NO cambiar entre actualizaciones. Así el progreso sobrevive a nuevas versiones.
const STABLE_STORAGE_KEY = 'cuaderno_espanol_hub_progress_v1';
const STORAGE_KEY = 'cuaderno_espanol_v12'; // compatibilidad con versiones anteriores
const STORAGE_BACKUP_KEY = 'cuaderno_espanol_v12_backup';
const IDB_NAME = 'cuaderno_espanol_db';
const IDB_STORE = 'progress';
let hasLocalSavedState = false;
let lastSaveAt = 0;
const state = {
  theme:'light',
  view:'dashboard',
  stats:{}, // topicId -> {attempts, correct, recent:[bool], mastered:false}
  totalAnswered:0, totalCorrect:0, currentStreak:0, bestStreak:0,
  studySeconds:0,
  errors:[], // {qid, userAnswerText, times, last}
  saved:new Set(),
  history:[],
  session:null,
  settings:{
    themeMode:'light',
    practiceCountsByDefault:true,
    examTopics:TOPICS.map(t=>t.id),
    lastSeenUpdate:'',
    accentColor:'#8B2635',
    leaderboardName:'',
    leaderboardDeviceId:''
  }
};
TOPICS.forEach(t=> state.stats[t.id] = {attempts:0, correct:0, recent:[]});

function snapshotState(){
  return {
    version:APP_VERSION,
    savedAt:Date.now(),
    theme:state.theme,
    view:state.view,
    stats:state.stats,
    totalAnswered:state.totalAnswered,totalCorrect:state.totalCorrect,
    currentStreak:state.currentStreak,bestStreak:state.bestStreak,
    studySeconds:state.studySeconds,errors:state.errors,
    saved:[...state.saved],history:state.history,lastResult:state.lastResult||null,
    settings:state.settings,
    session:state.session?{...state.session,queueIds:state.session.queue.map(q=>q.id),queue:undefined}:null
  };
}
function applySavedData(d){
  if(!d || typeof d!=='object') return false;
  if(d.stats) TOPICS.forEach(t=>{ if(d.stats[t.id]) state.stats[t.id]={...state.stats[t.id],...d.stats[t.id]}; });
  ['totalAnswered','totalCorrect','currentStreak','bestStreak','studySeconds'].forEach(k=>{ if(Number.isFinite(d[k])) state[k]=d[k]; });
  if(Array.isArray(d.errors)) state.errors=d.errors;
  if(Array.isArray(d.saved)) state.saved=new Set(d.saved);
  if(Array.isArray(d.history)) state.history=d.history;
  if(d.lastResult) state.lastResult=d.lastResult;
  if(d.settings) state.settings={...state.settings,...d.settings};
  if(typeof d.view==='string' && d.view!=='session') state.view=d.view;
  if(d.session && Array.isArray(d.session.queueIds)){
    const queue=d.session.queueIds.map(id=>Q.find(q=>q.id===id)).filter(Boolean);
    if(queue.length) state.session={...d.session,queue};
  }
  lastSaveAt=Number.isFinite(d.savedAt)?d.savedAt:Date.now();
  return true;
}
function openProgressDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB unavailable')); return; }
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function saveToIndexedDB(data){
  try{
    const db=await openProgressDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(data,'latest');
      tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error);
    });
    db.close();
  }catch(e){}
}
async function loadFromIndexedDB(){
  try{
    const db=await openProgressDB();
    const data=await new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).get('latest');
      req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error);
    });
    db.close();
    return data;
  }catch(e){ return null; }
}
function saveState(){
  const data=snapshotState();
  const raw=JSON.stringify(data);
  let localSaved=false;
  try{
    const previous=localStorage.getItem(STABLE_STORAGE_KEY);
    if(previous && previous!==raw) localStorage.setItem(STORAGE_BACKUP_KEY,previous);
    localStorage.setItem(STABLE_STORAGE_KEY,raw);
    localStorage.setItem(STORAGE_KEY,raw); // compatibilidad con versiones anteriores
    localSaved=true;
  }catch(e){}
  lastSaveAt=data.savedAt;
  if(localSaved) hasLocalSavedState=true;
  saveToIndexedDB(data);
}
function loadState(){
  let candidates=[];
  try{
    candidates=[
      localStorage.getItem(STABLE_STORAGE_KEY),
      localStorage.getItem(STORAGE_KEY),
      localStorage.getItem(STORAGE_BACKUP_KEY)
    ].filter(Boolean);
  }catch(e){}
  for(const raw of candidates){
    try{
      const ok=applySavedData(JSON.parse(raw));
      if(ok){ hasLocalSavedState=true; return true; }
    }catch(e){}
  }
  return false;
}
async function restoreIndexedDBFallback(){
  if(hasLocalSavedState) return;
  const data=await loadFromIndexedDB();
  if(data && applySavedData(data)){
    hasLocalSavedState=true;
    try{ const raw=JSON.stringify(data); localStorage.setItem(STABLE_STORAGE_KEY,raw); localStorage.setItem(STORAGE_KEY,raw); localStorage.setItem(STORAGE_BACKUP_KEY,raw); }catch(e){}
    applyThemeMode();
    render();
  }
}
function hexToRgb(hex){ const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||''); return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:null; }
function applyAccentColor(){
  const hex=state.settings.accentColor||'#8B2635';
  const rgb=hexToRgb(hex)||{r:139,g:38,b:53};
  document.documentElement.style.setProperty('--accent',hex);
  const alpha=state.theme==='dark'?.18:.14;
  document.documentElement.style.setProperty('--accent-soft',`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`);
}
function applyThemeMode(){
  const mode=state.settings.themeMode||'light';
  const actual=mode==='auto' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : mode;
  state.theme=actual;
  document.body.setAttribute('data-theme',actual);
  applyAccentColor();
}
const loadedExistingState=loadState();
applyThemeMode();
if(loadedExistingState) saveState(); // migra automáticamente a la clave estable sin borrar nada

function computeMastery(topicId){
  const s = state.stats[topicId];
  if(!s || s.attempts===0) return {pct:0, status:'none'};
  const overall = s.correct/s.attempts;
  const recentArr = s.recent.slice(-8);
  const recentAcc = recentArr.length? recentArr.filter(Boolean).length/recentArr.length : 0;
  let pct = Math.round((overall*0.4 + recentAcc*0.6)*100);
  let status;
  if(s.attempts < 3) status='progress';
  else if(pct>=80 && s.attempts>=8 && recentArr.length>=5 && recentArr.slice(-5).filter(Boolean).length>=4) status='mastered';
  else if(pct>=55) status='almost';
  else status='progress';
  return {pct, status};
}
function overallMastery(){
  const all = TOPICS.map(t=>computeMastery(t.id).pct);
  return Math.round(all.reduce((a,b)=>a+b,0)/all.length);
}
function statusLabel(s){
  return {none:'No estudiado', progress:'En progreso', almost:'Casi dominado', mastered:'Dominado'}[s];
}
function statusPillClass(s){
  return {none:'pill-none', progress:'pill-progress', almost:'pill-almost', mastered:'pill-mastered'}[s];
}

function recordAnswer(q, correct){
  if(state.session && state.session.mode==='practica' && state.session.countStats===false) return;
  state.totalAnswered++;
  if(correct) state.totalCorrect++;
  state.currentStreak = correct? state.currentStreak+1 : 0;
  state.bestStreak = Math.max(state.bestStreak, state.currentStreak);
  const s = state.stats[q.topic];
  s.attempts++;
  if(correct) s.correct++;
  s.recent.push(correct);
  if(s.recent.length>20) s.recent.shift();
  if(!correct){
    let ex = state.errors.find(e=>e.qid===q.id);
    if(ex){ ex.times++; ex.last=Date.now(); }
    else state.errors.push({qid:q.id, times:1, last:Date.now()});
  } else {
    // remove from errors after 2 consecutive later correct answers handled elsewhere; keep simple: leave record but could be re-practiced
  }
  saveState();
}

function ringSvg(pct, size=150, stroke=12){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const off = c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg-soft)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .5s ease"/>
  </svg>`;
}
function weakestTopic(){
  const studied=TOPICS.filter(t=>state.stats[t.id]?.attempts>0);
  if(!studied.length) return null;
  return studied.reduce((best,t)=>computeMastery(t.id).pct<computeMastery(best.id).pct?t:best, studied[0]);
}

/* =========================================================
   SESSION ENGINE
========================================================= */
function shuffle(arr){ return arr.map(a=>[Math.random(),a]).sort((a,b)=>a[0]-b[0]).map(a=>a[1]); }

function startSession(opts){
  attemptStage = 0;
  let pool;
  if(opts.special==='debiles'){
    const sorted = [...TOPICS].sort((a,b)=>computeMastery(a.id).pct - computeMastery(b.id).pct);
    const weakIds = sorted.slice(0,2).map(t=>t.id);
    pool = Q.filter(q=>weakIds.includes(q.topic));
  } else if(opts.special==='adaptativo'){
    // Prioriza temas débiles sin duplicar preguntas dentro de la misma sesión.
    pool = Q.map(q=>{
      const m=computeMastery(q.topic);
      const weight=m.pct<50?3:m.pct<80?2:1;
      const u=Math.max(Math.random(),1e-9);
      return {q, key:-Math.log(u)/weight};
    }).sort((a,b)=>a.key-b.key).map(x=>x.q);
  } else if(opts.topics && opts.topics.length){
    pool = Q.filter(q=>opts.topics.includes(q.topic));
  } else if(opts.topic){
    pool = Q.filter(q=>q.topic===opts.topic);
  } else if(opts.errorsOnly){
    pool = state.errors.map(e=>Q.find(q=>q.id===e.qid)).filter(Boolean);
  } else if(opts.savedOnly){
    pool = [...state.saved].map(id=>Q.find(q=>q.id===id)).filter(Boolean);
  } else {
    pool = Q.slice();
  }
  pool = shuffle(pool);
  if(opts.limit) pool = pool.slice(0, Math.min(opts.limit, pool.length));
  if(pool.length===0) pool = shuffle(Q).slice(0, opts.limit||10);

  state.session = {
    mode: opts.mode, // 'practica' | 'examen'
    queue: pool,
    idx: 0,
    answers: [], // {qid, correct, userAnswer, usedHint}
    hintsUsed: 0,
    hintLevel: 0,
    answered:false,
    startedAt: Date.now(),
    miniReviewShown:false,
    countStats: opts.mode==='examen' ? true : opts.countStats!==false,
    returnView: opts.mode==='examen' ? 'examen' : 'practica',
  };
  saveState();
  goto('session');
}

function currentQ(){ const s=state.session; return s.queue[s.idx]; }

function renderSession(main){
  const s = state.session;
  if(!s){ goto('dashboard'); return; }
  const q = currentQ();
  const total = s.queue.length;
  const t = TOPICS.find(x=>x.id===q.topic);

  // check for "mini repaso" trigger: 3 consecutive fails on same topic recently in this session
  const recentSameTopicFails = s.answers.filter(a=>a.qid && Q.find(qq=>qq.id===a.qid).topic===q.topic).slice(-3);
  const needsMini = s.mode==='practica' && !s.miniReviewShown && recentSameTopicFails.length===3 && recentSameTopicFails.every(a=>!a.correct);

  let bodyHtml = '';
  if(needsMini){
    const card = REVIEW_CARDS.find(c=>c.topic===q.topic);
    bodyHtml = `<div class="mini-review">
      <h4>Parece que necesitas repasar esto.</h4>
      <p style="margin:0 0 6px 0;"><b>${card.title}:</b> ${card.def}</p>
      <p style="margin:0;color:var(--ink-soft);font-size:.87rem;">Ejemplo: ${card.example}</p>
      <button class="btn amber" id="miniOk" style="margin-top:12px;">Entendido, continuar</button>
    </div>`;
    main.innerHTML = `<div class="q-wrap"><div class="q-topbar"><button class="icon-btn" id="quitSession">✕ Salir</button><span>${s.idx+1} / ${total}</span></div>${bodyHtml}</div>`;
    document.getElementById('quitSession').addEventListener('click', confirmQuit);
    document.getElementById('miniOk').addEventListener('click', ()=>{ s.miniReviewShown=true; render(); });
    return;
  }
  s.miniReviewShown=false;

  const isExam = s.mode==='examen';
  const starred = state.saved.has(q.id);

  main.innerHTML = `
    <div class="q-wrap">
      <div class="q-topbar">
        <div class="btn-row">
          <button class="icon-btn" id="quitSession">✕ ${isExam?'Abandonar examen':'Salir'}</button>
          ${s.answers.length?'<button class="icon-btn" id="reviewPreviousBtn">← Ver anterior</button>':''}
        </div>
        <span>${t.icon} ${t.name} · ${s.idx+1} / ${total} ${isExam?'':''}</span>
      </div>
      <div class="q-progress"><div class="q-progress-fill" style="width:${(s.idx)/total*100}%"></div></div>
      <div class="q-card">
        <span class="q-topic-tag">${t.name} · ${q.dif}</span>
        <div id="qBody"></div>
        <div id="feedbackZone"></div>
        <div id="hintZone"></div>
      </div>
      <div class="q-actions">
        <div class="btn-row">
          <button class="icon-btn ${starred?'starred':''}" id="starBtn">${starred?'★ Guardada':'☆ Guardar'}</button>
          <button class="icon-btn" id="skipBtn">Saltar</button>
          <button class="icon-btn" id="restartQBtn">↺ Reiniciar</button>
        </div>
        <div class="btn-row">
          ${!isExam? `<button class="icon-btn" id="hintBtn">💡 Pista (${q.hints? Math.min(s.hintLevel,q.hints.length):0}/${q.hints?q.hints.length:0})</button>`:''}
          <button class="btn" id="submitBtn" disabled>Responder</button>
        </div>
      </div>
      <p class="kbd-hint">Atajo: presiona <kbd>Enter</kbd> para responder/continuar</p>
    </div>`;

  document.getElementById('quitSession').addEventListener('click', confirmQuit);
  const reviewPrevBtn=document.getElementById('reviewPreviousBtn');
  if(reviewPrevBtn) reviewPrevBtn.addEventListener('click', ()=>renderAnsweredReview(s.answers.length-1));
  document.getElementById('starBtn').addEventListener('click', ()=>{
    if(state.saved.has(q.id)) state.saved.delete(q.id); else state.saved.add(q.id);
    saveState();
    render();
  });
  document.getElementById('skipBtn').addEventListener('click', ()=> nextQuestion(null,false,true));
  document.getElementById('restartQBtn').addEventListener('click', ()=>{ attemptStage=0; sessionSelection=null; s.hintLevel=0; s.answered=false; render(); });
  if(!isExam) document.getElementById('hintBtn').addEventListener('click', showHint);

  renderQuestionBody(q, isExam);
}

function renderAnsweredReview(answerIndex){
  const s=state.session;
  if(!s || !s.answers.length){ render(); return; }
  const idx=Math.max(0,Math.min(answerIndex,s.answers.length-1));
  const a=s.answers[idx];
  const q=Q.find(x=>x.id===a.qid);
  if(!q){ render(); return; }
  const t=TOPICS.find(x=>x.id===q.topic);
  const main=document.getElementById('main');
  main.innerHTML=`
    <div class="q-wrap">
      <div class="q-topbar">
        <button class="icon-btn" id="backCurrent">← Volver a la pregunta actual</button>
        <span>Revisión · ${idx+1} / ${s.answers.length}</span>
      </div>
      <div class="q-card">
        <span class="q-topic-tag">${t.icon} ${t.name} · ${q.dif}</span>
        <h2 style="font-size:1.18rem;margin:12px 0;">${q.prompt}</h2>
        <div class="feedback ${a.correct?'good':'bad'}">
          <b>${a.skipped?'○ Saltada':a.correct?'✓ La sacaste bien':'✗ La sacaste mal'}</b>
          ${a.skipped
            ? `<div class="detail-block"><div class="detail-title">Respuesta correcta</div><div><span class="detail-answer">${escHtml(correctAnswerLabel(q))}</span></div><div class="detail-tip"><b>Explicación:</b> ${escHtml(q.exp||recognitionTip(q))}</div></div>`
            : detailedExplanation(q,a.userAnswer,a.correct)}
        </div>
        <div class="btn-row" style="margin-top:16px;justify-content:space-between;">
          <button class="icon-btn" id="reviewPrev" ${idx===0?'disabled':''}>← Más anterior</button>
          <button class="icon-btn" id="reviewNext" ${idx===s.answers.length-1?'disabled':''}>Más reciente →</button>
        </div>
      </div>
    </div>`;
  document.getElementById('backCurrent').addEventListener('click',render);
  document.getElementById('reviewPrev').addEventListener('click',()=>renderAnsweredReview(idx-1));
  document.getElementById('reviewNext').addEventListener('click',()=>renderAnsweredReview(idx+1));
}

function confirmQuit(){
  const s=state.session;
  if(confirm('¿Seguro que quieres salir de esta sesión?')){
    const back=s&&s.returnView ? s.returnView : (s&&s.mode==='examen'?'examen':'practica');
    state.session=null;
    saveState();
    goto(back);
  }
}

let sessionSelection = null; // holds current user selection before submit

function renderQuestionBody(q, isExam){
  sessionSelection = null;
  const box = document.getElementById('qBody');
  if(q.type==='mc'){
    box.innerHTML = `<p class="q-prompt">${q.prompt}</p><div class="opt-list">
      ${q.options.map((o,i)=>`<div class="opt" data-i="${i}"><span class="opt-letter">${String.fromCharCode(65+i)}</span><span>${o}</span></div>`).join('')}
    </div>`;
    box.querySelectorAll('.opt').forEach(o=>o.addEventListener('click', ()=>{
      box.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
      o.classList.add('selected'); sessionSelection=parseInt(o.dataset.i);
      enableSubmit();
    }));
  } else if(q.type==='tf'){
    box.innerHTML = `<p class="q-prompt">${q.prompt}</p><div class="tf-row">
      <div class="opt" data-v="true"><span>Verdadero</span></div>
      <div class="opt" data-v="false"><span>Falso</span></div>
    </div>`;
    box.querySelectorAll('.opt').forEach(o=>o.addEventListener('click', ()=>{
      box.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
      o.classList.add('selected'); sessionSelection = o.dataset.v==='true';
      enableSubmit();
    }));
  } else if(q.type==='fill'){
    box.innerHTML = `<p class="q-prompt">${q.prompt}</p><input class="fill-input" id="fillInput" type="text" placeholder="Escribe tu respuesta" autocomplete="off">`;
    document.getElementById('fillInput').addEventListener('input', e=>{ sessionSelection=e.target.value; enableSubmit(); });
  } else if(q.type==='seg'){
    box.innerHTML = `<p class="q-prompt">${q.prompt}</p>
      <p class="seg-key">MDP = prefijo · LEX = lexema · INF = infijo · MDS = sufijo · MF = morfema flexivo</p>
      <div class="seg-word">${q.parts.map((p,i)=>`
        <div class="seg-chunk"><div class="txt">${p.text}</div>
        <select data-i="${i}">
          <option value="">—</option>
          <option value="MDP">MDP</option><option value="LEX">LEX</option>
          <option value="INF">INF</option><option value="MDS">MDS</option>
          <option value="MF">MF</option>
        </select></div>`).join('')}</div>`;
    box.querySelectorAll('select').forEach(sel=>sel.addEventListener('change', ()=>{
      const sels=[...box.querySelectorAll('select')];
      sessionSelection = sels.map(s=>s.value);
      enableSubmit(sessionSelection.every(v=>v!==''));
    }));
  } else if(q.type==='eviden'){
    box.innerHTML = `<p class="q-prompt">${q.prompt}</p>
      <div class="q-reading">${q.reading.map((s,i)=>`<span class="sent" data-i="${i}">${s}</span> `).join('')}</div>
      ${q.followup? `<div class="opt-list">${q.followup.options.map((o,i)=>`<div class="opt" data-fi="${i}"><span class="opt-letter">${String.fromCharCode(65+i)}</span><span>${o}</span></div>`).join('')}</div>` : ''}`;
    let pickedSentence=null, pickedFollow=null;
    box.querySelectorAll('.sent').forEach(sp=>sp.addEventListener('click', ()=>{
      box.querySelectorAll('.sent').forEach(x=>x.classList.remove('picked'));
      sp.classList.add('picked'); pickedSentence=parseInt(sp.dataset.i);
      sessionSelection = {sentence:pickedSentence, follow:pickedFollow};
      enableSubmit(pickedSentence!==null && (!q.followup || pickedFollow!==null));
    }));
    if(q.followup) box.querySelectorAll('[data-fi]').forEach(o=>o.addEventListener('click', ()=>{
      box.querySelectorAll('[data-fi]').forEach(x=>x.classList.remove('selected'));
      o.classList.add('selected'); pickedFollow=parseInt(o.dataset.fi);
      sessionSelection = {sentence:pickedSentence, follow:pickedFollow};
      enableSubmit(pickedSentence!==null && pickedFollow!==null);
    }));
  }
  document.getElementById('feedbackZone').innerHTML='';
  document.getElementById('hintZone').innerHTML='';
  state.session.hintLevel=0;
}
function enableSubmit(force){
  const btn=document.getElementById('submitBtn');
  if(force===undefined) btn.disabled = (sessionSelection===null || sessionSelection==='');
  else btn.disabled = !force;
  btn.onclick = submitAnswer;
}

function showHint(){
  const q=currentQ(); const s=state.session;
  if(!q.hints || s.hintLevel>=q.hints.length) return;
  s.hintLevel++;
  const zone=document.getElementById('hintZone');
  zone.innerHTML = q.hints.slice(0,s.hintLevel).map((h,i)=>`<div class="hint-box"><b>Pista ${i+1}:</b> ${h}</div>`).join('');
  document.getElementById('hintBtn').textContent = `💡 Pista (${s.hintLevel}/${q.hints.length})`;
  if(s.hintLevel>=q.hints.length) document.getElementById('hintBtn').disabled=true;
  saveState();
}

function checkCorrectness(q, ans){
  if(q.type==='mc') return ans===q.correct;
  if(q.type==='tf') return ans===q.correct;
  if(q.type==='fill') return ans && ans.trim().toLowerCase()===q.answer.toLowerCase();
  if(q.type==='seg') return q.parts.every((p,i)=>ans[i]===p.role);
  if(q.type==='eviden'){
    const okSentence = ans.sentence===q.correctSentence;
    const okFollow = q.followup? ans.follow===q.followup.correct : true;
    return okSentence && okFollow;
  }
  return false;
}

function escHtml(v){
  return String(v??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function answerLabel(q, ans){
  if(q.type==='mc') return q.options?.[ans] ?? 'Sin respuesta';
  if(q.type==='tf') return ans===true?'Verdadero':ans===false?'Falso':'Sin respuesta';
  if(q.type==='fill') return ans || 'Sin respuesta';
  if(q.type==='seg') return Array.isArray(ans)? ans.join(' · ') : 'Sin respuesta';
  if(q.type==='eviden'){
    const sent = Number.isInteger(ans?.sentence) ? q.reading?.[ans.sentence] : null;
    const follow = q.followup && Number.isInteger(ans?.follow) ? q.followup.options?.[ans.follow] : null;
    return [sent?`Oración: “${sent}”`:null, follow?`Clasificación: ${follow}`:null].filter(Boolean).join(' · ') || 'Sin respuesta';
  }
  return 'Sin respuesta';
}
function correctAnswerLabel(q){
  if(q.type==='mc') return q.options?.[q.correct] ?? '';
  if(q.type==='tf') return q.correct?'Verdadero':'Falso';
  if(q.type==='fill') return q.answer || '';
  if(q.type==='seg') return q.parts?.map(p=>`${p.text || p.part || p.segment || ''} = ${p.role}`).join(' · ') || '';
  if(q.type==='eviden'){
    const sent=q.reading?.[q.correctSentence];
    const follow=q.followup ? q.followup.options?.[q.followup.correct] : null;
    return [sent?`“${sent}”`:null, follow].filter(Boolean).join(' · ');
  }
  return '';
}
function recognitionTip(q){
  const hs=(q.hints||[]).filter(Boolean);
  if(hs.length) return hs[hs.length-1];
  const topic=TOPICS.find(t=>t.id===q.topic)?.name || 'este tema';
  return `Relaciona la definición con la característica clave de ${topic}.`;
}
function detailedExplanation(q, ans, correct){
  const selected=answerLabel(q, ans);
  const right=correctAnswerLabel(q);
  let html='';
  if(correct){
    html += `<div class="detail-block"><div class="detail-title">¿Por qué está bien?</div><div>Escogiste <span class="detail-answer">${escHtml(selected)}</span>. Esa respuesta es correcta porque ${q.exp}</div>`;
  } else {
    html += `<div class="detail-block"><div class="detail-title">¿Por qué estaba mal?</div><div>Escogiste <span class="detail-answer">${escHtml(selected)}</span>, pero la respuesta correcta es <span class="detail-answer">${escHtml(right)}</span>. ${q.exp}</div>`;
  }
  html += `<div class="detail-tip"><b>Cómo reconocerlo la próxima vez:</b> ${escHtml(recognitionTip(q))}</div></div>`;
  return html;
}

let attemptStage = 0; // for practice mode two-try flow
function submitAnswer(){
  const q=currentQ(); const s=state.session;
  const isExam = s.mode==='examen';
  const correct = checkCorrectness(q, sessionSelection);
  const box=document.getElementById('qBody');
  const fb=document.getElementById('feedbackZone');

  if(isExam){
    s.answers.push({qid:q.id, correct, hintsUsed:s.hintLevel, userAnswer:sessionSelection});
    saveState();
    document.getElementById('submitBtn').textContent='Siguiente';
    document.getElementById('submitBtn').disabled=false;
    document.getElementById('submitBtn').onclick = ()=>advance();
    document.querySelectorAll('.opt,.fill-input,select,.sent').forEach(el=>{el.style.pointerEvents='none'; if('disabled' in el) el.disabled=true;});
    return;
  }

  // Práctica con dos intentos: el primer fallo NO revela la respuesta correcta.
  if(correct){
    markAnswerVisual(q, sessionSelection, true);
    fb.innerHTML = `<div class="feedback good"><b>✓ Correcto</b>${detailedExplanation(q, sessionSelection, true)}</div>`;
    s.answers.push({qid:q.id, correct:true, hintsUsed:s.hintLevel, userAnswer:sessionSelection});
    recordAnswer(q, true);
    finalizeStep(true);
  } else if(attemptStage===0){
    attemptStage=1;
    fb.innerHTML = `<div class="feedback bad"><b>✗ Incorrecto</b>Inténtalo otra vez. ${q.hints?'Puedes usar una pista.':''}</div>`;
    document.getElementById('submitBtn').textContent='Responder de nuevo';
    document.getElementById('submitBtn').disabled=true;
    reenableInputs(q);
  } else {
    markAnswerVisual(q, sessionSelection, false);
    fb.innerHTML = `<div class="feedback bad"><b>✗ Incorrecto</b>${detailedExplanation(q, sessionSelection, false)}</div>`;
    s.answers.push({qid:q.id, correct:false, hintsUsed:s.hintLevel, userAnswer:sessionSelection});
    recordAnswer(q, false);
    finalizeStep(false);
  }
}
function reenableInputs(q){
  const box=document.getElementById('qBody');
  sessionSelection=null;
  box.querySelectorAll('.opt').forEach(o=>{ o.classList.remove('selected','correct','incorrect'); o.style.pointerEvents='auto'; });
  box.querySelectorAll('select').forEach(s=>{ s.disabled=false; s.classList.remove('correct','incorrect'); s.value=''; });
  const fillEl = document.getElementById('fillInput'); if(fillEl){ fillEl.disabled=false; fillEl.classList.remove('correct','incorrect'); fillEl.value=''; }
  box.querySelectorAll('.sent').forEach(s=>{ s.style.pointerEvents='auto'; s.classList.remove('picked','correct','incorrect'); });
  document.getElementById('submitBtn').disabled=true;
}
function markAnswerVisual(q, ans, correct){
  const box=document.getElementById('qBody');
  if(q.type==='mc'){
    box.querySelectorAll('.opt').forEach((o,i)=>{
      o.style.pointerEvents='none';
      if(i===q.correct) o.classList.add('correct');
      else if(i===ans) o.classList.add('incorrect');
    });
  } else if(q.type==='tf'){
    box.querySelectorAll('.opt').forEach(o=>{
      o.style.pointerEvents='none';
      const v = o.dataset.v==='true';
      if(v===q.correct) o.classList.add('correct');
      else if(v===ans) o.classList.add('incorrect');
    });
  } else if(q.type==='fill'){
    const el=document.getElementById('fillInput'); el.disabled=true;
    el.classList.add(correct?'correct':'incorrect');
  } else if(q.type==='seg'){
    box.querySelectorAll('select').forEach((sel,i)=>{
      sel.disabled=true;
      sel.classList.add(sel.value===q.parts[i].role?'correct':'incorrect');
    });
  } else if(q.type==='eviden'){
    box.querySelectorAll('.sent').forEach((sp,i)=>{
      sp.style.pointerEvents='none';
      if(i===q.correctSentence) sp.classList.add('correct');
      else if(i===ans.sentence) sp.classList.add('incorrect');
    });
    if(q.followup) box.querySelectorAll('[data-fi]').forEach((o,i)=>{
      o.style.pointerEvents='none';
      if(i===q.followup.correct) o.classList.add('correct');
      else if(i===ans.follow) o.classList.add('incorrect');
    });
  }
}
function finalizeStep(correct){
  document.getElementById('submitBtn').textContent = state.session.idx===state.session.queue.length-1? 'Ver resultados':'Siguiente pregunta';
  document.getElementById('submitBtn').disabled=false;
  document.getElementById('submitBtn').onclick = ()=>advance();
  document.getElementById('hintBtn') && (document.getElementById('hintBtn').disabled=true);
}
function nextQuestion(ans, correct, skipped){
  if(skipped){
    const q=currentQ();
    state.session.answers.push({qid:q.id, correct:false, skipped:true, userAnswer:null});
  }
  advance();
}
function advance(){
  attemptStage=0;
  const s=state.session;
  if(s.idx < s.queue.length-1){ s.idx++; saveState(); render(); }
  else { finishSession(); }
}
function finishSession(){
  const s=state.session;
  const total = s.answers.length;
  const correctCount = s.answers.filter(a=>a.correct).length;
  const pct = total? Math.round(correctCount/total*100):0;
  const elapsed = Math.round((Date.now()-s.startedAt)/1000);
  const countsTowardProgress = s.mode==='examen' || s.countStats!==false;
  if(countsTowardProgress) state.studySeconds += elapsed;
  if(s.mode==='examen'){
    s.answers.filter(a=>!a.skipped).forEach(a=>{
      const q=Q.find(x=>x.id===a.qid);
      if(q) recordAnswer(q, !!a.correct);
    });
  }

  const byTopic={};
  s.answers.forEach(a=>{
    const q=Q.find(x=>x.id===a.qid); if(!q) return;
    byTopic[q.topic] = byTopic[q.topic]||{c:0,t:0};
    byTopic[q.topic].t++; if(a.correct) byTopic[q.topic].c++;
  });

  // El historial guarda TODAS las sesiones para poder revisarlas después.
  // countsTowardProgress solo controla si afecta las estadísticas del Panel.
  state.history.push({
    id:`${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
    date:new Date().toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric'}),
    time: new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),
    mode:s.mode, total, correct:correctCount, pct, seconds:elapsed,
    byTopic, countsTowardProgress,
    answers:s.answers.map(a=>({qid:a.qid,correct:!!a.correct,skipped:!!a.skipped,hintsUsed:a.hintsUsed||0,userAnswer:a.userAnswer??null}))
  });

  state.lastResult = {total, correctCount, pct, elapsed, byTopic, answers:s.answers, mode:s.mode, countsTowardProgress};
  const completedResult=state.lastResult;
  state.session=null;
  saveState();
  if(completedResult.mode==='examen') submitLeaderboardScore(completedResult);
  goto('results');
}

        <p class="section-title" style="margin-top:16px;">Necesitas repasar</p>
        <p style="font-size:.88rem;">${wrong.length? `Revisa: ${[...new Set(wrong.map(q=>TOPICS.find(t=>t.id===q.topic).name))].join(', ')}.` : '¡No fallaste ninguna pregunta!'}</p>
        <p class="section-title" style="margin-top:16px;">Próximo paso recomendado</p>
        <p style="font-size:.88rem;">${wrong.length>2? 'Practica el modo "Temas débiles" antes de intentar otro examen.' : 'Estás listo para intentar un examen más largo.'}</p>
      </div>
    </div>
    ${wrong.length? `<div class="card" style="margin-top:20px;">
      <p class="section-title">Preguntas falladas</p>
      ${wrong.map(q=>`<div class="err-item"><div class="q">${q.prompt}</div><div class="meta">${TOPICS.find(t=>t.id===q.topic).name}</div></div>`).join('')}
    </div>`:''}
    ${r.mode==='examen'? `<div class="card" style="margin-top:20px;">
      <p class="section-title">Explicación de cada respuesta</p>
      <p style="font-size:.86rem;color:var(--ink-soft);margin-bottom:14px;">Durante el examen no se muestran respuestas para no darte pistas. Aquí puedes revisar por qué cada contestación estuvo bien o mal.</p>
      ${r.answers.map((a,i)=>{ const q=Q.find(x=>x.id===a.qid); if(!q) return ''; return `<div class="err-item"><div class="q">${i+1}. ${q.prompt}</div><div class="feedback ${a.correct?'good':'bad'}" style="margin-top:10px;"><b>${a.correct?'✓ Correcto':'✗ Incorrecto'}</b>${detailedExplanation(q,a.userAnswer,a.correct)}</div></div>`; }).join('')}

function renderGuardadas(main){
  const ids=[...state.saved];
  main.innerHTML = `
    <div class="pagehead"><h1>Preguntas guardadas</h1><p>Preguntas que marcaste con ⭐ para volver a estudiarlas.</p></div>
    ${ids.length? `<div class="btn-row" style="margin-bottom:18px;"><button class="btn" id="practSaved">Practicar guardadas (${ids.length})</button></div>` : ''}

    }).join('') : `<div class="empty-state"><span class="ic">★</span>No has guardado preguntas todavía. Usa el botón "Guardar" durante la práctica.</div>`}
  `;
  if(ids.length) document.getElementById('practSaved').addEventListener('click', ()=>startSession({mode:'practica', savedOnly:true, countStats:state.settings.practiceCountsByDefault!==false}));
}

/* =========================================================
   HISTORIAL
========================================================= */
function renderHistorial(main){
  const h = state.history.slice().reverse();
  main.innerHTML = `
    <div class="pagehead"><h1>Historial</h1><p>Tus exámenes y sesiones de práctica anteriores. Toca una sesión para revisar sus preguntas.</p></div>
    ${h.length? `<div class="card" style="margin-bottom:20px;">
      <p class="section-title">Progreso reciente (%)</p>
      <div class="spark">${h.slice(0,14).reverse().map(x=>`<div style="height:${x.pct}%" title="${x.pct}%"></div>`).join('')}</div>
    </div>
    <div class="card">
      ${h.map((x,i)=>`<button class="hist-row hist-open" data-hi="${i}" style="width:100%;border:0;background:none;color:inherit;text-align:left;cursor:pointer;">
        <span>${x.mode==='examen'?'Examen':'Práctica'} · ${x.date} ${x.time}${x.countsTowardProgress===false?' · No contó al Panel':''}</span>
        <span>${x.correct}/${x.total} · ${x.pct}% · ${fmtTime(x.seconds)} ›</span>
      </button>`).join('')}
    </div>` : `<div class="empty-state"><span class="ic">▥</span>Todavía no tienes historial. Completa una práctica o examen.</div>`}
  `;
  main.querySelectorAll('.hist-open').forEach(b=>b.addEventListener('click',()=>renderHistoryDetail(h[Number(b.dataset.hi)])));
}

function renderHistoryDetail(entry){
  const main=document.getElementById('main');
  const answers=Array.isArray(entry?.answers)?entry.answers:[];
  main.innerHTML=`
    <div class="pagehead"><h1>Revisión de sesión</h1><p>${entry.mode==='examen'?'Examen':'Práctica'} · ${entry.date} ${entry.time} · ${entry.correct}/${entry.total} (${entry.pct}%)</p></div>
    <div class="btn-row" style="margin-bottom:18px;"><button class="icon-btn" id="backHistory">← Volver al historial</button></div>
    ${answers.length? `<div class="card">
      ${answers.map((a,i)=>{const q=Q.find(x=>x.id===a.qid);if(!q)return'';const t=TOPICS.find(x=>x.id===q.topic);return `<div class="err-item"><div class="q">${i+1}. ${q.prompt}</div><div class="meta">${t?.name||''}</div><div class="feedback ${a.correct?'good':'bad'}" style="margin-top:10px;"><b>${a.skipped?'○ Saltada':a.correct?'✓ La sacaste bien':'✗ La sacaste mal'}</b>${a.skipped?`<div class="detail-block"><div class="detail-title">Respuesta correcta</div><div><span class="detail-answer">${escHtml(correctAnswerLabel(q))}</span></div><div class="detail-tip"><b>Explicación:</b> ${escHtml(q.exp||recognitionTip(q))}</div></div>`:detailedExplanation(q,a.userAnswer,a.correct)}</div></div>`}).join('')}
    </div>` : `<div class="empty-state"><span class="ic">▥</span>Esta sesión es de una versión anterior y solo guardó el resultado general. Las sesiones nuevas sí guardarán cada pregunta y tu respuesta.</div>`}
  `;
  document.getElementById('backHistory').addEventListener('click',()=>goto('historial'));
}


/* =========================================================
   LEADERBOARD
========================================================= */
function ensureLeaderboardDeviceId(){
  if(!state.settings.leaderboardDeviceId){
    state.settings.leaderboardDeviceId=(crypto&&crypto.randomUUID)?crypto.randomUUID():`dev_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    saveState();
  }
  return state.settings.leaderboardDeviceId;
}
async function leaderboardRequest(method='GET', body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const res=await fetch('/.netlify/functions/leaderboard',opts);
  if(!res.ok) throw new Error(`Leaderboard ${res.status}`);
  return res.json();
}
async function submitLeaderboardScore(result){
  if(!result || result.mode!=='examen' || !state.settings.leaderboardName) return;
  try{
    await leaderboardRequest('POST',{
      deviceId:ensureLeaderboardDeviceId(),
      name:state.settings.leaderboardName,
      score:result.correctCount,
      total:result.total,
      pct:result.pct
    });
  }catch(e){}
}
function renderLeaderboard(main){
  const name=state.settings.leaderboardName||'';
  main.innerHTML=`
    <div class="pagehead"><h1>🏆 Leaderboard</h1><p>Compite con estudiantes que usan este mismo hub. Se publica tu mejor nota de examen.</p></div>
    <div class="card" style="margin-bottom:20px;">
      <p class="section-title">Tu perfil</p>
      <div class="setting-row"><div class="setting-copy"><b>Nombre visible</b><span>Este nombre será público en el leaderboard. No uses información privada.</span></div><div class="setting-control"><input id="leaderName" maxlength="24" value="${escHtml(name)}" placeholder="Tu nombre" style="min-width:180px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);"></div></div>
      <div class="btn-row"><button class="btn" id="saveLeaderName">${name?'Guardar nombre':'Registrarme para el leaderboard'}</button><span class="save-note" id="leaderSaveNote"></span></div>
    </div>
    <div class="card"><p class="section-title">Clasificación</p><div id="leaderList"><div class="empty-state"><span class="ic">…</span>Cargando leaderboard…</div></div></div>`;
  document.getElementById('saveLeaderName').addEventListener('click',async()=>{
    const v=document.getElementById('leaderName').value.trim().replace(/\s+/g,' ');
    if(v.length<2){alert('Escribe un nombre de al menos 2 caracteres.');return;}
    state.settings.leaderboardName=v.slice(0,24); ensureLeaderboardDeviceId(); saveState();
    document.getElementById('leaderSaveNote').textContent='Guardado ✓';
    await loadLeaderboard();
  });
  loadLeaderboard();
}
async function loadLeaderboard(){
  const box=document.getElementById('leaderList'); if(!box)return;
  try{
    const data=await leaderboardRequest('GET');
    const rows=Array.isArray(data.players)?data.players:[];
    box.innerHTML=rows.length?rows.map((p,i)=>`<div class="hist-row"><span><b>${i+1}.</b> ${escHtml(p.name)}${p.deviceId===state.settings.leaderboardDeviceId?' · Tú':''}</span><span><b>${p.bestPct}%</b> · ${p.bestScore}/${p.bestTotal} · ${p.exams} ${p.exams===1?'examen':'exámenes'}</span></div>`).join(''):`<div class="empty-state"><span class="ic">🏆</span>Todavía no hay notas publicadas.</div>`;
  }catch(e){
    box.innerHTML=`<div class="empty-state"><span class="ic">☁</span>El leaderboard online todavía no está conectado en este deploy. El resto del cuaderno funciona normalmente.</div>`;
  }
}

      <div class="update-item"><h3>Mejoras visuales del repaso</h3><p>Ejemplos de morfología y figuras literarias con las partes importantes resaltadas, manteniendo el diseño original del cuaderno.</p></div>

/* =========================================================
   CONFIGURACIÓN
========================================================= */
function renderAjustes(main){
  const selected=new Set(state.settings.examTopics||TOPICS.map(t=>t.id));
  main.innerHTML = `
    <div class="pagehead"><h1>Configuración</h1><p>Personaliza cómo funciona tu cuaderno en este dispositivo.</p></div>
    <div class="card" style="margin-bottom:20px;">
      <p class="section-title">Apariencia</p>
      <div class="setting-row"><div class="setting-copy"><b>Tema</b><span>Escoge claro, oscuro o automático según tu iPhone.</span></div><div class="setting-control"><select id="themeMode"><option value="light" ${state.settings.themeMode==='light'?'selected':''}>Claro</option><option value="dark" ${state.settings.themeMode==='dark'?'selected':''}>Oscuro</option><option value="auto" ${state.settings.themeMode==='auto'?'selected':''}>Automático</option></select></div></div>
      <div class="setting-row"><div class="setting-copy"><b>Color de la interfaz</b><span>Personaliza el color principal de botones, barras y selecciones.</span></div><div class="setting-control"><input id="accentColor" type="color" value="${escHtml(state.settings.accentColor||'#8B2635')}" style="width:52px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:3px;"></div></div>
    </div>
    <div class="card" style="margin-bottom:20px;">
      <p class="section-title">Práctica</p>
      <div class="setting-row"><div class="setting-copy"><b>Contar prácticas en el Panel por defecto</b><span>También puedes cambiarlo antes de cada práctica.</span></div><div class="setting-control"><label class="check-line"><input id="defaultCount" type="checkbox" ${state.settings.practiceCountsByDefault!==false?'checked':''}> Activado</label></div></div>
    </div>
    <div class="card" style="margin-bottom:20px;">
      <p class="section-title">Examen · temas predeterminados</p>
      <div class="check-list" id="defaultTopics">${TOPICS.map(t=>`<label class="check-line"><input type="checkbox" value="${t.id}" ${selected.has(t.id)?'checked':''}> ${t.icon} ${t.name}</label>`).join('')}</div>
    </div>
    <div class="btn-row"><button class="btn" id="saveSettings">💾 Guardar</button><span class="save-note" id="savedNote">${lastSaveAt?'Guardado automático activo ✓':'Guardado automático activo'}</span></div>`;
  document.getElementById('saveSettings').addEventListener('click',()=>{
    const topics=[...document.querySelectorAll('#defaultTopics input:checked')].map(x=>x.value);
    if(!topics.length){ alert('Selecciona al menos un tema para el examen.'); return; }
    state.settings.themeMode=document.getElementById('themeMode').value;
    state.settings.practiceCountsByDefault=document.getElementById('defaultCount').checked;
    state.settings.examTopics=topics;
    state.settings.accentColor=document.getElementById('accentColor').value||'#8B2635';
    applyThemeMode(); saveState(); renderNav();
    document.getElementById('savedNote').textContent='Guardado ✓';
    setTimeout(()=>{const n=document.getElementById('savedNote');if(n)n.textContent='';},1600);
  });
}

/* =========================================================
   TECLADO
========================================================= */
document.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const btn=document.getElementById('submitBtn');
    if(btn && !btn.disabled) btn.click();
  }
});

/* =========================================================
   GUARDADO REFORZADO
========================================================= */
// Guarda de forma periódica y también cuando iOS/Safari oculta o cierra la página.
setInterval(()=>{ saveState(); },5000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveState(); });
window.addEventListener('pagehide',saveState);
window.addEventListener('beforeunload',saveState);
window.addEventListener('pageshow',()=>{ if(!hasLocalSavedState) restoreIndexedDBFallback(); });
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

/* =========================================================
   INICIO
========================================================= */
if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const onScheme=()=>{ if(state.settings.themeMode==='auto'){ applyThemeMode(); renderNav(); } };
  if(mq.addEventListener) mq.addEventListener('change',onScheme); else if(mq.addListener) mq.addListener(onScheme);
}
render();
restoreIndexedDBFallback();
</script>
