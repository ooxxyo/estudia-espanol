<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEBE2;
  --bg-soft:#E5E0D3;
  --card:#FFFFFF;
  --ink:#22303A;
  --ink-soft:#5B6670;
  --line:#D9D2C0;
  --accent:#8B2635;
  --accent-soft:#F3DCDD;
  --amber:#B9772E;
  --amber-soft:#F3E3CC;
  --good:#3E7A58;
  --good-soft:#DCEBE1;
  --bad:#A63B3B;
  --bad-soft:#F4DCDC;
  --radius-card:14px;
  --radius-chip:999px;
  --shadow:0 1px 2px rgba(34,48,58,.06), 0 6px 20px rgba(34,48,58,.05);
}
[data-theme="dark"]{
  --bg:#1A1D21;
  --bg-soft:#212429;
  --card:#24272C;
  --ink:#EAE6DC;
  --ink-soft:#A3A99F;
  --line:#33373D;
  --accent:#E2828F;
  --accent-soft:#3A2429;
  --amber:#E0A667;
  --amber-soft:#3A2E1C;
  --good:#7FC49A;
  --good-soft:#1E2E26;
  --bad:#E08A8A;
  --bad-soft:#332022;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
button{font-family:inherit;}
.app{display:flex;min-height:100vh;}

/* ---- Nav rail ---- */
.rail{
  width:220px;flex-shrink:0;
  background:var(--bg-soft);
  border-right:1px solid var(--line);
  padding:22px 14px;
  display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.rail-brand{
  font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;
  padding:0 10px 18px 10px;line-height:1.25;
  border-bottom:1px solid var(--line);margin-bottom:12px;
}
.rail-brand span{display:block;font-family:'Inter';font-weight:500;font-size:.72rem;color:var(--ink-soft);margin-top:3px;}
.rail-brand-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.version-badge{
  display:inline-flex;align-items:center;
  font-family:'Inter',system-ui,sans-serif;
  font-size:.62rem;font-weight:700;line-height:1;
  padding:4px 6px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);color:var(--ink-soft);
}
.subject-overview{margin-top:20px;}
.subject-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.subject-block{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);}
.subject-block h3{font-size:1rem;margin:0 0 8px;}
.subject-tags{display:flex;gap:7px;flex-wrap:wrap;}
.subject-tag{font-size:.76rem;font-weight:600;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--bg-soft);}
.subject-empty{font-size:.82rem;color:var(--ink-soft);margin:0;}
.hub-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;}
.hub-date{display:inline-flex;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink-soft);font-size:.78rem;font-weight:700;white-space:nowrap;}
.hub-summary{margin-bottom:24px;}
.hub-summary .card{height:100%;}
.hub-progress{display:flex;align-items:center;gap:15px;}
.hub-progress strong{font-family:'Fraunces',Georgia,serif;font-size:2rem;font-weight:600;}
.hub-section{margin-top:28px;}
.hub-section-head{margin-bottom:12px;}
.hub-section-head h2{font-size:1.3rem;margin:0 0 3px;}
.hub-section-head p{margin:0;color:var(--ink-soft);font-size:.84rem;}
.hub-continue-card{padding:18px 20px;border-color:var(--accent);}
.hub-day{margin-top:26px;}
.hub-day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px;}
.hub-day-head h3{font-size:.9rem;margin:0;color:var(--ink-soft);font-family:'Inter',system-ui,sans-serif;}
.hub-day-head span{font-size:.76rem;color:var(--ink-soft);}
.subject-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
.hub-subject-card{display:flex;flex-direction:column;min-height:166px;}
.hub-subject-card.available{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
.hub-subject-card.unavailable{box-shadow:none;}
.subject-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.subject-emoji{font-size:1.65rem;line-height:1;}
.subject-status{font-size:.68rem;font-weight:800;padding:4px 8px;border-radius:999px;background:var(--bg-soft);color:var(--ink-soft);}
.hub-subject-card.available .subject-status{background:var(--accent-soft);color:var(--accent);}
.hub-subject-card h3{font-size:1.12rem;margin:14px 0 5px;}
.hub-subject-card p{margin:0 0 16px;color:var(--ink-soft);font-size:.82rem;line-height:1.45;}
.hub-subject-card .hub-subject-action{margin-top:auto;align-self:flex-start;}
.hub-upcoming-list{display:grid;gap:8px;}
.hub-upcoming-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:var(--card);}
.hub-upcoming-item p{margin:3px 0 0;color:var(--ink-soft);font-size:.8rem;}
.hub-upcoming-item time{color:var(--ink-soft);font-size:.8rem;font-weight:700;white-space:nowrap;}
.hub-secondary-actions{display:flex;gap:8px;flex-wrap:wrap;}
.review-continue{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg-soft);}
.review-continue p{margin:0 0 3px;color:var(--ink-soft);font-size:.78rem;}
.subject-context{font-size:.74rem;color:var(--ink-soft);font-weight:700;margin:0 0 7px;}
.system-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.online-badge{
  position:fixed;top:12px;right:14px;z-index:80;
  display:flex;align-items:center;gap:6px;
  padding:7px 10px;border:1px solid var(--line);border-radius:999px;
  background:color-mix(in srgb,var(--card) 94%,transparent);
  color:var(--ink-soft);font-size:.72rem;font-weight:700;
  box-shadow:var(--shadow);backdrop-filter:blur(8px);
}
.online-dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft);}
.experimental-card{border-color:var(--amber);background:linear-gradient(180deg,var(--card),var(--amber-soft));}
.experimental-warning{
  border:1px solid var(--amber);background:var(--amber-soft);border-radius:12px;
  padding:14px 16px;color:var(--ink);font-size:.88rem;line-height:1.5;
}
.experimental-warning b{display:block;margin-bottom:3px;}
.experimental-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.experimental-label{display:block;font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-bottom:7px;}
.experimental-select{
  width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);padding:9px 10px;font:inherit;
}
.experimental-chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;
  border:1px solid var(--amber);background:var(--amber-soft);font-size:.69rem;font-weight:800;
}
.resume-card{
  border:1px solid var(--accent);
  background:linear-gradient(180deg,var(--card),var(--accent-soft));
  margin-bottom:20px;
}
.resume-meta{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;
  color:var(--ink-soft);font-size:.78rem;
}
.resume-pill{
  display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);font-weight:700;
}
.save-exit-btn{border-color:var(--accent);color:var(--accent);}

@media(max-width:820px){.online-badge{top:8px;right:8px;font-size:.66rem;padding:6px 8px;}.experimental-controls{grid-template-columns:1fr;}}

@media (max-width:720px){.subject-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:620px){.subject-columns,.subject-grid{grid-template-columns:1fr;}.hub-subject-card{min-height:0}.hub-heading{display:block;}.hub-date{margin-top:12px;}.hub-upcoming-item{grid-template-columns:1fr;gap:6px}.hub-secondary-actions{display:grid;grid-template-columns:1fr 1fr}.hub-secondary-actions .icon-btn{width:100%}}

.nav-btn{
  display:flex;align-items:center;gap:10px;
  background:none;border:none;text-align:left;
  padding:10px 12px;border-radius:10px;cursor:pointer;
  color:var(--ink-soft);font-size:.92rem;font-weight:500;
  transition:background .15s ease, color .15s ease;
}
.nav-btn:hover{background:var(--card);}
.nav-btn.active{background:var(--accent);color:#fff;}
.nav-btn .ic{width:18px;text-align:center;font-size:1rem;}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);}
.theme-toggle{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;cursor:pointer;color:var(--ink);font-size:.85rem;
}

/* ---- mobile bottom nav ---- */
.mobile-nav{display:none;}
@media (max-width:820px){
  .rail{display:none;}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:var(--bg-soft);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50;overflow-x:hidden;gap:2px;
  }
  .mobile-nav .nav-btn{flex:1 1 0;flex-direction:column;gap:3px;font-size:.62rem;line-height:1.1;padding:7px 2px;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;}
  main{padding-bottom:78px !important;}
}

main{flex:1;padding:34px 40px;max-width:980px;margin:0 auto;width:100%;}
@media (max-width:820px){ main{padding:calc(20px + env(safe-area-inset-top)) 16px 90px;} .online-badge{top:calc(8px + env(safe-area-inset-top));} }

.pagehead{margin-bottom:26px;}
.pagehead h1{font-size:1.7rem;font-weight:600;margin:0 0 4px 0;}
.pagehead p{color:var(--ink-soft);margin:0;font-size:.95rem;}

/* ---- cards / grids ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:20px;box-shadow:var(--shadow);}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:720px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;} }
@media (max-width:480px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} }

/* ---- dashboard ring ---- */
.dash-top{display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
.ring-wrap{position:relative;width:150px;height:150px;flex-shrink:0;}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-num b{font-family:'Fraunces';font-size:2rem;font-weight:600;}
.ring-num span{font-size:.7rem;color:var(--ink-soft);}
.stat-box{padding:14px 16px;}
.stat-box b{display:block;font-family:'Fraunces';font-size:1.5rem;font-weight:600;}
.stat-box span{color:var(--ink-soft);font-size:.8rem;}

.topic-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.topic-row:last-child{border-bottom:none;}
.topic-row .tname{width:150px;flex-shrink:0;font-weight:600;font-size:.9rem;}
.bar-track{flex:1;height:8px;background:var(--bg-soft);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;background:var(--accent);transition:width .4s ease;}
.pill{font-size:.68rem;padding:3px 9px;border-radius:var(--radius-chip);font-weight:600;white-space:nowrap;}
.pill-none{background:var(--bg-soft);color:var(--ink-soft);}
.pill-progress{background:var(--amber-soft);color:var(--amber);}
.pill-almost{background:#DCE6F3;color:#3A5D8A;}
.pill-mastered{background:var(--good-soft);color:var(--good);}

.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:11px 18px;font-size:.92rem;font-weight:600;cursor:pointer;
  transition:transform .1s ease, opacity .15s ease;
}
.btn,.icon-btn,.chip{min-height:44px;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;}
.btn:hover{opacity:.92;}
.btn:active{transform:scale(.98);}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.soft{background:var(--accent-soft);color:var(--accent);}
.btn.amber{background:var(--amber);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--radius-chip);border:1px solid var(--line);background:var(--card);font-size:.82rem;font-weight:500;cursor:pointer;color:var(--ink);}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
[data-theme="dark"] .chip.active{background:var(--accent);border-color:var(--accent);}

.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 10px 2px;font-weight:600;}
/* deliberately used sparingly, only as small section labels above lists — not as a decorative eyebrow on every block */

.mode-card{cursor:pointer;transition:border-color .15s ease, transform .1s ease;text-align:left;color:var(--ink);width:100%;font:inherit;}
.mode-card:hover{border-color:var(--accent);}
.mode-card h3{margin:0 0 6px 0;font-size:1rem;}
.mode-card p{margin:0;color:var(--ink-soft);font-size:.83rem;line-height:1.4;}
.mode-card .ic{font-size:1.4rem;margin-bottom:8px;display:block;}

/* ---- question view ---- */
.q-wrap{max-width:700px;margin:0 auto;}
.q-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:.82rem;color:var(--ink-soft);}
.q-progress{height:6px;background:var(--bg-soft);border-radius:999px;overflow:hidden;margin-bottom:22px;}
.q-progress-fill{height:100%;background:var(--accent);transition:width .3s ease;}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow);}
.q-topic-tag{display:inline-block;background:var(--bg-soft);color:var(--ink-soft);font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:12px;}
.q-prompt{font-size:1.15rem;line-height:1.5;margin:0 0 20px 0;font-weight:500;}
.q-reading{background:var(--bg-soft);border-radius:10px;padding:16px 18px;margin-bottom:18px;font-size:.95rem;line-height:1.65;}
.q-reading .sent{cursor:pointer;padding:1px 2px;border-radius:4px;}
.q-reading .sent:hover{background:var(--accent-soft);}
.q-reading .sent.picked{background:var(--accent);color:#fff;}
.q-reading .sent.correct{background:var(--good-soft);color:var(--good);}
.q-reading .sent.incorrect{background:var(--bad-soft);color:var(--bad);}

.opt-list{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px solid var(--line);
  border-radius:11px;cursor:pointer;background:var(--card);font-size:.95rem;transition:border-color .12s ease, background .12s ease;
}
.opt:hover{border-color:var(--accent);}
.opt.selected{border-color:var(--accent);background:var(--accent-soft);}
.opt.correct{border-color:var(--good);background:var(--good-soft);}
.opt.incorrect{border-color:var(--bad);background:var(--bad-soft);}
.opt-letter{width:26px;height:26px;border-radius:50%;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;flex-shrink:0;}

.tf-row{display:flex;gap:12px;}
.tf-row .opt{flex:1;justify-content:center;}

.seg-word{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;justify-content:center;}
.seg-chunk{display:flex;flex-direction:column;align-items:center;gap:6px;}
.seg-chunk .txt{font-family:'Fraunces';font-size:1.4rem;font-weight:600;padding:6px 10px;background:var(--bg-soft);border-radius:8px;}
.seg-chunk select{padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:.78rem;font-weight:600;}
.seg-chunk select.correct{border-color:var(--good);background:var(--good-soft);}
.seg-chunk select.incorrect{border-color:var(--bad);background:var(--bad-soft);}
.seg-key{font-size:.78rem;color:var(--ink-soft);text-align:center;margin-bottom:10px;}

.fill-input{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:11px;font-size:1rem;background:var(--card);color:var(--ink);}
.fill-input:focus{outline:none;border-color:var(--accent);}
.fill-input.correct{border-color:var(--good);background:var(--good-soft);}
.fill-input.incorrect{border-color:var(--bad);background:var(--bad-soft);}

.feedback{margin-top:18px;padding:15px 17px;border-radius:11px;font-size:.9rem;line-height:1.5;}
.feedback.good{background:var(--good-soft);color:var(--good);}
.feedback.bad{background:var(--bad-soft);color:var(--bad);}
.feedback b{display:block;margin-bottom:4px;font-size:.95rem;}
.feedback .exp{color:var(--ink);margin-top:6px;}
.feedback .detail-block{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb, var(--line) 80%, transparent);}
.feedback .detail-title{font-weight:800;color:var(--ink);margin-bottom:4px;}
.feedback .detail-answer{font-weight:800;}
.feedback .detail-tip{margin-top:8px;color:var(--ink-soft);}
.feedback .detail-tip b{display:inline;color:inherit;font-size:inherit;margin:0;}
.feedback .learning-ref{
  margin-top:12px;
  display:grid;
  gap:9px;
}
.feedback .learning-box{
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--bg-soft);
  line-height:1.55;
}
.feedback .learning-box .learning-label{
  display:block;
  font-size:.7rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.045em;
  color:var(--ink-soft);
  margin-bottom:3px;
}
.feedback .learning-box.example-box{
  border-left:3px solid var(--accent);
}
.feedback .why-box{
  margin-top:10px;
  line-height:1.6;
}
.numeric-answer{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,.45fr);gap:12px}.numeric-answer label{display:grid;gap:6px;font-weight:700;font-size:.82rem}@media(max-width:520px){.numeric-answer{grid-template-columns:1fr}}
.science-practice-tools{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.science-tool-panel{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper-soft)}
.science-tool-panel[hidden]{display:none}.science-tool-panel p{margin:6px 0;color:var(--ink-soft);line-height:1.5}
.practice-exam-note{margin:10px 0 14px;padding:9px 12px;border-left:3px solid var(--accent);color:var(--ink-soft);font-size:.82rem;display:grid;gap:2px}
.practice-exam-note b{color:var(--ink)}
.calculator-display{display:block;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font:700 1.05rem/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right;overflow-wrap:anywhere}
.calculator-grid{display:grid;grid-template-columns:repeat(4,minmax(48px,1fr));gap:8px;margin-top:10px}
.calculator-key{min-height:46px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer;touch-action:manipulation}
.calculator-key:hover{border-color:var(--accent);color:var(--accent)}.calculator-key.equals{background:var(--accent);border-color:var(--accent);color:white}
.calculator-message{min-height:1.2em;margin:8px 0 0!important;font-size:.78rem}
@media(max-width:520px){.science-practice-tools>.btn-row{display:grid;grid-template-columns:1fr 1fr}.science-practice-tools .icon-btn{justify-content:center;width:100%}.calculator-grid{gap:7px}.calculator-key{min-height:48px}}
.formula-workspace{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--paper-soft);display:grid;gap:14px}
.workspace-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.workspace-head h3{margin:0;font-size:1rem}.workspace-target{font-size:.78rem;color:var(--ink-soft);font-weight:700}

.hint-box{margin-top:14px;background:var(--amber-soft);border-radius:10px;padding:12px 15px;font-size:.87rem;color:var(--ink);}
.hint-box b{color:var(--amber);}

.q-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap;gap:10px;}
.icon-btn{background:none;border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--ink-soft);font-size:.85rem;display:flex;align-items:center;gap:6px;min-height:44px;min-width:44px;}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-soft);}
.icon-btn.starred{color:var(--amber);border-color:var(--amber);}

.mini-review{background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;padding:18px;margin-bottom:18px;}
.mini-review h4{margin:0 0 8px 0;color:var(--amber);}

.results-hero{text-align:center;padding:30px 20px;}
.results-hero .big{font-family:'Fraunces';font-size:3rem;font-weight:600;}
.err-item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.err-item .q{font-weight:600;margin-bottom:4px;}
.err-item .meta{font-size:.78rem;color:var(--ink-soft);}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .ic{font-size:2.2rem;margin-bottom:10px;display:block;}

.kbd-hint{font-size:.75rem;color:var(--ink-soft);text-align:center;margin-top:10px;}
kbd{background:var(--bg-soft);border-radius:5px;padding:1px 6px;font-family:inherit;border:1px solid var(--line);}

.hist-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:.88rem;}
.hist-row:last-child{border-bottom:none;}
.spark{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:6px;}
.spark div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;}

.trick{background:var(--amber-soft);border-left:3px solid var(--amber);padding:9px 13px;border-radius:0 8px 8px 0;font-size:.85rem;margin-top:14px;}

@media (max-width:520px){
  .q-card{padding:18px;}
  .grid-2{grid-template-columns:1fr;}
}

/* ===== MEJORA VISUAL SEGURA ===== */
:root{
  --bg:#F3F0E8;
  --bg-soft:#E9E4D9;
  --card:#FCFBF7;
  --ink:#28343B;
  --ink-soft:#616B72;
  --line:#D6D0C5;
  --accent:#74414A;
  --accent-soft:#EEE1E3;
  --amber:#8C6B43;
  --amber-soft:#F1E8DB;
  --good:#5D7966;
  --good-soft:#E2ECE5;
  --bad:#925D5D;
  --bad-soft:#F0E3E2;
  --radius-card:15px;
  --shadow:0 1px 2px rgba(40,52,59,.04),0 8px 22px rgba(40,52,59,.05);
}
[data-theme="dark"]{
  --bg:#1C2023;
  --bg-soft:#22272B;
  --card:#282D31;
  --ink:#ECE8DF;
  --ink-soft:#B2B7B3;
  --line:#3A4044;
  --accent:#C1848D;
  --accent-soft:#3A2E31;
  --amber:#C09A68;
  --amber-soft:#382F25;
  --good:#87A48F;
  --good-soft:#28342C;
  --bad:#C78686;
  --bad-soft:#382A2A;
  --shadow:0 1px 2px rgba(0,0,0,.20),0 8px 22px rgba(0,0,0,.18);
}
body{line-height:1.55;}
.nav-btn.active{background:var(--accent);color:#FFF9F7;}
.btn{background:var(--accent);color:#FFF9F7;}
.btn:hover{opacity:.96;}
.card,.q-card{box-shadow:var(--shadow);}
.q-card{border-radius:15px;}
.feedback.good,.feedback.bad{color:var(--ink);}
.feedback.good b{color:var(--good);}
.feedback.bad b{color:var(--bad);}
.hint-box{
  border:1px solid var(--line);
  border-left:3px solid var(--amber);
  background:var(--amber-soft);
  color:var(--ink);
  line-height:1.58;
}
.hint-box b{color:var(--ink);}

/* Repaso visual */
.review-card{text-align:left !important;}
.review-definition{
  font-size:1.05rem;
  line-height:1.68;
  margin:0 auto;
  max-width:62ch;
}
.study-example{
  margin-top:20px;
  padding:16px 18px;
  background:var(--bg-soft);
  border:1px solid var(--line);
  border-radius:12px;
}
.study-example-label{
  display:block;
  font-size:.72rem;
  color:var(--ink-soft);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:10px;
}
.study-quote{
  font-family:'Fraunces',Georgia,serif;
  font-size:1.18rem;
  line-height:1.85;
}
.study-highlight{
  font-weight:700;
  padding:0 2px 1px;
  border-radius:3px;
  background:var(--accent-soft);
  border-bottom:2px solid var(--accent);
}
.study-note{
  border-top:1px solid var(--line);
  margin-top:14px;
  padding-top:12px;
  font-size:.9rem;
  line-height:1.55;
}
.study-note b{color:var(--accent);}

.morph-example{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin:14px 0 4px;
}
.morph-piece{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.morph-word{
  font-family:'Fraunces',Georgia,serif;
  font-size:1.3rem;
  font-weight:650;
  padding:9px 11px;
  border:1px solid var(--line);
  border-bottom:3px solid var(--accent);
  background:var(--card);
  border-radius:9px;
}
.morph-label{
  color:var(--ink-soft);
  font-size:.7rem;
  font-weight:700;
}
.morph-piece.infix .morph-word{
  background:var(--amber-soft);
  border-bottom-color:var(--amber);
}
.morph-piece.suffix .morph-word{
  background:var(--good-soft);
  border-bottom-color:var(--good);
}
.morph-piece.flex .morph-word{
  background:#E9E5EE;
  border-bottom-color:#756780;
}
[data-theme="dark"] .morph-piece.flex .morph-word{
  background:#342F39;
  border-bottom-color:#A99AB5;
}
.morph-plus{
  align-self:center;
  color:var(--ink-soft);
  font-weight:700;
  margin-top:8px;
}
.study-sequence{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}
.study-step{
  padding:7px 10px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:9px;
  font-weight:600;
  font-size:.86rem;
}
.study-arrow{color:var(--ink-soft);font-weight:700;}

@media (max-width:520px){
  .study-example{padding:14px;}
  .study-quote{font-size:1.08rem;}
  .morph-word{font-size:1.12rem;}
  .q-card{padding:18px 16px;}
}

<div id="onlineBadge" class="online-badge" title="Usuarios activos en los últimos 90 segundos"><span class="online-dot"></span><span id="onlineCount">… conectados</span></div>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <main id="main">
      <div class="card" style="margin:30px auto;max-width:680px;">
        <h2 style="margin-top:0;">Study Hub</h2>
        <p>La aplicación está cargando.</p>
        <p style="color:var(--ink-soft);font-size:.9rem;">Si este mensaje no desaparece, el visor donde abriste el archivo no permite ejecutar JavaScript. Abre el archivo directamente en Safari, Chrome, Edge o Firefox.</p>
      </div>
    </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div id="moreMenuRoot"></div>
<div id="pendingPracticeRoot"></div>

<script src="js/api-client.js"></script>
<script src="js/form-state.js"></script>
<script src="js/storage.js"></script>
<script src="js/study-planner.js"></script>
<script src="js/platform-ui.js"></script>
<script src="js/platform-extras.js"></script>
<script src="history-data.js"></script>
<script src="js/science-data.js"></script>
<script src="js/math-workspace.js"></script>
<script src="js/math-data.js"></script>
<script src="js/math-workspace-config.js"></script>
<script src="js/science-workspace-config.js"></script>
<script src="js/science-practice-tools.js"></script>
<script src="js/spanish-legacy-content.js"></script>
<script src="js/spanish-vocabulary.js"></script>
<script src="js/bug-report-ui.js"></script>
<script src="js/hub-ui.js"></script>
<script>
/* =========================================================
   DATOS: temas
========================================================= */
const TOPICS = [
  {id:'gramatica', name:'Gramática', icon:'✎'},
  {id:'morfologia', name:'Morfología', icon:'🧩'},
  {id:'narrativa', name:'Narrador', icon:'📖'},
  {id:'cronica', name:'Crónica', icon:'📰'},
  {id:'figuras', name:'Figuras literarias', icon:'✦'},
];
const HISTORY_CONTENT=window.HISTORY_CONTENT;
const SCIENCE_CONTENT=window.SCIENCE_CONTENT;
const MATH_CONTENT=window.MATH_CONTENT;
const SPANISH_VOCABULARY=window.SpanishVocabulary;
const VOCAB_TOPIC={id:'vocabulario',name:'Vocabulario',icon:'🗂️',topicStatus:'current',studyStatus:'pending_review',priority:'urgent',newContent:true};
const VOCAB_CARDS=SPANISH_VOCABULARY.entries.map(entry=>({id:entry.id,topic:'vocabulario',topicId:'vocabulario',title:`${entry.word.toLocaleUpperCase('es')} (${entry.grammar})`,def:entry.definition,example:[entry.synonyms.length?`Sinónimos: ${entry.synonyms.join(', ')}.`:'',entry.antonyms.length?`Antónimos: ${entry.antonyms.join(', ')}.`:'',entry.example].filter(Boolean).join(' ')}));
const requestJson=window.StudyHubApi.requestJson;

const STUDY_DAYS=Object.freeze([
  {id:1,name:'Día 1'},
  {id:2,name:'Día 2'},
]);

// Fuente única de verdad para Hub → Día → Materia → Unidad → Tema. El motor
// heredado de Español se adapta mediante contentKey sin cambiar IDs ni datos.
const SUBJECT_CATALOG=Object.freeze([
  {id:'ingles',name:'Inglés',emoji:'📘',day:1,status:'Próximamente',available:false,contentKey:null,units:{current:null,previous:[],completed:[]}},
  {id:'salud',name:'Salud',emoji:'❤️',day:1,status:'Próximamente',available:false,contentKey:null,units:{current:null,previous:[],completed:[]}},
  {id:'historia',name:'Historia',emoji:'🏛️',day:1,status:'Disponible',available:true,contentKey:'historia-v1',units:{current:HISTORY_CONTENT.unit,previous:[],completed:[]}},
  {id:'ciencia',name:'Ciencia',emoji:'🔬',day:2,status:'Prueba 30 sep',available:true,contentKey:'science-v1',units:{current:SCIENCE_CONTENT.unit,previous:[],completed:[]}},
  {id:'matematicas',name:'Matemáticas',emoji:'📐',day:2,status:'Tema actual',available:true,contentKey:'math-v1',units:{current:MATH_CONTENT.unit,previous:[],completed:[]}},
  {id:'espanol',name:'Español',emoji:'📚',day:2,status:'Nuevo',available:true,contentKey:'spanish-v2',units:{current:{...SPANISH_VOCABULARY.unit,topicStatus:'current',studyStatus:'pending_review',priority:'urgent',newContent:true,assessments:[{type:'competition',label:'Competencia',status:'pending',date:null}]},previous:[{id:'espanol-unidad-anterior',subjectId:'espanol',name:'Contenido anterior de Español',displayName:'✅ Tema pasado',type:'Tema pasado',status:'previous',topicStatus:'previous',examTaken:true,examTakenDate:'2026-09-14',date:'2026-09-14',order:1,topicIds:TOPICS.map(t=>t.id),assessments:[{type:'exam',label:'Examen',status:'taken',date:'2026-09-14'}]}],completed:[]}},
]);
const SUBJECT_BY_ID=new Map(SUBJECT_CATALOG.map(subject=>[subject.id,subject]));
const SUBJECT=SUBJECT_BY_ID.get('espanol');
const SUBJECT_VIEW_IDS=new Set(['dashboard','repaso','repasoCards','practica','experimental','examen','scienceFormulas','errores','guardadas','historial','session','results']);
function subjectsForDay(day){return SUBJECT_CATALOG.filter(subject=>subject.day===day);}
function subjectUnits(subjectId){
  const subject=SUBJECT_BY_ID.get(subjectId);
  if(!subject)return{current:null,previous:[],completed:[]};
  if(subject.units)return subject.units;
  // Adaptador seguro para catálogos legacy con topicGroups.
  const legacy=subject.topicGroups||{};
  return {current:legacy.current?{...legacy.current,subjectId:subject.id,status:'current',order:1,topicIds:legacy.current.topicIds||[]}:null,previous:legacy.previous||[],completed:[]};
}
function currentUnit(subjectId){return subjectUnits(subjectId).current||null;}
function unitById(subjectId,unitId){
  const units=subjectUnits(subjectId);return [units.current,...units.previous,...units.completed].filter(Boolean).find(unit=>unit.id===unitId)||null;
}
function subjectContent(subjectId){
  const subject=SUBJECT_BY_ID.get(subjectId);
  const units=subjectUnits(subjectId);
  if(!subject?.available) return {units,topics:[],reviewCards:[],questions:[]};
  if(subject.contentKey==='spanish-v2') return {units,topics:[VOCAB_TOPIC,...TOPICS],reviewCards:[...VOCAB_CARDS,...REVIEW_CARDS],questions:[...SPANISH_VOCABULARY.questions,...Q]};
  if(subject.contentKey==='historia-v1') return {units,topics:HISTORY_CONTENT.topics,reviewCards:HISTORY_CONTENT.reviewCards,questions:HISTORY_CONTENT.questions};
  if(subject.contentKey==='science-v1') return {units,topics:SCIENCE_CONTENT.topics,reviewCards:SCIENCE_CONTENT.reviewCards,questions:SCIENCE_CONTENT.questions};
  if(subject.contentKey==='math-v1') return {units,topics:MATH_CONTENT.topics,reviewCards:MATH_CONTENT.reviewCards,questions:MATH_CONTENT.questions};
  return {units,topics:[],reviewCards:[],questions:[]};
}
function unitTopics(unitId){
  for(const subject of SUBJECT_CATALOG){const unit=unitById(subject.id,unitId);if(unit){const ids=new Set(unit.topicIds||[]);return subjectContent(subject.id).topics.filter(topic=>ids.has(topic.id));}}
  return [];
}
function topicCards(topicId){
  for(const subject of SUBJECT_CATALOG){const cards=subjectContent(subject.id).reviewCards.filter(card=>(card.topicId||card.topic)===topicId);if(cards.length)return cards;}
  return [];
}
function topicQuestions(topicId){
  for(const subject of SUBJECT_CATALOG){const questions=subjectContent(subject.id).questions.filter(question=>(question.topicId||question.topic)===topicId);if(questions.length)return questions;}
  return [];
}
function activeSubject(){return SUBJECT_BY_ID.get(state.activeSubjectId)||SUBJECT;}
function activeContent(){return subjectContent(activeSubject().id);}
function activeTopics(){return activeContent().topics;}
function activeReviewCards(){return activeContent().reviewCards;}
function activeQuestions(){return activeContent().questions;}
function allTopics(){return [VOCAB_TOPIC,...TOPICS,...HISTORY_CONTENT.topics,...SCIENCE_CONTENT.topics,...MATH_CONTENT.topics];}
function allQuestions(){return [...SPANISH_VOCABULARY.questions,...Q,...HISTORY_CONTENT.questions,...SCIENCE_CONTENT.questions,...MATH_CONTENT.questions];}
function questionSubjectId(question){return question?.subjectId||'espanol';}
function topicForQuestion(question){return subjectContent(questionSubjectId(question)).topics.find(topic=>topic.id===question?.topic)||null;}
function approvedAssistantContext(subjectId,unitId,topicId){
  const subject=SUBJECT_BY_ID.get(subjectId),content=subjectContent(subjectId),unit=unitById(subjectId,unitId)||currentUnit(subjectId);
  if(!subject?.available||!unit)return null;
  const topic=content.topics.find(item=>item.id===topicId)||null;
  return {subjectId:subject.id,subjectName:subject.name,unitId:unit.id,unitName:unit.name,topicId:topic?.id||'',topicName:topic?.name||'',approvedContent:content.reviewCards.filter(card=>!topic||card.topic===topic.id)};
}

const Q=window.STUDY_HUB_LEGACY_QUESTIONS;
const normalizeMorphRole=window.STUDY_HUB_NORMALIZE_MORPH_ROLE;
const studyExample=window.STUDY_HUB_STUDY_EXAMPLE;
const auditQuestionOptions=window.STUDY_HUB_AUDIT_QUESTION_OPTIONS;
const morphVisual=window.STUDY_HUB_MORPH_VISUAL;

/* =========================================================
   ESTADO Y PERSISTENCIA
========================================================= */
const APP_VERSION = '2.0';
// Clave estable: NO cambiar entre actualizaciones. Así el progreso sobrevive a nuevas versiones.
const STABLE_STORAGE_KEY = 'cuaderno_espanol_hub_progress_v1';
const STORAGE_KEY = 'cuaderno_espanol_v12'; // compatibilidad con versiones anteriores
const STORAGE_BACKUP_KEY = 'cuaderno_espanol_v12_backup';
const IDB_NAME = 'cuaderno_espanol_db';
const IDB_STORE = 'progress';
let hasLocalSavedState = false;
let lastSaveAt = 0;
let accountSession = {status:'checking', user:null};
let requestedAccountMode='login';
let suppressCloudSync = false;
let cloudSyncTimer = null;
let cloudSyncInFlight = false;
let lastCloudHash = '';
let lastCloudUpdatedAt = 0;
let lastCloudSyncAt = 0;
let featureFlags = [];
let adminRefreshTimer = null;

const state = {
  theme:'light',
  view:'hub',
  activeSubjectId:null,
  activeUnitId:null,
  activeTopicId:null,
  lastVisitedTopicBySubject:{},
  lastSubjectId:'espanol',
  stats:{}, // topicId -> {attempts, correct, recent:[bool], mastered:false}
  totalAnswered:0, totalCorrect:0, currentStreak:0, bestStreak:0,
  studySeconds:0,
  subjectTotals:{historia:{answered:0,correct:0,currentStreak:0,bestStreak:0,studySeconds:0},ciencia:{answered:0,correct:0,currentStreak:0,bestStreak:0,studySeconds:0}},
  errors:[], // {qid, userAnswerText, times, last}
  saved:new Set(),
  history:[],
  session:null,
  settings:{
    themeMode:'light',
    practiceCountsByDefault:true,
    strictWrittenAnswers:false,
    examTopics:[VOCAB_TOPIC,...TOPICS].map(t=>t.id),
    examTopicsBySubject:{historia:HISTORY_CONTENT.topics.map(t=>t.id),ciencia:SCIENCE_CONTENT.topics.map(t=>t.id),matematicas:MATH_CONTENT.topics.map(t=>t.id)},
    examSizeBySubject:{},
    lastSeenUpdate:'',
    seenUpdateIds:[],
    seenCalendarIds:[],
    seenContentAt:{},
    accentColor:'#8B2635',
    leaderboardName:'',
    leaderboardDeviceId:'',
    hiddenWarnings:{},
    favorites:[],
    flashcards:{},
    savedCategories:{},
    topicStudyStatus:{vocabulario:'pending_review'},
    practiceTopicBySubject:{},
    pausedPractices:[],
    discardedSessions:[]
  }
};
allTopics().forEach(t=> state.stats[t.id] = {attempts:0, correct:0, recent:[]});

// Los IDs q1, q2… son identificadores heredados y su orden no debe cambiarse.
// Las futuras migraciones pueden añadir alias explícitos sin invalidar datos antiguos.
const QUESTION_ID_ALIASES=Object.freeze({});
function findQuestionById(id){
  const resolved=QUESTION_ID_ALIASES[id]||id;
  return allQuestions().find(question=>question.id===resolved);
}

function sessionReturnView(returnView,mode){
  const fallback=mode==='examen'?'examen':'practica';
  return SUBJECT_VIEW_IDS.has(returnView)&&!['session','results'].includes(returnView)?returnView:fallback;
}

function snapshotState(){
  return {
    schemaVersion:window.StudyHubStorage.CURRENT_SCHEMA_VERSION,
    version:APP_VERSION,
    savedAt:Date.now(),
    theme:state.theme,
    view:state.view,
    activeSubjectId:state.activeSubjectId,
    activeUnitId:state.activeUnitId,
    activeTopicId:state.activeTopicId,
    lastVisitedTopicBySubject:state.lastVisitedTopicBySubject,
    lastSubjectId:state.lastSubjectId,
    stats:state.stats,
    totalAnswered:state.totalAnswered,totalCorrect:state.totalCorrect,
    currentStreak:state.currentStreak,bestStreak:state.bestStreak,
    studySeconds:state.studySeconds,subjectTotals:state.subjectTotals,errors:state.errors,
    saved:[...state.saved],history:state.history,lastResult:state.lastResult||null,
    settings:state.settings,
    session:state.session && !state.session.experimental?{...state.session,queueIds:state.session.queue.map(q=>q.id),queue:undefined}:null
  };
}
function applySavedData(d){
  if(!d || typeof d!=='object') return false;
  if(d.stats && typeof d.stats==='object') allTopics().forEach(t=>{
    const incoming=d.stats[t.id];
    if(!incoming || typeof incoming!=='object') return;
    state.stats[t.id]={
      attempts:Number.isFinite(incoming.attempts)?Math.max(0,incoming.attempts):state.stats[t.id].attempts,
      correct:Number.isFinite(incoming.correct)?Math.max(0,incoming.correct):state.stats[t.id].correct,
      recent:Array.isArray(incoming.recent)?incoming.recent.slice(-20).map(Boolean):state.stats[t.id].recent
    };
  });
  ['totalAnswered','totalCorrect','currentStreak','bestStreak','studySeconds'].forEach(k=>{ if(Number.isFinite(d[k])) state[k]=d[k]; });
  if(d.subjectTotals && typeof d.subjectTotals==='object' && !Array.isArray(d.subjectTotals)){
    for(const subjectId of ['historia','ciencia','matematicas']){
      const row=d.subjectTotals[subjectId];
      if(row && typeof row==='object') state.subjectTotals[subjectId]={
        answered:Math.max(0,Number(row.answered)||0),correct:Math.max(0,Number(row.correct)||0),
        currentStreak:Math.max(0,Number(row.currentStreak)||0),bestStreak:Math.max(0,Number(row.bestStreak)||0),studySeconds:Math.max(0,Number(row.studySeconds)||0)
      };
    }
  }
  if(Array.isArray(d.errors)) state.errors=d.errors.filter(e=>e&&typeof e.qid==='string').slice(-1000);
  if(Array.isArray(d.saved)) state.saved=new Set(d.saved.filter(id=>typeof id==='string').slice(-1000));
  if(Array.isArray(d.history)) state.history=d.history.filter(entry=>entry&&typeof entry==='object').slice(-500);
  if(d.lastResult && typeof d.lastResult==='object'){
    const result=d.lastResult;
    const byTopic={};
    if(result.byTopic && typeof result.byTopic==='object') allTopics().forEach(topic=>{
      const row=result.byTopic[topic.id];
      if(row && typeof row==='object') byTopic[topic.id]={c:Math.max(0,Number(row.c)||0),t:Math.max(0,Number(row.t)||0)};
    });
    state.lastResult={
      ...result,
      subjectId:SUBJECT_BY_ID.get(result.subjectId)?.available?result.subjectId:'espanol',
      unitId:unitById(SUBJECT_BY_ID.get(result.subjectId)?.available?result.subjectId:'espanol',result.unitId)?.id||currentUnit(SUBJECT_BY_ID.get(result.subjectId)?.available?result.subjectId:'espanol')?.id||null,
      total:Math.max(0,Number(result.total)||0),
      correctCount:Math.max(0,Number(result.correctCount)||0),
      pct:Math.max(0,Math.min(100,Number(result.pct)||0)),
      elapsed:Math.max(0,Number(result.elapsed)||0),
      byTopic,
      answers:Array.isArray(result.answers)?result.answers.filter(a=>a&&typeof a.qid==='string').slice(0,500):[],
      mode:result.mode==='examen'?'examen':'practica',
      returnView:sessionReturnView(result.returnView,result.mode),
      experimental:result.experimental===true
    };
  }
  if(d.settings && typeof d.settings==='object'){
    const incoming=d.settings;
    if(['light','dark','auto'].includes(incoming.themeMode)) state.settings.themeMode=incoming.themeMode;
    if(typeof incoming.practiceCountsByDefault==='boolean') state.settings.practiceCountsByDefault=incoming.practiceCountsByDefault;
    if(typeof incoming.strictWrittenAnswers==='boolean')state.settings.strictWrittenAnswers=incoming.strictWrittenAnswers;
    if(Array.isArray(incoming.examTopics)) state.settings.examTopics=incoming.examTopics.filter(id=>[VOCAB_TOPIC,...TOPICS].some(t=>t.id===id));
    if(incoming.examTopicsBySubject && typeof incoming.examTopicsBySubject==='object' && !Array.isArray(incoming.examTopicsBySubject)){
      state.settings.examTopicsBySubject=Object.fromEntries(['historia','ciencia','matematicas'].map(subjectId=>{
        const topicIds=subjectContent(subjectId).topics.map(topic=>topic.id);
        const incomingIds=incoming.examTopicsBySubject[subjectId];
        return [subjectId,Array.isArray(incomingIds)?incomingIds.filter(id=>topicIds.includes(id)):topicIds];
      }));
    }
    if(incoming.examSizeBySubject && typeof incoming.examSizeBySubject==='object' && !Array.isArray(incoming.examSizeBySubject)){
      state.settings.examSizeBySubject=Object.fromEntries(Object.entries(incoming.examSizeBySubject).filter(([subjectId,value])=>SUBJECT_BY_ID.get(subjectId)?.available&&(value==='all'||/^\d{1,3}$/.test(String(value)))).slice(0,20).map(([subjectId,value])=>[subjectId,String(value)]));
    }
    if(typeof incoming.lastSeenUpdate==='string') state.settings.lastSeenUpdate=incoming.lastSeenUpdate.slice(0,20);
    if(Array.isArray(incoming.seenUpdateIds))state.settings.seenUpdateIds=incoming.seenUpdateIds.filter(value=>typeof value==='string').slice(-100);
    if(Array.isArray(incoming.seenCalendarIds))state.settings.seenCalendarIds=incoming.seenCalendarIds.filter(value=>typeof value==='string').slice(-500);
    if(incoming.seenContentAt&&typeof incoming.seenContentAt==='object'&&!Array.isArray(incoming.seenContentAt)) state.settings.seenContentAt=Object.fromEntries(Object.entries(incoming.seenContentAt).filter(([key,value])=>typeof key==='string'&&Number.isFinite(value)).slice(0,100));
    if(typeof incoming.accentColor==='string' && /^#[0-9A-Fa-f]{6}$/.test(incoming.accentColor)) state.settings.accentColor=incoming.accentColor;
    if(typeof incoming.leaderboardName==='string') state.settings.leaderboardName=incoming.leaderboardName.slice(0,40);
    if(typeof incoming.leaderboardDeviceId==='string') state.settings.leaderboardDeviceId=incoming.leaderboardDeviceId.slice(0,120);
    if(incoming.hiddenWarnings && typeof incoming.hiddenWarnings==='object' && !Array.isArray(incoming.hiddenWarnings)) state.settings.hiddenWarnings={...incoming.hiddenWarnings};
    if(Array.isArray(incoming.favorites)) state.settings.favorites=incoming.favorites.filter(item=>item&&['topic','card','reviewCard','contribution','calendar'].includes(item.type)&&typeof item.id==='string').slice(0,300).map(item=>({type:item.type,id:item.id,subjectId:typeof item.subjectId==='string'?item.subjectId:'',title:typeof item.title==='string'?item.title.slice(0,140):''}));
    if(incoming.flashcards&&typeof incoming.flashcards==='object'&&!Array.isArray(incoming.flashcards)) state.settings.flashcards=Object.fromEntries(Object.entries(incoming.flashcards).slice(0,500).filter(([id,row])=>id.length<=200&&row&&['known','unknown'].includes(row.status)).map(([id,row])=>[id,{status:row.status,lastReviewed:Math.max(0,Number(row.lastReviewed)||0),reviewCount:Math.max(0,Number(row.reviewCount)||0)}]));
    if(incoming.savedCategories&&typeof incoming.savedCategories==='object'&&!Array.isArray(incoming.savedCategories)) state.settings.savedCategories=Object.fromEntries(Object.entries(incoming.savedCategories).slice(0,1000).filter(([id,value])=>typeof id==='string'&&['dificil','importante','manana'].includes(value)));
    if(incoming.topicStudyStatus&&typeof incoming.topicStudyStatus==='object'&&!Array.isArray(incoming.topicStudyStatus)) state.settings.topicStudyStatus=Object.fromEntries(Object.entries(incoming.topicStudyStatus).filter(([id,value])=>allTopics().some(topic=>topic.id===id)&&['pending_review','in_progress','reviewed','mastered'].includes(value)).slice(0,100));
    if(incoming.practiceTopicBySubject&&typeof incoming.practiceTopicBySubject==='object'&&!Array.isArray(incoming.practiceTopicBySubject)) state.settings.practiceTopicBySubject=Object.fromEntries(Object.entries(incoming.practiceTopicBySubject).filter(([subjectId,topicId])=>SUBJECT_BY_ID.get(subjectId)?.available&&allTopics().some(topic=>topic.id===topicId)).slice(0,20));
    if(Array.isArray(incoming.pausedPractices)) state.settings.pausedPractices=incoming.pausedPractices.filter(row=>row&&typeof row==='object'&&typeof row.id==='string'&&typeof row.subjectId==='string'&&Array.isArray(row.queueIds)).slice(-5).map(row=>({...row,queueIds:row.queueIds.filter(id=>typeof id==='string').slice(0,500),answers:Array.isArray(row.answers)?row.answers.filter(a=>a&&typeof a==='object').slice(0,500):[],workspaceByQuestion:row.workspaceByQuestion&&typeof row.workspaceByQuestion==='object'?row.workspaceByQuestion:{}}));
    if(Array.isArray(incoming.discardedSessions)) state.settings.discardedSessions=incoming.discardedSessions.filter(row=>row&&typeof row==='object'&&typeof row.subjectId==='string').slice(-50).map(row=>({subjectId:row.subjectId,unitId:typeof row.unitId==='string'?row.unitId:null,topicId:typeof row.topicId==='string'?row.topicId:null,discardedAt:Math.max(0,Number(row.discardedAt)||0),answered:Math.max(0,Number(row.answered)||0),total:Math.max(0,Number(row.total)||0)}));
  }
  if(typeof d.activeSubjectId==='string' && SUBJECT_BY_ID.get(d.activeSubjectId)?.available) state.activeSubjectId=d.activeSubjectId;
  if(typeof d.lastSubjectId==='string' && SUBJECT_BY_ID.get(d.lastSubjectId)?.available) state.lastSubjectId=d.lastSubjectId;
  if(d.lastVisitedTopicBySubject&&typeof d.lastVisitedTopicBySubject==='object'&&!Array.isArray(d.lastVisitedTopicBySubject)) state.lastVisitedTopicBySubject={...d.lastVisitedTopicBySubject};
  if(typeof d.activeTopicId==='string'&&allTopics().some(topic=>topic.id===d.activeTopicId)) state.activeTopicId=d.activeTopicId;
  const savedUnit=typeof d.activeUnitId==='string'?unitById(state.activeSubjectId,d.activeUnitId):null;
  state.activeUnitId=savedUnit?.id||currentUnit(state.activeSubjectId)?.id||null;
  if(typeof d.view==='string' && d.view!=='session'){
    state.view=d.view;
    if(SUBJECT_VIEW_IDS.has(d.view)){
      const compatibleSubject=SUBJECT_BY_ID.get(state.activeSubjectId)?.available?state.activeSubjectId:SUBJECT.id;
      state.activeSubjectId=compatibleSubject;state.activeUnitId=unitById(compatibleSubject,state.activeUnitId)?.id||currentUnit(compatibleSubject)?.id||null;
    }
    else if(d.view==='hub'){state.activeSubjectId=null;state.activeUnitId=null;}
  }
  if(d.session && Array.isArray(d.session.queueIds)){
    const queue=d.session.queueIds.map(findQuestionById).filter(Boolean);
    if(queue.length){
      const idx=Math.max(0,Math.min(Number.isFinite(d.session.idx)?d.session.idx:0,queue.length-1));
      const answers=Array.isArray(d.session.answers)?d.session.answers.filter(a=>a&&typeof a==='object').slice(0,queue.length):[];
      const sessionSubjectId=SUBJECT_BY_ID.get(d.session.subjectId)?.available?d.session.subjectId:questionSubjectId(queue[0]);
      state.session={...d.session,subjectId:sessionSubjectId,unitId:unitById(sessionSubjectId,d.session.unitId)?.id||currentUnit(sessionSubjectId)?.id||null,idx,answers,queue,returnView:sessionReturnView(d.session.returnView,d.session.mode)};
    }
  }
  lastSaveAt=Number.isFinite(d.savedAt)?d.savedAt:Date.now();
  return true;
}
function openProgressDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB unavailable')); return; }
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function saveToIndexedDB(data){
  try{
    const db=await openProgressDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(data,'latest');
      tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error);
    });
    db.close();
  }catch(e){}
}
async function loadFromIndexedDB(){
  try{
    const db=await openProgressDB();
    const data=await new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).get('latest');
      req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error);
    });
    db.close();
    return data;
  }catch(e){ return null; }
}
function saveState(){
  const data=snapshotState();
  const raw=JSON.stringify(data);
  let localSaved=false;
  try{
    const previous=localStorage.getItem(STABLE_STORAGE_KEY);
    if(previous && previous!==raw) localStorage.setItem(STORAGE_BACKUP_KEY,previous);
    localStorage.setItem(STABLE_STORAGE_KEY,raw);
    localStorage.setItem(STORAGE_KEY,raw); // compatibilidad con versiones anteriores
    localSaved=true;
  }catch(e){}
  lastSaveAt=data.savedAt;
  if(localSaved) hasLocalSavedState=true;
  saveToIndexedDB(data);
  if(!suppressCloudSync && accountSession.user) scheduleCloudSync();
}
function loadState(){
  let candidates=[];
  try{
    candidates=[
      localStorage.getItem(STABLE_STORAGE_KEY),
      localStorage.getItem(STORAGE_KEY),
      localStorage.getItem(STORAGE_BACKUP_KEY)
    ].filter(Boolean);
  }catch(e){}
  for(const raw of candidates){
    try{
      const parsed=window.StudyHubStorage.parse(raw);
      const ok=window.StudyHubStorage.validate(parsed)&&applySavedData(parsed);
      if(ok){ hasLocalSavedState=true; return true; }
    }catch(e){}
  }
  return false;
}
async function restoreIndexedDBFallback(){
  if(hasLocalSavedState) return;
  const data=window.StudyHubStorage.migrate(await loadFromIndexedDB());
  if(window.StudyHubStorage.validate(data) && applySavedData(data)){
    hasLocalSavedState=true;
    try{ const raw=JSON.stringify(data); localStorage.setItem(STABLE_STORAGE_KEY,raw); localStorage.setItem(STORAGE_KEY,raw); localStorage.setItem(STORAGE_BACKUP_KEY,raw); }catch(e){}
    applyThemeMode();
    render();
  }
}
function hexToRgb(hex){ const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||''); return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:null; }
function applyAccentColor(accentColor=state.settings.accentColor){
  const hex=/^#[0-9A-Fa-f]{6}$/.test(accentColor||'')?accentColor:'#8B2635';
  const rgb=hexToRgb(hex)||{r:139,g:38,b:53};
  document.documentElement.style.setProperty('--accent',hex);
  const alpha=state.theme==='dark'?.18:.14;
  document.documentElement.style.setProperty('--accent-soft',`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`);
}
function applyThemeMode(themeMode=state.settings.themeMode, accentColor=state.settings.accentColor){
  const mode=['light','dark','auto'].includes(themeMode)?themeMode:'light';
  const actual=mode==='auto' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : mode;
  state.theme=actual;
  // El tema y el acento viven en el mismo elemento. Si el tema oscuro se
  // aplicara a body, su --accent sobrescribiría el color personalizado de html.
  document.documentElement.setAttribute('data-theme',actual);
  document.body.removeAttribute('data-theme');
  applyAccentColor(accentColor);
}
const loadedExistingState=loadState();
applyThemeMode();

async function accountRequest(method='GET', body=null){
  return requestJson('/.netlify/functions/account',{method,body,fallbackMessage:'No se pudo procesar la cuenta.'});
}
function stableCloudPayload(){
  const snap=snapshotState();
  // El progreso general siempre se sincroniza. Una práctica normal pausada también
  // viaja con la cuenta para poder continuarla en otro dispositivo.
  // Exámenes incompletos y sesiones experimentales permanecen locales.
  // La vista sincronizada es neutral: cada dispositivo conserva su contexto
  // local, mientras versiones anteriores siguen cayendo en su Panel por defecto.
  snap.view='hub';
  snap.activeSubjectId=null;
  snap.activeUnitId=null;
  if(!(state.session && state.session.mode==='practica' && !state.session.experimental)){
    snap.session=null;
  }
  return snap;
}
function cloudPayloadHash(data){
  try{const comparable={...data};delete comparable.savedAt;return JSON.stringify(comparable);}catch{return '';}
}
function scheduleCloudSync(){
  if(!accountSession.user || suppressCloudSync) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(syncCloudState,1200);
}
async function syncCloudState(){
  if(!accountSession.user) return {ok:false,error:'Inicia sesión para sincronizar.'};
  if(cloudSyncInFlight || suppressCloudSync) return {ok:false,pending:true};
  const payload=stableCloudPayload();
  const hash=cloudPayloadHash(payload);
  if(hash===lastCloudHash) return {ok:true,unchanged:true,updatedAt:lastCloudSyncAt};
  cloudSyncInFlight=true;
  let retry=false;
  let outcome={ok:false,error:'No se pudo sincronizar.'};
  try{
    const result=await accountRequest('POST',{action:'sync',state:payload,baseUpdatedAt:lastCloudUpdatedAt});
    lastCloudUpdatedAt=Number(result.updatedAt)||lastCloudUpdatedAt;
    lastCloudSyncAt=Date.now();
    lastCloudHash=hash;
    const el=document.getElementById('cloudSyncStatus'); if(el) el.textContent='Sincronizado ✓';
    outcome={ok:true,updatedAt:lastCloudSyncAt};
  }catch(e){
    if(e.status===401){ accountSession={status:'ready',user:null}; renderNav(); }
    if(e.status===409 && e.data?.cloudState){
      const cloud=e.data.cloudState;
      lastCloudUpdatedAt=Number(e.data.cloudUpdatedAt)||lastCloudUpdatedAt;
      const localSession=payload.session;
      const cloudSession=cloud.session;
      const localProgress=localSession?(localSession.answers?.length||0)*1000+(localSession.idx||0):-1;
      const cloudProgress=cloudSession?(cloudSession.answers?.length||0)*1000+(cloudSession.idx||0):-1;
      const cloudIsNewer=(Number(cloud.savedAt)||0)>(Number(payload.savedAt)||0);
      if(cloudIsNewer && cloudProgress>=localProgress) applyCloudCanonical(cloud);
      else { lastCloudHash=''; retry=true; }
    }
    const message=e.status===409?'Resolviendo cambios…':'No se pudo sincronizar';
    const el=document.getElementById('cloudSyncStatus'); if(el) el.textContent=message;
    outcome={ok:false,error:e.message||'No se pudo sincronizar.',retry};
  }finally{cloudSyncInFlight=false;}
  if(retry) setTimeout(syncCloudState,100);
  return outcome;
}
function applyCloudCanonical(cloudState){
  if(!cloudState || typeof cloudState!=='object') return false;
  suppressCloudSync=true;
  try{
    const currentView=state.view;
    const currentSubjectId=state.activeSubjectId;
    const currentUnitId=state.activeUnitId;
    const localSession=state.session && state.session.mode==='practica' && !state.session.experimental?state.session:null;
    applySavedData(cloudState);
    state.view=currentView;
    state.activeSubjectId=currentSubjectId;
    state.activeUnitId=currentUnitId;
    const cloudSession=state.session && state.session.mode==='practica' && !state.session.experimental?state.session:null;
    const localProgress=localSession?(localSession.answers?.length||0)*1000+(localSession.idx||0):-1;
    const cloudProgress=cloudSession?(cloudSession.answers?.length||0)*1000+(cloudSession.idx||0):-1;
    const keptLocal=localSession && localProgress>cloudProgress;
    if(keptLocal) state.session=localSession;
    applyThemeMode();
    saveState();
    lastCloudHash=keptLocal?'':cloudPayloadHash(stableCloudPayload());
    return true;
  }finally{suppressCloudSync=false;}
}
async function restoreAccountSession(){
  try{
    const data=await accountRequest('GET');
    accountSession={status:'ready',user:data.authenticated?data.user:null};
    lastCloudUpdatedAt=Number(data.cloudUpdatedAt)||0;
    if(data.authenticated && data.cloudState) applyCloudCanonical(data.cloudState);
    renderNav();
    render();
    if(data.authenticated && !lastCloudHash) scheduleCloudSync();
  }catch(e){accountSession={status:'ready',user:null}; renderNav();}
}

function computeMastery(topicId){
  const s = state.stats[topicId];
  if(!s || s.attempts===0) return {pct:0, status:'none'};
  const overall = s.correct/s.attempts;
  const recentArr = s.recent.slice(-8);
  const recentAcc = recentArr.length? recentArr.filter(Boolean).length/recentArr.length : 0;
  let pct = Math.round((overall*0.4 + recentAcc*0.6)*100);
  let status;
  if(s.attempts < 3) status='progress';
  else if(pct>=80 && s.attempts>=8 && recentArr.length>=5 && recentArr.slice(-5).filter(Boolean).length>=4) status='mastered';
  else if(pct>=55) status='almost';
  else status='progress';
  return {pct, status};
}
function overallMastery(subjectId=activeSubject().id){
  const all = subjectContent(subjectId).topics.map(t=>computeMastery(t.id).pct);
  if(!all.length)return 0;
  return Math.round(all.reduce((a,b)=>a+b,0)/all.length);
}
function subjectMetrics(subjectId){
  if(subjectId==='espanol')return{answered:state.totalAnswered,correct:state.totalCorrect,currentStreak:state.currentStreak,bestStreak:state.bestStreak,studySeconds:state.studySeconds};
  return state.subjectTotals[subjectId]||{answered:0,correct:0,currentStreak:0,bestStreak:0,studySeconds:0};
}
function subjectHistory(subjectId){return state.history.filter(entry=>(entry.subjectId||'espanol')===subjectId);}
function subjectErrors(subjectId){return state.errors.filter(error=>questionSubjectId(findQuestionById(error.qid))===subjectId);}
function subjectSaved(subjectId){return [...state.saved].filter(id=>questionSubjectId(findQuestionById(id))===subjectId);}
function statusLabel(s){
  return {none:'No estudiado', progress:'En progreso', almost:'Casi dominado', mastered:'Dominado'}[s];
}
function statusPillClass(s){
  return {none:'pill-none', progress:'pill-progress', almost:'pill-almost', mastered:'pill-mastered'}[s];
}

function recordAnswer(q, correct){
  if(state.session && state.session.mode==='practica' && state.session.countStats===false) return;
  const subjectId=questionSubjectId(q);
  if(subjectId==='espanol'){
    state.totalAnswered++;
    if(correct) state.totalCorrect++;
    state.currentStreak=correct?state.currentStreak+1:0;
    state.bestStreak=Math.max(state.bestStreak,state.currentStreak);
  }else{
    const totals=state.subjectTotals[subjectId]||(state.subjectTotals[subjectId]={answered:0,correct:0,currentStreak:0,bestStreak:0,studySeconds:0});
    totals.answered++;
    if(correct)totals.correct++;
    totals.currentStreak=correct?totals.currentStreak+1:0;
    totals.bestStreak=Math.max(totals.bestStreak,totals.currentStreak);
  }
  const s = state.stats[q.topic];
  s.attempts++;
  if(correct) s.correct++;
  s.recent.push(correct);
  if(s.recent.length>20) s.recent.shift();
  if(!correct){
    let ex = state.errors.find(e=>e.qid===q.id);
    const workspaceErrorType=q.type==='numeric'
      ? SCIENCE_CONTENT.checkNumericAnswer(q,sessionSelection).errorType
      : q.type==='math-workspace'
        ? MATH_CONTENT.checkDmsAnswer(q,sessionSelection).errorType
        : '';
    const scienceError={userAnswer:sessionSelection,correctAnswer:correctAnswerLabel(q),formula:q.formula||'',errorType:workspaceErrorType||q.errorType||'',explanation:q.simpleExplanation||q.exp||''};
    if(ex){ ex.times++; ex.last=Date.now();Object.assign(ex,scienceError); }
    else state.errors.push({qid:q.id, times:1, last:Date.now(),...scienceError});
  } else {
    // remove from errors after 2 consecutive later correct answers handled elsewhere; keep simple: leave record but could be re-practiced
  }
  saveState();
}

function setViewContext(view){
  state.view=view;
  if(view==='hub'){state.activeSubjectId=null;state.activeUnitId=null;state.activeTopicId=null;}
  else if(SUBJECT_VIEW_IDS.has(view)){
    const sessionSubject=view==='session'?state.session?.subjectId:null;
    const resultSubject=view==='results'?state.lastResult?.subjectId:null;
    const selected=SUBJECT_BY_ID.get(sessionSubject||resultSubject||state.activeSubjectId||state.lastSubjectId)?.available?(sessionSubject||resultSubject||state.activeSubjectId||state.lastSubjectId):SUBJECT.id;
    state.activeSubjectId=selected;state.lastSubjectId=selected;state.activeUnitId=unitById(selected,state.activeUnitId)?.id||currentUnit(selected)?.id||null;
    if(['repaso','practica','examen','dashboard'].includes(view)) state.activeTopicId=null;
  }
}
function navigateFromNav(view){
  if(state.session){
    if(state.session.mode==='practica' && !state.session.experimental){
      if(state.view!=='session'){ goto(view); return; }
      state.session.pausedAt=Date.now();
      state.session.attemptStage=attemptStage;
      setViewContext(view);
      saveState();
      render();
      window.scrollTo(0,0);
      return;
    }
    if(!confirm('Tienes una sesión en progreso. ¿Quieres salir y abrir otra sección?')) return;
    state.session=null;
    attemptStage=0;
  }
  goto(view);
}
function toggleTheme(){
  state.theme = state.theme==='light'?'dark':'light';
  state.settings.themeMode=state.theme;
  applyThemeMode();
  saveState();
  renderNav();
}
function hasResumablePractice(){
  return !!(state.session && state.session.mode==='practica' && !state.session.experimental && Array.isArray(state.session.queue) && state.session.queue.length);
}
function resumablePracticeProgress(){
  if(!hasResumablePractice()) return null;
  const s=state.session;
  const current=Math.min((Number.isFinite(s.idx)?s.idx:0)+1,s.queue.length);
  const answered=Array.isArray(s.answers)?s.answers.length:0;
  const q=s.queue[Math.min(s.idx||0,s.queue.length-1)];
  const topic=topicForQuestion(q);
  const subject=SUBJECT_BY_ID.get(s.subjectId||questionSubjectId(q))||SUBJECT;
  return {current,total:s.queue.length,answered,topic:topic?topic.name:'Práctica',subjectId:subject.id,subjectName:subject.name};
}
function saveAndExitPractice(){
  const s=state.session;
  if(!s || s.mode!=='practica' || s.experimental){ goto('practica'); return; }
  s.pausedAt=Date.now();
  s.hintLevel=Number.isFinite(s.hintLevel)?s.hintLevel:0;
  s.answered=!!s.answered;
  s.attemptStage=attemptStage;
  state.view='practica';
  state.activeTopicId=null;
  saveState();
  render();
  window.scrollTo(0,0);
}
function resumeSavedPractice(){
  const s=state.session;
  if(!hasResumablePractice())return false;
  if(Number.isFinite(s.pausedAt)&&Number.isFinite(s.startedAt))s.startedAt+=Math.max(0,Date.now()-s.pausedAt);
  delete s.pausedAt;
  state.activeSubjectId=s.subjectId||questionSubjectId(s.queue[0]);
  state.lastSubjectId=state.activeSubjectId;
  state.activeUnitId=s.unitId||currentUnit(state.activeSubjectId)?.id||null;
  state.activeTopicId=s.queue[Math.min(s.idx||0,s.queue.length-1)]?.topic||null;
  goto('session');
  return true;
}
function discardPausedPractice(){
  if(!hasResumablePractice()) return;
  const s=state.session;
  const q=s.queue[Math.min(s.idx||0,s.queue.length-1)];
  state.settings.discardedSessions=[...(state.settings.discardedSessions||[]),{
    subjectId:s.subjectId||questionSubjectId(q),unitId:s.unitId||null,topicId:q?.topic||null,
    discardedAt:Date.now(),answered:Array.isArray(s.answers)?s.answers.length:0,total:s.queue.length
  }].slice(-50);
  state.session=null;
  saveState();
}
function portablePracticeSession(s){
  if(!s || s.mode!=='practica' || s.experimental || !Array.isArray(s.queue) || !s.queue.length) return null;
  return {
    id:`practice-${Date.now()}-${Math.random().toString(36).slice(2,8)}`, savedAt:Date.now(), mode:'practica',
    subjectId:s.subjectId||questionSubjectId(s.queue[0]), unitId:s.unitId||null, queueIds:s.queue.map(q=>q.id),
    idx:Number.isFinite(s.idx)?s.idx:0, answers:Array.isArray(s.answers)?s.answers:[], hintsUsed:Number(s.hintsUsed)||0,
    hintLevel:Number(s.hintLevel)||0, answered:!!s.answered, currentSelection:s.currentSelection??null,
    attemptStage:Number(s.attemptStage)||0, startedAt:Number(s.startedAt)||Date.now(), pausedAt:Date.now(),
    countStats:s.countStats!==false, returnView:sessionReturnView(s.returnView,s.mode), practiceToolsEnabled:true,
    workspaceByQuestion:s.workspaceByQuestion&&typeof s.workspaceByQuestion==='object'?s.workspaceByQuestion:{}
  };
}

function renderHubSubjectCard(subject){
  if(!subject.available)return `<article class="card hub-subject-card unavailable" aria-disabled="true"><div class="system-row"><h3><span aria-hidden="true">${subject.emoji}</span> ${subject.name}</h3><span class="subject-status">Próximamente</span></div></article>`;

  const unit=content.units.current;
  const newContent=subject.id==='espanol'&&!state.settings.seenContentAt?.[SPANISH_VOCABULARY.unit.id];
  const unitType=unit?.type&&unit.type!==subject.status?` · ${unit.type}`:'';
  const detail=subject.available
    ? `${unit?.name||'Unidad disponible'}${unitType} · ${subject.status}`
    : `Día ${subject.day} · contenido en preparación`;
  const spanishStatus=state.settings.topicStudyStatus?.vocabulario||'pending_review';
  return `<article class="card hub-subject-card ${subject.available?'available':'unavailable'} ${subject.id==='espanol'&&spanishStatus==='pending_review'?'priority-card':''}" ${subject.available?'':'aria-disabled="true"'}>

    <button class="icon-btn hub-subject-action" data-open-subject="${subject.id}">Abrir materia</button>
  </article>`;
}
function openSubject(subjectId,view='dashboard'){
  const subject=SUBJECT_BY_ID.get(subjectId);
  if(!subject?.available) return false;
  state.activeSubjectId=subject.id;
  state.lastSubjectId=subject.id;
  state.activeUnitId=currentUnit(subject.id)?.id||null;
  state.activeTopicId=null;
  if(subject.id==='espanol'){state.settings.seenContentAt ||= {};state.settings.seenContentAt[SPANISH_VOCABULARY.unit.id]=Date.now();}
  goto(view);
  return true;
}

function ringSvg(pct, size=150, stroke=12){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const off = c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg-soft)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .5s ease"/>
  </svg>`;
}
function weakestTopic(){
  const studied=activeTopics().filter(t=>state.stats[t.id]?.attempts>0);
  if(!studied.length) return null;
  return studied.reduce((best,t)=>computeMastery(t.id).pct<computeMastery(best.id).pct?t:best, studied[0]);
}
function assessmentStatusLabel(assessment){
  const status=assessment.status==='taken'
    ? `✅ ${assessment.label} ${assessment.label==='Prueba'?'tomada':'tomado'}`
    : assessment.status==='pending'
      ? `⏳ ${assessment.label} pendiente`
      : assessment.status==='scheduled'
        ? `📅 ${assessment.label} programado`
        : `${assessment.label}: ${assessment.status}`;
  const date=assessment.date?` · ${new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(`${assessment.date}T00:00:00Z`))}`:'';
  return `${status}${date}`;
}
function assessmentStatusBadge(assessment){
  if(assessment.status==='pending') return '<span class="status-badge offline">PENDIENTE</span>';
  if(assessment.status==='scheduled') return '<span class="status-badge">PROGRAMADO</span>';
  if(assessment.status==='taken') return '<span class="status-badge">TOMADA</span>';
  return `<span class="status-badge">${escHtml(String(assessment.status||'').toUpperCase())}</span>`;
}

      `<div class="study-quote"><span class="study-highlight">Quiero</span> verte.<br><span class="study-highlight">Quiero</span> escucharte.<br><span class="study-highlight">Quiero</span> hablarte.</div>`,

      `<b>Qué debes notar:</b> se repite el sonido m.`

    'figuras|Asíndeton':studyExample(

      `<b>Qué debes notar:</b> no aparecen conjunciones como “y” entre las acciones.`
    ),
    'figuras|Polisíndeton':studyExample(
      `<div class="study-quote">“<span class="study-highlight">Y</span> corre, <span class="study-highlight">y</span> salta, <span class="study-highlight">y</span> grita, <span class="study-highlight">y</span> ríe.”</div>`,
      `<b>Qué debes notar:</b> la conjunción “y” se repite.`
    ),
    'figuras|Onomatopeya':studyExample(
      `<div class="study-quote">El reloj hacía <span class="study-highlight">tic-tac</span>.</div>`,
      `<b>Qué debes notar:</b> “tic-tac” imita un sonido.`
    ),
    'figuras|Hipérbaton':studyExample(
      `<div class="study-quote"><small style="color:var(--ink-soft)">Orden normal:</small><br>La luna brillaba sobre el mar.<br><br><small style="color:var(--ink-soft)">Orden alterado:</small><br><span class="study-highlight">Sobre el mar brillaba la luna.</span></div>`,
      `<b>Qué debes notar:</b> cambia el orden normal de la oración.`
    ),
    'figuras|Oxímoron':studyExample(
      `<div class="study-quote">“<span class="study-highlight">silencio ensordecedor</span>”</div>`,
      `<b>Qué debes notar:</b> une dos términos contradictorios en una expresión breve.`
    ),
    'figuras|Paradoja':studyExample(
      `<div class="study-quote">“Mientras más aprendo, <span class="study-highlight">más comprendo lo poco que sé</span>.”</div>`,
      `<b>Qué debes notar:</b> parece contradictoria, pero contiene una idea lógica o profunda.`
    )
  };
  return map[k] || studyExample(`<div class="study-quote">${c.example}</div>`,'');
}

let repasoIndex = 0, repasoFilter=null;

function renderRepasoHome(main){
  const subject=activeSubject(),topics=activeTopics(),cards=activeReviewCards();
  if(!topics.length){main.innerHTML=`<div class="pagehead"><h1>Repaso de ${subject.name}</h1><p>La materia está activa y lista para recibir contenido aprobado.</p></div><div class="empty-state"><span class="ic">○</span>Selecciona otra materia mientras se incorpora material real.</div>`;return;}
  const visibleTopics=subject.id==='espanol'?[VOCAB_TOPIC]:topics;
  const previousTopic=visibleTopics.find(topic=>topic.id===state.lastVisitedTopicBySubject?.[subject.id]);
  main.innerHTML = `
    <div class="pagehead"><h1>Repaso de ${subject.name}</h1><p>Revisa el contenido en tarjetas, a tu ritmo, antes de practicar.</p></div>
    <div class="grid grid-3">
      ${visibleTopics.map(t=>`<button type="button" class="card mode-card" data-t="${t.id}"><span class="ic">${t.icon}</span><h3>${t.name}</h3><p>${cards.filter(c=>c.topic===t.id).length} tarjetas</p></button>`).join('')}
      <button type="button" class="card mode-card" data-t="all"><span class="ic">◎</span><h3>Todo el material</h3><p>${cards.length} tarjetas en total</p></button>
    </div>
    ${previousTopic?`<section class="review-continue system-row"><div><p>Repaso anterior</p><b>${previousTopic.icon} ${previousTopic.name}</b></div><button class="icon-btn" id="continuePreviousReview">Continuar repaso anterior</button></section>`:''}
    ${subject.id==='espanol'?`<details class="card" style="margin-top:18px"><summary><b>Tema pasado · Examen tomado el 14 de septiembre de 2026</b></summary><p class="cloud-note">El contenido anterior se conserva como un solo bloque académico.</p><div class="btn-row">${TOPICS.map(t=>`<button type="button" class="icon-btn" data-t="${t.id}">${t.icon} ${t.name}</button>`).join('')}</div></details>`:''}`;
  main.querySelectorAll('[data-t]').forEach(c=>c.addEventListener('click', ()=>{
    repasoFilter = c.dataset.t==='all'? null : c.dataset.t;
    state.activeTopicId=repasoFilter;
    if(repasoFilter)state.lastVisitedTopicBySubject[activeSubject().id]=repasoFilter;
    repasoIndex = 0;
    goto('repasoCards');
  }));
  main.querySelector('#continuePreviousReview')?.addEventListener('click',()=>platformUiContext().reviewTopic(subject.id,previousTopic.id));
}
function renderRepasoCards(main){
  const reviewCards=activeReviewCards(),topics=activeTopics();
  const effectiveFilter=repasoFilter||state.activeTopicId||null;
  if(!repasoFilter&&effectiveFilter)repasoFilter=effectiveFilter;
  const cards = effectiveFilter? reviewCards.filter(c=>c.topic===effectiveFilter) : reviewCards;
  const c = cards[repasoIndex];
  const cardId=`${activeSubject().id}|${c.topic}|${c.title}`;
  const cardProgress=state.settings.flashcards?.[cardId];
  main.innerHTML = `
    <div class="q-wrap">
      <div class="q-topbar"><button class="icon-btn" id="exitTopic">← Salir del tema</button><span>${repasoIndex+1} / ${cards.length}</span></div>
      <div class="q-progress"><div class="q-progress-fill" style="width:${(repasoIndex+1)/cards.length*100}%"></div></div>
      <div class="q-card review-card">
        <div style="text-align:center;">
          <span class="q-topic-tag">${topics.find(t=>t.id===c.topic)?.name||'Repaso'}</span>
          <h2 class="serif" style="margin:6px 0 16px 0;">${c.title}</h2>
          <p class="review-definition">${c.def}</p>
        </div>
        ${renderReviewExample(c)}
        ${c.detail?`<details class="ui-disclosure"><summary><b>Ver explicación detallada</b><span class="cloud-note">Qué significa, cuándo usarla y error común</span></summary><p>${escHtml(c.detail)}</p></details>`:''}
      </div>
      <div class="btn-row" aria-label="Mi repaso de esta tarjeta"><button class="icon-btn" id="cardKnown" aria-pressed="${cardProgress?.status==='known'}">Lo sé</button><button class="icon-btn" id="cardUnknown" aria-pressed="${cardProgress?.status==='unknown'}">No lo sé</button><span class="meta">${cardProgress?.reviewCount||0} ${cardProgress?.reviewCount===1?'repaso':'repasos'}</span></div>
      <div class="q-actions">
        <div class="btn-row"><button class="icon-btn" id="prevRep" ${repasoIndex===0?'disabled':''}>← Anterior</button></div>
        <div class="btn-row">
          <button class="btn" id="nextRep">${repasoIndex===cards.length-1?'Terminar':'Siguiente →'}</button>
        </div>
      </div>
      <div class="btn-row" style="margin-top:14px"><button class="btn ghost" id="practThis">Practicar este tema</button></div><details class="ui-disclosure"><summary><b>Más opciones</b><span class="cloud-note">Favoritos y organización</span></summary><div class="btn-row"><button class="icon-btn" id="cardFavorite">♡ Favorito tarjeta</button><button class="icon-btn" id="topicFavorite">♡ Favorito tema</button></div></details>
    </div>`;
  document.getElementById('exitTopic').addEventListener('click',()=>{state.activeTopicId=null;repasoFilter=null;saveState();goto('repaso');});
  document.getElementById('prevRep').addEventListener('click', ()=>{ repasoIndex=Math.max(0,repasoIndex-1); render(); });
  document.getElementById('nextRep').addEventListener('click', ()=>{
    if(repasoIndex<cards.length-1){ repasoIndex++; render(); } else {if(effectiveFilter)state.settings.topicStudyStatus[effectiveFilter]='reviewed';saveState();goto('repaso');}
  });
  document.getElementById('practThis').addEventListener('click', ()=> startSession({mode:'practica', topic:c.topic, countStats:state.settings.practiceCountsByDefault!==false}));
  for(const [buttonId,status] of [['cardKnown','known'],['cardUnknown','unknown']]) document.getElementById(buttonId).addEventListener('click',()=>{
    state.settings.flashcards ||= {};
    const previous=state.settings.flashcards[cardId]||{};
    state.settings.flashcards[cardId]={status,lastReviewed:Date.now(),reviewCount:(previous.reviewCount||0)+1};
    saveState();render();
  });
  document.getElementById('cardFavorite').addEventListener('click',()=>{
    const added=platformUiContext().toggleFavorite({type:'reviewCard',id:cardId,title:c.title,subjectId:activeSubject().id});
    showToast(added?'Tarjeta añadida a Favoritos':'Tarjeta quitada de Favoritos');
  });
  document.getElementById('topicFavorite').addEventListener('click',()=>{
    const added=platformUiContext().toggleFavorite({type:'topic',id:c.topic,title:topics.find(t=>t.id===c.topic)?.name||c.topic,subjectId:activeSubject().id});
    showToast(added?'Tema añadido a Favoritos':'Tema quitado de Favoritos');
  });
}

function renderPracticaHome(main){

    ${(()=>{const recent=(state.settings.pausedPractices||[]).filter(row=>row.subjectId===subject.id).slice(-3).reverse();return recent.length?`<section class="card"><h2>Prácticas guardadas</h2><p class="cloud-note">Puedes empezar otra práctica sin perder estas.</p>${recent.map(row=>`<div class="system-row" style="margin-top:10px"><span>${row.answers?.length||0} contestadas · ${row.queueIds?.length||0} preguntas</span><div class="btn-row"><button class="icon-btn" data-resume-paused="${escHtml(row.id)}">Continuar</button><button class="icon-btn danger-soft" data-discard-paused="${escHtml(row.id)}">Descartar</button></div></div>`).join('')}</section>`:''})()}
    <details class="card ui-disclosure"><summary><span>Más opciones</span><span class="cloud-note">Modos especiales y configuración</span></summary>

      <div class="grid grid-3">
