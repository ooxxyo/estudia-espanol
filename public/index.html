  const getCount=()=>document.getElementById('countPractice').checked;
  main.querySelectorAll('[data-select-topic]').forEach(button=>button.addEventListener('click',()=>{const countStats=getCount();state.settings.practiceTopicBySubject ||= {};state.settings.practiceTopicBySubject[subject.id]=button.dataset.selectTopic;state.activeTopicId=button.dataset.selectTopic;saveState();renderPracticaHome(main);const countBox=main.querySelector('#countPractice');if(countBox)countBox.checked=countStats;main.querySelector('#practiceTopicTitle')?.focus();}));
  main.querySelector('#reviewPracticeTopic')?.addEventListener('click',()=>platformUiContext().reviewTopic(subject.id,selectedTopic.id));
  main.querySelector('#learnMathProcedure')?.addEventListener('click',()=>startSession({mode:'practica',mathLearning:true,questionIds:MATH_CONTENT.banks.learning.map(question=>question.id),preserveOrder:true,countStats:getCount()}));
  main.querySelectorAll('[data-resume-paused]').forEach(button=>button.addEventListener('click',()=>resumePausedPracticeById(button.dataset.resumePaused)));
  main.querySelectorAll('[data-discard-paused]').forEach(button=>button.addEventListener('click',()=>{if(confirm('¿Descartar esta práctica guardada? No podrás recuperarla.')){discardPausedPracticeById(button.dataset.discardPaused);render();}}));
  main.querySelector('#practiceTopicProgress')?.addEventListener('click',()=>goto('dashboard'));
  const resumePractice=document.getElementById('resumePractice');
  if(resumePractice) resumePractice.addEventListener('click',resumeSavedPractice);
  const discardPractice=document.getElementById('discardPractice');
  if(discardPractice) discardPractice.addEventListener('click',()=>{
    if(confirm('¿Descartar esta práctica guardada? No podrás recuperarla.')){
      discardPausedPractice();
      render();
    }
  });
  main.querySelectorAll('[data-topic]').forEach(c=>c.addEventListener('click', ()=>startSession(subject.id==='matematicas'
    ? {mode:'practica',questionIds:MATH_CONTENT.banks.practice.map(question=>question.id),countStats:getCount()}
    : {mode:'practica', topic:c.dataset.topic, countStats:getCount()})));
  main.querySelectorAll('[data-vocab-mode]').forEach(button=>button.addEventListener('click',()=>{
    const mode=button.dataset.vocabMode;
    if(mode==='study'){repasoFilter='vocabulario';repasoIndex=0;state.activeTopicId='vocabulario';state.lastVisitedTopicBySubject.espanol='vocabulario';goto('repasoCards');return;}
    if(mode==='errors'){startSession({mode:'practica',errorsOnly:true,vocabularyErrorsOnly:true,countStats:getCount()});return;}
    if(mode==='adaptive'||mode==='difficult'){startSession({mode:'practica',special:'adaptativo',topic:'vocabulario',vocabularyOnly:true,countStats:getCount()});return;}
    if(mode==='mini'){goto('examen');return;}
    if(mode==='full'){startSession({mode:'examen',topics:['vocabulario'],fullExam:true});return;}
    startSession({mode:'practica',topic:'vocabulario',questionKind:mode==='general'?null:mode,countStats:getCount()});
  }));
  main.querySelectorAll('[data-special]').forEach(c=>c.addEventListener('click', ()=>{
    const sp = c.dataset.special, countStats=getCount();
    if(sp==='debiles') startSession({mode:'practica', special:'debiles', countStats});
    else if(sp==='rapido') startSession({mode:'practica', special:'rapido', limit:10, countStats});
    else if(sp==='intermedio') startSession({mode:'practica', special:'intermedio', limit:25, countStats});
    else if(sp==='figuras') startSession({mode:'practica', topic:'figuras', countStats});
    else if(sp==='morfologia') startSession({mode:'practica', topic:'morfologia', countStats});
    else if(sp==='cronica') startSession({mode:'practica', topic:'cronica', countStats});
    else if(sp==='adaptativo') startSession({mode:'practica', special:'adaptativo', countStats});
    else if(sp==='experimental') goto('experimental');
  }));
}



/* =========================================================
   MODO EXPERIMENTAL
   Generación local mediante plantillas controladas.
   No modifica estadísticas ni leaderboard.
========================================================= */
function shuffleCopy(arr){ return [...arr].sort(()=>Math.random()-.5); }
function makeExperimentalMC(topic,prompt,correctText,distractors,explanation,hints=[]){
  const options=shuffleCopy([correctText,...distractors].slice(0,4));
  return {
    id:`xq_${Date.now()}_${Math.random().toString(36).slice(2,9)}`,
    topic,type:'mc',dif:'experimental',prompt,options,
    correct:options.indexOf(correctText),
    hints:hints.length?hints:['Busca la evidencia exacta en el ejemplo.','Compara la definición con cada opción.'],
    exp:explanation,
    experimental:true
  };
}
function experimentalBank(topic){
  const bank=[];
  const add=(...args)=>bank.push(makeExperimentalMC(topic,...args));

  if(topic==='figuras'){
    [
      ['“Tus palabras son como flechas.”','Símil',['Metáfora','Hipérbole','Anáfora'],'Es símil porque compara explícitamente usando “como”.'],
      ['“La ciudad despertó de mal humor.”','Personificación',['Metáfora','Asíndeton','Aliteración'],'Se atribuye una conducta humana —despertar de mal humor— a la ciudad.'],
      ['“Tengo un millón de tareas.”','Hipérbole',['Símil','Oxímoron','Retruécano'],'La cantidad se exagera intencionalmente para enfatizar que hay muchas tareas.'],
      ['“La noche es un manto negro.”','Metáfora',['Símil','Personificación','Onomatopeya'],'Identifica directamente la noche con un manto sin utilizar una comparación explícita.'],
      ['“Corre, salta, gira, cae.”','Asíndeton',['Polisíndeton','Anáfora','Hipérbaton'],'Se omiten conjunciones entre una serie de acciones.'],
      ['“Y canta, y ríe, y baila, y sueña.”','Polisíndeton',['Asíndeton','Retruécano','Metáfora'],'La conjunción “y” se repite deliberadamente.'],
      ['“Poco a poco Pablo pasa por el parque.”','Aliteración',['Anáfora','Paradoja','Hipérbole'],'Se repite de forma marcada el sonido de la letra p.'],
      ['“Oscura claridad.”','Oxímoron',['Antítesis','Símil','Onomatopeya'],'Dos términos de significado aparentemente contradictorio aparecen unidos en una expresión breve.'],
      ['“Vivo sin vivir en mí.”','Paradoja',['Hipérbole','Aliteración','Asíndeton'],'La idea parece contradictoria, pero busca expresar un sentido más profundo.'],
      ['“Hoy quiero paz. Hoy quiero silencio. Hoy quiero descansar.”','Anáfora',['Aliteración','Retruécano','Polisíndeton'],'“Hoy quiero” se repite al comienzo de varias expresiones.']
    ].forEach(x=>add(`¿Qué figura literaria predomina en ${x[0]}`,x[1],x[2],x[3],['Fíjate en la forma del lenguaje, no solo en el significado general.']));
  }

  if(topic==='morfologia'){
    [
      ['En “panecillo”, ¿qué función cumple “ec”?','Interfijo',['Lexema','Prefijo','Morfema flexivo'],'pan + ec + illo: “ec” aparece entre el lexema y el sufijo, por eso funciona como interfijo.'],
      ['En “casita”, ¿qué parte es un morfema derivativo sufijo?','ita',['cas','a','s'],'cas es el lexema y -ita se añade después para formar una palabra derivada.'],
      ['En “niñas”, ¿qué elemento indica número plural?','s',['niñ','a','niñas'],'La -s final es un morfema flexivo que marca el plural.'],
      ['En “ilegal”, ¿dónde está el prefijo?','i-',['legal','-al','-gal'],'El elemento i- aparece antes de la base y modifica el significado.'],

    ].forEach(x=>add(x[0],x[1],x[2],x[3]));

}
function generateExperimentalQuestions(topics,count){
  // Quita las preguntas experimentales de la sesión anterior para evitar acumulación en memoria.
  for(let i=Q.length-1;i>=0;i--) if(Q[i].experimental) Q.splice(i,1);
  let bank=[];
  topics.forEach(t=>{ bank=bank.concat(experimentalBank(t)); });
  if(!bank.length) bank=experimentalBank('figuras');
  let generated=[];
  // Si piden más preguntas que plantillas, se regeneran variaciones reordenando opciones.
  while(generated.length<count){
    for(const base of shuffleCopy(bank)){
      const copy={...base,id:`xq_${Date.now()}_${generated.length}_${Math.random().toString(36).slice(2,7)}`};
      if(Array.isArray(base.options)){
        const correctText=base.options[base.correct];
        copy.options=shuffleCopy(base.options);
        copy.correct=copy.options.indexOf(correctText);
      }
      copy.experimental=true;
      generated.push(copy);
      if(generated.length>=count) break;
    }
  }
  Q.push(...generated);
  return generated;
}

/* =========================================================
   SESSION ENGINE
========================================================= */
function shuffle(arr){ return arr.map(a=>[Math.random(),a]).sort((a,b)=>a[0]-b[0]).map(a=>a[1]); }

function startSession(opts){
  const subject=activeSubject(),content=activeContent(),topics=content.topics;
  const returnView=sessionReturnView(opts.returnView||state.view,opts.mode);
  const questions=subject.id==='matematicas'
    ? MATH_CONTENT.questionsForMode(opts.mathLearning?'learning':'practice')
    : content.questions;
  if(hasResumablePractice() && state.view!=='session' && !opts.forceNew){
    if(stashCurrentPractice()) showToast('Práctica anterior guardada');
  }
  attemptStage = 0;
  let pool;
  if(opts.questionIds?.length){
    const wanted=new Set(opts.questionIds);
    pool=questions.filter(question=>wanted.has(question.id));
  } else if(opts.questionKind){
    pool=questions.filter(q=>q.topic==='vocabulario'&&q.kind===opts.questionKind);
  } else if(opts.vocabularyOnly){
    pool=questions.filter(q=>q.topic==='vocabulario').map(q=>{const relatedErrors=state.errors.filter(error=>error.qid===q.id).reduce((sum,error)=>sum+(Number(error.times)||1),0);const weight=Math.max(1,1+relatedErrors*2-(state.stats.vocabulario?.correct||0)/(Math.max(1,state.stats.vocabulario?.attempts||1)>0?10:1));return{q,key:-Math.log(Math.max(Math.random(),1e-9))/Math.max(.5,weight)};}).sort((a,b)=>a.key-b.key).map(row=>row.q);
  } else if(opts.special==='debiles'){
    const sorted = [...topics].sort((a,b)=>computeMastery(a.id).pct - computeMastery(b.id).pct);
    const weakIds = sorted.slice(0,2).map(t=>t.id);
    pool = questions.filter(q=>weakIds.includes(q.topic));
  } else if(opts.special==='adaptativo'){
    // Prioriza temas débiles sin duplicar preguntas dentro de la misma sesión.
    pool = questions.map(q=>{
      const m=computeMastery(q.topic);
      const weight=m.pct<50?3:m.pct<80?2:1;
      const u=Math.max(Math.random(),1e-9);
      return {q, key:-Math.log(u)/weight};
    }).sort((a,b)=>a.key-b.key).map(x=>x.q);
  } else if(opts.errorsOnly){
    pool = state.errors.map(e=>findQuestionById(e.qid)).filter(q=>q&&questionSubjectId(q)===subject.id&&(!opts.vocabularyErrorsOnly||q.topic==='vocabulario'));
  } else if(opts.savedOnly){
    pool = [...state.saved].map(findQuestionById).filter(q=>q&&questionSubjectId(q)===subject.id);
  } else if(opts.balancedTopics&&opts.topics?.length){
    const perTopic=Math.max(1,Math.floor((opts.limit||opts.topics.length)/opts.topics.length));
    pool=opts.topics.flatMap(topic=>shuffle(questions.filter(q=>q.topic===topic)).slice(0,perTopic));
  } else if(opts.topics && opts.topics.length){
    pool = questions.filter(q=>opts.topics.includes(q.topic));
  } else if(opts.topic){
    pool = questions.filter(q=>q.topic===opts.topic);
  } else {
    pool = questions.slice();
  }
  if(!opts.preserveOrder) pool = shuffle(pool);
  if(opts.limit) pool = pool.slice(0, Math.min(opts.limit, pool.length));
  if(opts.errorsOnly && pool.length===0){showToast('Todavía no hay errores de este contenido para practicar.',true);return;}
  if(pool.length===0) pool = shuffle(questions).slice(0, opts.limit||10);

  state.session = {
    mode: opts.mode, // 'practica' | 'examen'
    subjectId:subject.id,
    unitId:currentUnit(subject.id)?.id||null,
    queue: pool,
    idx: 0,
    answers: [], // {qid, correct, userAnswer, usedHint}
    hintsUsed: 0,
    hintLevel: 0,
    answered:false,
    currentSelection:null,
    attemptStage:0,
    startedAt: Date.now(),
    miniReviewShown:false,
    countStats: opts.mode==='examen' ? true : opts.countStats!==false,
    returnView,
    examTopics: opts.mode==='examen' ? (opts.topics||[]).slice() : [],
    examFull: opts.mode==='examen' ? !!opts.fullExam : false,
    practiceToolsEnabled:true,
    workspaceByQuestion:{},
  };
  state.activeTopicId=opts.topic||((opts.topics||[]).length===1?opts.topics[0]:null);
  if(state.activeTopicId){state.lastVisitedTopicBySubject[subject.id]=state.activeTopicId;state.settings.topicStudyStatus[state.activeTopicId]='in_progress';}
  saveState();
  goto('session');
}

function currentQ(){ const s=state.session; return s.queue[s.idx]; }

function sessionAnswerAt(s,index){
  if(!s || !Array.isArray(s.answers) || !Array.isArray(s.queue)) return null;
  const answer=s.answers[index];
  const question=s.queue[index];
  return answer && question && answer.qid===question.id ? answer : null;
}
function previousReviewIndex(s){
  if(!s || !Array.isArray(s.answers)) return -1;
  return Math.min(s.idx-1,s.answers.length-1);
}

function renderAnsweredReview(answerIndex){
  const s=state.session;
  if(!s || !s.answers.length){ render(); return; }
  const lastPreviousIndex=previousReviewIndex(s);
  if(lastPreviousIndex<0){ render(); return; }
  const idx=Math.max(0,Math.min(answerIndex,lastPreviousIndex));
  const a=s.answers[idx];
  if(!a || typeof a!=='object'){ render(); return; }
  const q=findQuestionById(a.qid);
  if(!q){ render(); return; }
  const t=topicForQuestion(q);
  const main=document.getElementById('main');
  main.innerHTML=`
    <div class="q-wrap">
      <div class="q-topbar">
        <button class="icon-btn" id="backCurrent">← Volver a la pregunta actual</button>
        <span>Revisión · ${idx+1} / ${lastPreviousIndex+1}</span>
      </div>
      <div class="q-card">
        <span class="q-topic-tag">${t.icon} ${t.name} · ${q.dif}</span>
        <h2 style="font-size:1.18rem;margin:12px 0;">${q.prompt}</h2>
        <div class="feedback ${a.correct?'good':'bad'}">
          <b>${a.skipped?'○ Saltada':a.correct?'✓ La sacaste bien':'✗ La sacaste mal'}</b>
          ${a.skipped
            ? `<div class="detail-block"><div class="detail-title">Respuesta correcta</div><div><span class="detail-answer">${escHtml(correctAnswerLabel(q))}</span></div><div class="why-box">${escHtml(q.exp||recognitionTip(q))}</div>${learningReferenceHtml(q,null,false)}<div class="detail-tip"><b>Cómo reconocerlo la próxima vez:</b> ${escHtml(recognitionTip(q))}</div></div>`
            : detailedExplanation(q,a.userAnswer,a.correct,a.procedure)}
        </div>
        <div class="btn-row" style="margin-top:16px;justify-content:space-between;">
          <button class="icon-btn" id="reviewPrev" ${idx===0?'disabled':''}>← Anterior</button>
          <button class="icon-btn" id="reviewNext">${idx===lastPreviousIndex?'Volver a pregunta actual':'Siguiente →'}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('backCurrent').addEventListener('click',render);
  document.getElementById('reviewPrev').addEventListener('click',()=>renderAnsweredReview(idx-1));
  document.getElementById('reviewNext').addEventListener('click',()=>{
    if(idx===lastPreviousIndex) render(); else renderAnsweredReview(idx+1);
  });
}

function confirmQuit(){
  const s=state.session;
  if(!s){ goto('dashboard'); return; }
  if(s.mode==='practica' && !s.experimental){
    saveAndExitPractice();
    return;
  }
  const label=s.mode==='examen'?'¿Abandonar este examen? El examen incompleto no contará.':'¿Salir de esta sesión experimental?';
  if(confirm(label)){
    const back=s.returnView || (s.mode==='examen'?'examen':'practica');
    state.session=null;
    saveState();
    goto(back);
  }
}

function wireMathWorkspace(q){
  const root=document.querySelector('[data-math-workspace]');
  if(!root)return;
  const s=state.session;
  const config=window.MATH_WORKSPACE_CONFIG.forQuestion(q);
  const mode=s.mode==='examen'?'exam':q.learningMode?'learning':'practice';
  const learningSupport=window.MATH_WORKSPACE_CONFIG.learningSupportFor(config.helpLevel);
  const learningHelpItems=learningSupport.helpIds===null?config.helpItems:config.helpItems.filter(item=>learningSupport.helpIds.includes(item.id));
  const helpItems=mode==='learning'?learningHelpItems.slice(0,learningSupport.helpLimit):config.helpItems;
  s.workspaceByQuestion=s.workspaceByQuestion&&typeof s.workspaceByQuestion==='object'?s.workspaceByQuestion:{};
  s.workspaceByQuestion[q.id]=s.workspaceByQuestion[q.id]&&typeof s.workspaceByQuestion[q.id]==='object'?s.workspaceByQuestion[q.id]:{};
  const values=s.workspaceByQuestion[q.id];
  const refreshProgress=()=>{
    for(const operation of Object.values(config.operationsByStep)){
      const product=window.MATH_WORKSPACE.verticalOperationValue(operation,values);
      if(Number.isFinite(product))values[operation.resultValueId]=product;
    }
    const visible=new Set(window.MATH_WORKSPACE_CONFIG.visibleSteps(config,values,mode));
    root.querySelectorAll('[data-math-step]').forEach(step=>{step.hidden=!visible.has(step.dataset.mathStep);});
  };
  const syncAnswer=()=>{
    if(sessionAnswerAt(s,s.idx))return;
    refreshProgress();
    sessionSelection={degrees:values.finalDegrees??'',minutes:values.finalMinutes??'',seconds:values.finalSeconds??''};
    s.currentSelection=sessionSelection;
    saveState();
    enableSubmit(['degrees','minutes','seconds'].every(key=>String(sessionSelection[key]).trim()!==''));
  };
  root.querySelectorAll('[data-workspace-field]').forEach(control=>{
    const update=()=>{
      if(control.hasAttribute('data-vertical-cell'))control.value=control.value.replace(/\D/g,'').slice(-1);
      values[control.dataset.workspaceField]=control.value;
      control.removeAttribute('aria-invalid');
      const feedback=document.getElementById('workspaceFeedback');
      if(feedback){feedback.textContent='';feedback.className='workspace-feedback';}
      syncAnswer();
    };
    control.addEventListener('input',()=>{update();if(control.hasAttribute('data-vertical-cell')&&control.value){const operationCells=[...control.closest('[data-vertical-operation]').querySelectorAll('[data-vertical-cell]')];const index=operationCells.indexOf(control);operationCells[index+1]?.focus();}});
    control.addEventListener('change',update);
    if(control.hasAttribute('data-vertical-cell'))control.addEventListener('keydown',event=>{
      const row=control.closest('.math-digit-grid');
      const rowCells=[...row.querySelectorAll('[data-vertical-cell]')];
      const column=rowCells.indexOf(control);
      const operationRows=[...control.closest('[data-vertical-operation]').querySelectorAll('.math-digit-grid')].map(grid=>[...grid.querySelectorAll('[data-vertical-cell]')]).filter(cells=>cells.length);
      const rowIndex=operationRows.findIndex(cells=>cells.includes(control));
      if(event.key==='ArrowRight'){event.preventDefault();rowCells[column+1]?.focus();}
      if(event.key==='ArrowLeft'){event.preventDefault();rowCells[column-1]?.focus();}
      if(event.key==='ArrowDown'){event.preventDefault();operationRows[rowIndex+1]?.[column]?.focus();}
      if(event.key==='ArrowUp'){event.preventDefault();operationRows[rowIndex-1]?.[column]?.focus();}
      if(event.key==='Backspace'&&!control.value){event.preventDefault();rowCells[column-1]?.focus();}
    });
  });
  root.querySelectorAll('[data-decimal-position]').forEach(button=>button.addEventListener('click',()=>{
    const fieldId=button.dataset.decimalField;
    values[fieldId]=button.dataset.decimalPosition;
    root.querySelectorAll(`[data-decimal-field="${fieldId}"]`).forEach(choice=>{choice.setAttribute('aria-pressed',String(choice===button));choice.removeAttribute('aria-invalid');});
    syncAnswer();
  }));
  root.querySelectorAll('[data-check-math-step]').forEach(button=>button.addEventListener('click',()=>{
    const stepId=button.dataset.checkMathStep;
    const operation=config.operationsByStep[stepId];
    const report=window.MATH_WORKSPACE.validateVerticalOperation(operation,values);
    const feedback=root.querySelector(`[data-math-step-feedback="${stepId}"]`);
    root.querySelectorAll(`[data-math-step="${stepId}"] [aria-invalid]`).forEach(control=>control.removeAttribute('aria-invalid'));
    if(report.valid){feedback.className='math-step-feedback good';feedback.textContent='Paso comprobado.';return;}
    const control=root.querySelector(`[data-workspace-field="${report.fieldId}"], [data-decimal-field="${report.fieldId}"]`);
    control?.setAttribute('aria-invalid','true');
    feedback.className='math-step-feedback bad';feedback.textContent=`${report.category}: ${report.message}`;
    control?.focus();
  }));
  const helpToggle=root.querySelector('[data-toggle-math-help]');
  helpToggle?.addEventListener('click',()=>{
    const panel=root.querySelector('[data-math-help-panel]');
    const open=helpToggle.getAttribute('aria-expanded')!=='true';
    helpToggle.setAttribute('aria-expanded',String(open));panel.hidden=!open;values.mathHelpOpen=open;saveState();
  });
  root.querySelectorAll('[data-math-help-topic]').forEach(button=>button.addEventListener('click',()=>{
    values.mathHelpTopic=button.dataset.mathHelpTopic;
    root.querySelectorAll('[data-math-help-topic]').forEach(item=>item.classList.toggle('active',item===button));
    root.querySelector('[data-math-help-text]').textContent=helpItems.find(item=>item.id===values.mathHelpTopic)?.text||'';
    saveState();
  }));
  syncAnswer();
}

function wireSciencePracticeTools(){
  const formulaToggle=document.getElementById('scienceFormulaToggle');
  const calculatorToggle=document.getElementById('scienceCalculatorToggle');
  if(!formulaToggle || !calculatorToggle) return;
  const togglePanel=(button,panel)=>{
    panel.hidden=!panel.hidden;
    button.setAttribute('aria-expanded',String(!panel.hidden));
    button.textContent=panel.hidden?button.dataset.closedLabel:`Ocultar ${button.dataset.panelName}`;
  };
  const formulaPanel=document.getElementById('scienceFormulaPanel');
  const calculatorPanel=document.getElementById('scienceCalculatorPanel');
  formulaToggle.dataset.closedLabel=formulaToggle.textContent;
  formulaToggle.dataset.panelName=formulaToggle.textContent.replace(/^Ver\s+/,'').toLowerCase();
  calculatorToggle.dataset.closedLabel='Calculadora';
  calculatorToggle.dataset.panelName='calculadora';
  formulaToggle.addEventListener('click',()=>togglePanel(formulaToggle,formulaPanel));
  calculatorToggle.addEventListener('click',()=>togglePanel(calculatorToggle,calculatorPanel));
  let expression='';
  const display=document.getElementById('calculatorDisplay');
  const message=document.getElementById('calculatorMessage');
  const refresh=()=>{display.textContent=expression||'0';};
  calculatorPanel.querySelectorAll('[data-calculator-key]').forEach(button=>button.addEventListener('click',()=>{
    const key=button.dataset.calculatorKey;
    message.textContent='';
    if(key==='C') expression='';
    else if(key==='⌫') expression=expression.slice(0,-1);
    else if(key==='='){
      try{expression=String(window.SCIENCE_PRACTICE_TOOLS.evaluateExpression(expression));}
      catch(error){message.textContent=error.message;}
    } else expression+=key;
    refresh();
  }));
}

function checkCorrectness(q, ans){
  if(q.type==='mc') return ans===q.correct;
  if(q.type==='tf') return ans===q.correct;
  if(q.type==='fill'){
    const strict=state.settings.strictWrittenAnswers===true||q.strictAccents===true;
    const normalize=window.SpanishVocabulary?.normalizeAnswer||((value)=>String(value??'').trim().toLowerCase());
    return ans && [q.answer,...(q.acceptedAnswers||[])].some(answer=>normalize(ans,strict)===normalize(answer,strict));
  }
  if(q.type==='numeric') return SCIENCE_CONTENT.checkNumericAnswer(q,ans).correct;
  if(q.type==='math-workspace') return MATH_CONTENT.checkDmsAnswer(q,ans).correct;
  if(q.type==='seg') return Array.isArray(ans) && q.parts.every((p,i)=>normalizeMorphRole(ans[i])===normalizeMorphRole(p.role));
  if(q.type==='eviden'){
    const okSentence = ans?.sentence===q.correctSentence;
    const okFollow = q.followup? ans?.follow===q.followup.correct : true;
    return okSentence && okFollow;
  }
  return false;
}

function escHtml(v){
  return String(v??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function answerLabel(q, ans){
  if(q.type==='mc') return q.options?.[ans] ?? 'Sin respuesta';
  if(q.type==='tf') return ans===true?'Verdadero':ans===false?'Falso':'Sin respuesta';
  if(q.type==='fill') return ans || 'Sin respuesta';
  if(q.type==='numeric') return ans?`${ans.value||'?'} ${ans.unit||'(sin unidad)'}`:'Sin respuesta';
  if(q.type==='math-workspace') return ans?`${ans.degrees||'?'}° ${ans.minutes||'?'}′ ${ans.seconds||'?'}″`:'Sin respuesta';
  if(q.type==='seg') return Array.isArray(ans)? ans.map(normalizeMorphRole).join(' · ') : 'Sin respuesta';
  if(q.type==='eviden'){
    const sent = Number.isInteger(ans?.sentence) ? q.reading?.[ans.sentence] : null;
    const follow = q.followup && Number.isInteger(ans?.follow) ? q.followup.options?.[ans.follow] : null;
    return [sent?`Oración: “${sent}”`:null, follow?`Clasificación: ${follow}`:null].filter(Boolean).join(' · ') || 'Sin respuesta';
  }
  return 'Sin respuesta';
}
function correctAnswerLabel(q){
  if(q.type==='mc') return q.options?.[q.correct] ?? '';
  if(q.type==='tf') return q.correct?'Verdadero':'Falso';
  if(q.type==='fill') return q.answer || '';
  if(q.type==='numeric') return `${q.answer} ${q.unitSymbol}`;
  if(q.type==='math-workspace') return `${q.answer.degrees}° ${q.answer.minutes}′ ${q.answer.seconds}″`;
  if(q.type==='seg') return q.parts?.map(p=>`${p.text || p.part || p.segment || ''} = ${p.role}`).join(' · ') || '';
  if(q.type==='eviden'){
    const sent=q.reading?.[q.correctSentence];
    const follow=q.followup ? q.followup.options?.[q.followup.correct] : null;
    return [sent?`“${sent}”`:null, follow].filter(Boolean).join(' · ');
  }
  return '';
}
function recognitionTip(q){
  const hs=(q.hints||[]).filter(Boolean);
  if(hs.length) return hs[hs.length-1];
  const topic=topicForQuestion(q)?.name || 'este tema';
  return `Relaciona la definición con la característica clave de ${topic}.`;
}
function normalizeConceptText(v){
  return String(v??'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[“”"'()[\]{}:;,.!?¿¡/\\|+_=*-]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
const CONCEPT_ALIASES = {
  gramatica:['gramatica'],
  morfologia:['morfologia'],
  sintaxis:['sintaxis'],
  'lexema o raiz':['lexema','raiz','lexema o raiz'],
  'morfema derivativo':['morfema derivativo'],
  'morfema flexivo':['morfema flexivo','mf'],
  'mdp prefijo':['mdp','prefijo','morfema derivativo prefijo'],
  'mds sufijo':['mds','sufijo','morfema derivativo sufijo'],
  interfijo:['interfijo','mdi','infijo','inf'],
  'palabra derivada':['palabra derivada','derivada'],
  parasintesis:['parasintesis'],
  'genero narrativo':['genero narrativo'],
  'narrador protagonista':['narrador protagonista','protagonista'],
  'narrador testigo':['narrador testigo','testigo'],
  cronica:['cronica'],
  'autor testigo':['autor testigo'],
  'exactitud y veracidad':['exactitud y veracidad','exactitud','veracidad'],
  'afan descriptivo':['afan descriptivo','descriptivo'],
  'intencion narrativa':['intencion narrativa'],
  'recursos retoricos y literarios':['recursos retoricos y literarios','recursos literarios','recursos retoricos'],
  simil:['simil','comparacion explicita'],
  metafora:['metafora'],

  hiperbole:['hiperbole'],
  antitesis:['antitesis'],
  anafora:['anafora'],
  retruecano:['retruecano'],
  aliteracion:['aliteracion'],

  polisindeton:['polisindeton'],

  redundancia:['redundancia'],
  encabalgamiento:['encabalgamiento'],
  oximoron:['oximoron'],
  paradoja:['paradoja'],
  alegoria:['alegoria']
};
function conceptCardMatches(card, source, topic){
  if(!card || !source) return false;
  if(topic && card.topic!==topic) return false;
  const src=normalizeConceptText(source);
  const key=normalizeConceptText(card.title);
  const aliases=CONCEPT_ALIASES[key]||[key];
  return aliases.some(alias=>{
    const a=normalizeConceptText(alias);
    return a && (src===a || src.includes(a));
  });
}
function findConceptCard(q, ans, correct){
  const reviewCards=subjectContent(questionSubjectId(q)).reviewCards;
  if(q.type==='seg'){
    return reviewCards.find(c=>c.topic==='gramatica' && c.title==='Morfología')
      || reviewCards.find(c=>c.title==='Lexema o raíz')
      || null;
  }

  const right=correctAnswerLabel(q);
  const selected=answerLabel(q,ans);
  const followupCorrect = q.type==='eviden' && q.followup
    ? q.followup.options?.[q.followup.correct]
    : '';
  const sources = correct
    ? [selected, followupCorrect, right, q.prompt, q.exp]
    : [right, followupCorrect, q.prompt, q.exp];

  // Primero busca dentro del tema de la pregunta para evitar ambigüedades
  // como "testigo" en Narrador y "autor testigo" en Crónica.
  for(const source of sources){
    const card=reviewCards.find(c=>conceptCardMatches(c,source,q.topic));
    if(card) return card;
  }
  for(const source of sources){
    const card=reviewCards.find(c=>conceptCardMatches(c,source,null));
    if(card) return card;
  }

  // Fallbacks generales, todavía basados en el material del propio cuaderno.
  const fallbackTitle={
    gramatica:'Gramática',
    morfologia:'Morfología',
    narrativa:'Género narrativo',
    cronica:'Crónica'
  }[q.topic];
  return fallbackTitle ? reviewCards.find(c=>c.title===fallbackTitle) || null : null;
}
function segmentationExample(q){
  if(q.type!=='seg' || !Array.isArray(q.parts)) return '';
  return `${q.word}: ` + q.parts.map(p=>`${p.text} (${p.role})`).join(' + ');
}
function learningReferenceHtml(q, ans, correct){
  const card=findConceptCard(q,ans,correct);
  const definition=card?.def || '';
  const example=q.type==='seg'
    ? segmentationExample(q)
    : (card?.example || '');

  if(!definition && !example) return '';

  return `<div class="learning-ref">
    ${card?.title?`<div class="learning-box"><span class="learning-label">Concepto</span><b>${escHtml(card.title)}</b></div>`:''}
    ${definition?`<div class="learning-box"><span class="learning-label">Definición</span>${escHtml(definition)}</div>`:''}
    ${example?`<div class="learning-box example-box"><span class="learning-label">Ejemplo para entenderlo</span>${escHtml(example)}</div>`:''}
  </div>`;
}
function mathProcedureReview(q,procedure){
  if(q?.type!=='math-workspace'||!procedure||typeof procedure!=='object')return '';
  const config=window.MATH_WORKSPACE_CONFIG?.forQuestion(q);
  if(!config)return '';
  const shown=value=>String(value??'').trim()===''?'·':escHtml(String(value));
  const row=cells=>cells.map(cell=>shown(procedure[cell.id])).join(' ');
  const issues=window.MATH_WORKSPACE_CONFIG.reviewProcedure(config,procedure);
  const issueMarkup=issues.length?`<div class="workspace-feedback bad"><b>Errores del procedimiento:</b>${issues.map(issue=>`<div>${escHtml(issue.stepTitle)} · ${escHtml(issue.category)}: ${escHtml(issue.message)}</div>`).join('')}</div>`:'<div class="workspace-feedback good">El procedimiento escrito no contiene errores.</div>';
  const steps=config.steps.map(step=>{
    if(step.kind==='operation'){
      const operation=step.operation;
      const partials=operation.partialRows.map(item=>row(item.cells)).join(' | ');
      const decimal=shown(procedure[operation.result.decimal.id]);
      return `<div class="math-review-step"><b>${escHtml(step.title)}</b><span class="math-review-operation">acarreo ${row(operation.carry.cells)} · número ${row(operation.operand.cells)} · × 60 · parciales ${partials} · suma ${row(operation.result.cells)} · punto en ${decimal}</span></div>`;
    }
    return `<div class="math-review-step"><b>${escHtml(step.title)}</b><span>${step.fields.map(field=>`${escHtml(field.label)}: ${shown(procedure[field.id])}`).join(' · ')}</span></div>`;
  }).join('');
  return `<details class="math-procedure-review"><summary><b>Revisar mi procedimiento</b></summary>${issueMarkup}${steps}</details>`;
}
function detailedExplanation(q, ans, correct, procedure){
  const selected=answerLabel(q, ans);
  const right=correctAnswerLabel(q);
  const why=escHtml(q.exp || recognitionTip(q));
  if(q.type==='numeric'){
    const result=SCIENCE_CONTENT.checkNumericAnswer(q,ans);
    const errorLabel=result.numberCorrect&&!result.unitCorrect?'UNIDAD':q.errorType||'OPERACIÓN';
    return `<div class="detail-block"><div class="detail-title">${correct?'Explicación':'Respuesta correcta'}</div><div class="why-box">${escHtml(q.simpleExplanation||q.exp)}</div>${correct?'':`<p><b>Error detectado: ${escHtml(errorLabel)}</b> · Tu respuesta: ${escHtml(selected)} · Correcta: ${escHtml(right)}</p>`}<details class="ui-disclosure"><summary><b>Ver procedimiento completo</b><span class="cloud-note">Fórmula, sustitución, procedimiento y unidades</span></summary><p>${escHtml(q.detailedExplanation)}</p></details></div>`;
  }
  if(q.type==='math-workspace'){
    const result=MATH_CONTENT.checkDmsAnswer(q,ans);
    return `<div class="detail-block"><div class="detail-title">${correct?'Explicación':'Respuesta correcta'}</div><div class="why-box">${escHtml(q.simpleExplanation)}</div>${correct?'':`<p><b>Error detectado: ${escHtml(result.errorType||'PROCEDIMIENTO')}</b> · Tu respuesta: ${escHtml(selected)} · Correcta: ${escHtml(right)}</p>`}${mathProcedureReview(q,procedure)}<details class="ui-disclosure"><summary><b>Ver procedimiento completo</b><span class="cloud-note">Grados, minutos, segundos y redondeo</span></summary><p>${escHtml(q.detailedExplanation)}</p></details></div>`;
  }
  let out='<div class="detail-block">';

  if(correct){
    out += `<div class="detail-title">¿Por qué está bien?</div>
      <div class="why-box">Escogiste <span class="detail-answer">${escHtml(selected)}</span>. <b>Está bien</b> porque ${why}</div>`;
  } else {
    out += `<div class="detail-title">¿Por qué estaba mal?</div>
      <div class="why-box">Escogiste <span class="detail-answer">${escHtml(selected)}</span>, pero la respuesta correcta es <span class="detail-answer">${escHtml(right)}</span>. ${why}</div>`;
  }

  out += learningReferenceHtml(q,ans,correct);
  out += `<div class="detail-tip"><b>Cómo reconocerlo la próxima vez:</b> ${escHtml(recognitionTip(q))}</div></div>`;
  return out;
}

let attemptStage = 0; // for practice mode two-try flow
function submitAnswer(){
  const q=currentQ(); const s=state.session;
  if(!q || !s || sessionAnswerAt(s,s.idx)) return;
  const submitBtn=document.getElementById('submitBtn');
  if(!submitBtn || submitBtn.disabled) return;
  const isExam = s.mode==='examen';
  if(q.type==='numeric' && !validateScienceWorkspace(q).valid) return;
  if(q.type==='math-workspace' && !isExam && !validateMathWorkspace(q).valid) return;
  submitBtn.disabled=true;
  const correct = checkCorrectness(q, sessionSelection);
  const fb=document.getElementById('feedbackZone');

  if(isExam){
    const procedure=q.type==='math-workspace'?{...(s.workspaceByQuestion?.[q.id]||{})}:undefined;
    s.answers.push({qid:q.id, correct, hintsUsed:s.hintLevel, userAnswer:sessionSelection,procedure});
    s.answered=true;
    saveState();
    submitBtn.textContent=s.idx===s.queue.length-1?'Revisar antes de entregar':'Siguiente';
    submitBtn.disabled=false;
    submitBtn.onclick = ()=>advance();
    document.querySelectorAll('.opt,.fill-input,select,.sent,[data-workspace-field],[data-decimal-position],[data-check-math-step],[data-toggle-math-help],[data-math-help-topic]').forEach(el=>{el.style.pointerEvents='none'; if('disabled' in el) el.disabled=true;});
    return;
  }

  // Práctica con dos intentos: el primer fallo NO revela la respuesta correcta.
  if(correct){
    markAnswerVisual(q, sessionSelection, true);
    fb.innerHTML = `<div class="feedback good"><b>✓ Correcto</b>${detailedExplanation(q, sessionSelection, true)}</div>`;
    s.answers.push({qid:q.id, correct:true, hintsUsed:s.hintLevel, userAnswer:sessionSelection});
    s.answered=true;
    recordAnswer(q, true);
    if(s.countStats===false) saveState();
    finalizeStep();
  } else if(attemptStage===0 && q.type==='numeric'){
    attemptStage=1;
    s.attemptStage=1;
    const result=SCIENCE_CONTENT.checkNumericAnswer(q,sessionSelection);
    const message=result.numberCorrect&&!result.unitCorrect
      ? 'El cálculo está bien. Revisa la unidad antes de volver a comprobar.'
      : 'Revisa el resultado de la operación y corrígelo antes de volver a comprobar.';
    fb.innerHTML=`<div class="feedback bad"><b>Revisa este paso</b>${escHtml(message)}</div>`;
    submitBtn.textContent='Comprobar de nuevo';
    submitBtn.disabled=false;
    (result.numberCorrect?document.getElementById('numericUnit'):document.getElementById('numericValue'))?.focus();
    saveState();
  } else if(attemptStage===0 && q.type==='math-workspace'){
    attemptStage=1;
    s.attemptStage=1;
    const result=MATH_CONTENT.checkDmsAnswer(q,sessionSelection);
    fb.innerHTML=`<div class="feedback bad"><b>Revisa este paso</b>${escHtml(`La respuesta DMS todavía tiene un error en ${String(result.errorType||'el procedimiento').toLowerCase()}. Corrige ese paso sin cambiar los que ya comprobaste.`)}</div>`;
    submitBtn.textContent='Comprobar de nuevo';
    submitBtn.disabled=false;
    saveState();
  } else if(attemptStage===0 && q.type!=='numeric'){
    attemptStage=1;
    s.attemptStage=1;
    fb.innerHTML = `<div class="feedback bad"><b>✗ Incorrecto</b>Inténtalo otra vez. ${q.hints?'Puedes usar una pista.':''}</div>`;
    document.getElementById('submitBtn').textContent='Responder de nuevo';
    document.getElementById('submitBtn').disabled=true;
    reenableInputs(q);
    saveState();
  } else {
    markAnswerVisual(q, sessionSelection, false);
    fb.innerHTML = `<div class="feedback bad"><b>✗ Incorrecto</b>${detailedExplanation(q, sessionSelection, false)}</div>`;
    s.answers.push({qid:q.id, correct:false, hintsUsed:s.hintLevel, userAnswer:sessionSelection});
    s.answered=true;
    recordAnswer(q, false);
    if(s.countStats===false) saveState();
    finalizeStep();
  }
}
function reenableInputs(q){
  const box=document.getElementById('qBody');
  sessionSelection=null;
  state.session.currentSelection=null;
  box.querySelectorAll('.opt').forEach(o=>{ o.classList.remove('selected','correct','incorrect'); o.style.pointerEvents='auto'; });
  box.querySelectorAll('select').forEach(s=>{ s.disabled=false; s.classList.remove('correct','incorrect'); s.value=''; });
  const fillEl = document.getElementById('fillInput'); if(fillEl){ fillEl.disabled=false; fillEl.classList.remove('correct','incorrect'); fillEl.value=''; }
  for(const id of ['numericValue','numericUnit']){const el=document.getElementById(id);if(el){el.disabled=false;el.classList.remove('correct','incorrect');el.value='';}}
  if(q.type==='math-workspace') box.querySelectorAll('[data-workspace-field]').forEach(el=>{el.disabled=false;el.style.pointerEvents='auto';el.classList.remove('correct','incorrect');});
  box.querySelectorAll('.sent').forEach(s=>{ s.style.pointerEvents='auto'; s.classList.remove('picked','correct','incorrect'); });
  document.getElementById('submitBtn').disabled=true;
}
function restoreFinalizedQuestion(q,isExam,answer){
  sessionSelection=answer.userAnswer??null;
  state.session.currentSelection=sessionSelection;
  state.session.answered=true;
  if(isExam){
    document.querySelectorAll('.opt,.fill-input,select,.sent,[data-workspace-field],[data-decimal-position],[data-check-math-step],[data-toggle-math-help],[data-math-help-topic]').forEach(el=>{el.style.pointerEvents='none';if('disabled' in el)el.disabled=true;});
    const submitBtn=document.getElementById('submitBtn');
    submitBtn.textContent=s.idx===s.queue.length-1?'Revisar antes de entregar':'Siguiente';
    submitBtn.disabled=false;
    submitBtn.onclick=()=>advance();
    return;
  }
  if(!answer.skipped) markAnswerVisual(q,answer.userAnswer,!!answer.correct);
  document.getElementById('feedbackZone').innerHTML=answer.skipped
    ? `<div class="feedback bad"><b>○ Saltada</b><div class="detail-block"><div class="detail-title">Respuesta correcta</div><div><span class="detail-answer">${escHtml(correctAnswerLabel(q))}</span></div></div></div>`
    : `<div class="feedback ${answer.correct?'good':'bad'}"><b>${answer.correct?'✓ Correcto':'✗ Incorrecto'}</b>${detailedExplanation(q,answer.userAnswer,!!answer.correct,answer.procedure)}</div>`;
  finalizeStep();
}
function markAnswerVisual(q, ans, correct){
  const box=document.getElementById('qBody');
  if(q.type==='mc'){
    box.querySelectorAll('.opt').forEach((o,i)=>{
      o.style.pointerEvents='none';
      if(i===q.correct) o.classList.add('correct');
      else if(i===ans) o.classList.add('incorrect');
    });
  } else if(q.type==='tf'){
    box.querySelectorAll('.opt').forEach(o=>{
      o.style.pointerEvents='none';
      const v = o.dataset.v==='true';
      if(v===q.correct) o.classList.add('correct');
      else if(v===ans) o.classList.add('incorrect');
    });
  } else if(q.type==='fill'){
    const el=document.getElementById('fillInput'); el.disabled=true;
    el.classList.add(correct?'correct':'incorrect');
  } else if(q.type==='numeric'){
    for(const id of ['numericValue','numericUnit']){const el=document.getElementById(id);if(el){el.disabled=true;el.classList.add(correct?'correct':'incorrect');}}
    box.querySelectorAll('[data-workspace-field]').forEach(el=>{el.disabled=true;el.style.pointerEvents='none';});
  } else if(q.type==='math-workspace'){
    box.querySelectorAll('[data-workspace-field]').forEach(el=>{el.disabled=true;el.style.pointerEvents='none';el.classList.add(correct?'correct':'incorrect');});
    box.querySelectorAll('[data-decimal-position],[data-check-math-step],[data-toggle-math-help],[data-math-help-topic]').forEach(el=>{el.disabled=true;el.style.pointerEvents='none';});
  } else if(q.type==='seg'){
    box.querySelectorAll('select').forEach((sel,i)=>{
      sel.disabled=true;
      sel.classList.add(sel.value===q.parts[i].role?'correct':'incorrect');
    });
  } else if(q.type==='eviden'){
    box.querySelectorAll('.sent').forEach((sp,i)=>{
      sp.style.pointerEvents='none';
      if(i===q.correctSentence) sp.classList.add('correct');
      else if(i===ans?.sentence) sp.classList.add('incorrect');
    });
    if(q.followup) box.querySelectorAll('[data-fi]').forEach((o,i)=>{
      o.style.pointerEvents='none';
      if(i===q.followup.correct) o.classList.add('correct');
      else if(i===ans?.follow) o.classList.add('incorrect');
    });
  }
}
function finalizeStep(){
  document.getElementById('submitBtn').textContent = state.session.idx===state.session.queue.length-1? 'Ver resultados':'Siguiente pregunta';
  document.getElementById('submitBtn').disabled=false;
  document.getElementById('submitBtn').onclick = ()=>advance();
  document.getElementById('hintBtn') && (document.getElementById('hintBtn').disabled=true);
}
function nextQuestion(ans, correct, skipped){
  if(sessionAnswerAt(state.session,state.session?.idx)) return;
  if(skipped){
    const q=currentQ();
    state.session.answers.push({qid:q.id, correct:false, skipped:true, userAnswer:null});
    state.session.answered=true;
  }
  advance();
}
function advance(){
  attemptStage=0;
  const s=state.session;
  s.attemptStage=0;
  s.currentSelection=null;
  s.hintLevel=0;
  s.answered=false;
  if(s.idx < s.queue.length-1){ s.idx++; saveState(); render(); }
  else if(s.mode==='examen'){saveState();renderExamReview();}
  else { finishSession(); }
}
function renderExamReview(){
  const s=state.session;if(!s||s.mode!=='examen'){render();return;}
  const main=document.getElementById('main');
  main.innerHTML=`<div class="pagehead"><h1>Revisa antes de entregar</h1><p>Las respuestas correctas se mostrarán solamente después de entregar.</p></div><div class="card"><div class="btn-row">${s.queue.map((question,index)=>`<button class="chip ${sessionAnswerAt(s,index)?'active':''}" data-exam-question="${index}">${index+1}</button>`).join('')}</div><div class="q-actions" style="margin-top:20px"><button class="icon-btn" id="returnExam">← Volver al examen</button><button class="btn" id="submitExamFinal">Entregar examen</button></div></div>`;
  main.querySelectorAll('[data-exam-question]').forEach(button=>button.addEventListener('click',()=>{s.idx=Number(button.dataset.examQuestion);s.currentSelection=sessionAnswerAt(s,s.idx)?.userAnswer??null;render();}));
  document.getElementById('returnExam').addEventListener('click',()=>{s.idx=Math.max(0,s.queue.length-1);s.currentSelection=sessionAnswerAt(s,s.idx)?.userAnswer??null;render();});
  document.getElementById('submitExamFinal').addEventListener('click',()=>{if(confirm('¿Entregar el examen y ver el resultado?'))finishSession();});
}
function finishSession(){
  const s=state.session;
  const total = s.answers.length;
  const correctCount = s.answers.filter(a=>a.correct).length;
  const pct = total? Math.round(correctCount/total*100):0;
  const elapsed = Math.round((Date.now()-s.startedAt)/1000);
  const countsTowardProgress = s.mode==='examen' || s.countStats!==false;
  if(countsTowardProgress){
    if(s.subjectId==='espanol') state.studySeconds += elapsed;
    else (state.subjectTotals[s.subjectId]||(state.subjectTotals[s.subjectId]={answered:0,correct:0,currentStreak:0,bestStreak:0,studySeconds:0})).studySeconds += elapsed;
  }
  if(s.mode==='examen'){
    s.answers.filter(a=>!a.skipped).forEach(a=>{
      const q=findQuestionById(a.qid);
      if(q) recordAnswer(q, !!a.correct);
    });
  }

  const byTopic={};
  s.answers.forEach(a=>{
    const q=findQuestionById(a.qid); if(!q) return;
    byTopic[q.topic] = byTopic[q.topic]||{c:0,t:0};
    byTopic[q.topic].t++; if(a.correct) byTopic[q.topic].c++;
  });

  // Las sesiones experimentales no entran al historial oficial porque sus preguntas son temporales.
  if(!s.experimental) state.history.push({
    id:`${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
    date:new Date().toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric'}),
    time: new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),
    mode:s.mode,subjectId:s.subjectId||'espanol',unitId:s.unitId||currentUnit(s.subjectId||'espanol')?.id||null,total, correct:correctCount, pct, seconds:elapsed,
    byTopic, countsTowardProgress,
    examTopics:s.examTopics||[], examFull:!!s.examFull,
    answers:s.answers.map(a=>({qid:a.qid,correct:!!a.correct,skipped:!!a.skipped,hintsUsed:a.hintsUsed||0,userAnswer:a.userAnswer??null,procedure:a.procedure??null}))
  });

  state.lastResult = {subjectId:s.subjectId||'espanol',unitId:s.unitId||currentUnit(s.subjectId||'espanol')?.id||null,total, correctCount, pct, elapsed, byTopic, answers:s.answers, mode:s.mode, returnView:sessionReturnView(s.returnView,s.mode), countsTowardProgress, examTopics:s.examTopics||[], examFull:!!s.examFull, experimental:!!s.experimental};
  const completedResult=state.lastResult;
  state.session=null;
  saveState();
  if(completedResult.mode==='examen') submitLeaderboardScore(completedResult);
  goto('results');
}

      ${r.answers.map((a,i)=>{ const q=findQuestionById(a.qid); if(!q) return ''; return `<div class="err-item"><div class="q">${i+1}. ${q.prompt}</div><div class="feedback ${a.correct?'good':'bad'}" style="margin-top:10px;"><b>${a.correct?'✓ Correcto':'✗ Incorrecto'}</b>${detailedExplanation(q,a.userAnswer,a.correct,a.procedure)}</div></div>`; }).join('')}

function bindPasswordToggle(buttonId,inputId){
  const b=document.getElementById(buttonId), i=document.getElementById(inputId); if(!b||!i)return;
  b.addEventListener('click',()=>{const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'Ocultar':'Ver';b.setAttribute('aria-pressed',show?'true':'false');});

function passwordStrengthText(value){
  let n=0;if(value.length>=8)n++;if(value.length>=12)n++;if(/[A-Z]/.test(value)&&/[a-z]/.test(value))n++;if(/\d/.test(value))n++;if(/[^A-Za-z0-9]/.test(value))n++;
  return n<=1?'Básica':n<=3?'Buena':'Fuerte';
}

const FEEDBACK_TYPES=Object.freeze({bug:'Bug',suggestion:'Sugerencia',content:'Contenido','ui-ux':'UI/UX',other:'Otro'});

async function feedbackRequest(method='GET',body=null,query=''){
  return requestJson(`/.netlify/functions/feedback${query?`?${query}`:''}`,{method,body,fallbackMessage:'No se pudo procesar el feedback.'});
}
function feedbackCard(report,admin=false){
  const subject=SUBJECT_BY_ID.get(report.subjectId);
  return `<article class="feedback-card"><div class="system-row"><div><span class="feedback-type">${escHtml(FEEDBACK_TYPES[report.type]||'Otro')}</span><h3>${escHtml(report.title||'Sin título')}</h3><div class="meta">${new Date(Number(report.createdAt)||Date.now()).toLocaleString('es-ES')} ${subject?`· ${subject.emoji} ${subject.name}`:''}</div></div><span class="status-badge ${report.status==='dismissed'?'suspended':''}">${escHtml(FEEDBACK_STATUSES[report.status]||'Nuevo')}</span></div><p style="white-space:pre-wrap;margin:12px 0 0;">${escHtml(report.message||'')}</p>${admin?`<div class="meta" style="margin-top:10px;">${escHtml(report.displayName||report.username||'Estudiante')} · @${escHtml(report.username||'')}</div><div class="admin-actions"><select data-feedback-status="${escHtml(report.id)}">${Object.entries(FEEDBACK_STATUSES).map(([value,label])=>`<option value="${value}" ${report.status===value?'selected':''}>${label}</option>`).join('')}</select><button class="icon-btn" data-save-feedback="${escHtml(report.id)}">Guardar estado</button></div>`:''}</article>`;
}
function renderFeedback(main){
  if(!accountSession.user){
    main.innerHTML=`<div class="pagehead"><h1>Enviar feedback</h1><p>Ayúdanos a mejorar el Study Hub.</p></div><div class="card"><h2 style="margin-top:0;">Inicia sesión para continuar</h2><p>Así podrás consultar el estado de tus propios reportes sin ver feedback privado de otras personas.</p><button class="btn" id="feedbackLogin">Ir a Cuenta</button></div>`;

  const feedbackSubject=document.getElementById('feedbackSubject'),feedbackTopic=document.getElementById('feedbackTopic');
  feedbackSubject.addEventListener('change',()=>{const topics=subjectContent(feedbackSubject.value).topics;feedbackTopic.innerHTML='<option value="">Sin tema</option>'+topics.map(topic=>`<option value="${topic.id}">${topic.icon} ${topic.name}</option>`).join('');});

    event.preventDefault();
    const button=document.getElementById('sendFeedback');
    const note=document.getElementById('feedbackMessageState');

      const subjectId=feedbackSubject.value;

      document.getElementById('feedbackTitle').value='';document.getElementById('feedbackMessage').value='';

    }catch(error){note.textContent=error.message;showToast(error.message,true);}finally{button.disabled=false;}

  document.getElementById('refreshFeedback').addEventListener('click',loadOwnFeedback);
  loadOwnFeedback();

async function loadOwnFeedback(){

async function adminRequest(method='GET',body=null,query=''){

function roleLabel(role){return role==='superdev'?'Super Dev':role==='owner'?'Owner':role==='admin'?'Admin':'Member';}
function frontendCanManage(actorRole,targetRole){
  if(targetRole==='superdev')return false;
  if(actorRole==='admin')return targetRole==='member';
  if(actorRole==='owner')return targetRole==='member'||targetRole==='admin';
  return actorRole==='superdev'&&['member','admin','owner'].includes(targetRole);
}
function relativeActivity(value){
  const at=Number(value||0);if(!at)return'Sin actividad registrada';
  const seconds=Math.max(0,Math.round((Date.now()-at)/1000));
  if(seconds<60)return'Hace menos de un minuto';if(seconds<3600)return`Hace ${Math.floor(seconds/60)} min`;
  if(seconds<86400)return`Hace ${Math.floor(seconds/3600)} h`;
  return new Date(at).toLocaleDateString('es-ES');
}
let activeAdminSection='summary';
const ADMIN_SECTIONS=[
  {id:'summary',label:'Resumen',roles:['admin','owner','superdev']},
  {id:'users',label:'Usuarios',roles:['admin','owner','superdev']},
  {id:'connected',label:'Conectados',roles:['admin','owner','superdev']},
  {id:'feedback',label:'Feedback',roles:['admin','owner','superdev']},
  {id:'bugs',label:'Bugs',roles:['admin','owner','superdev']},
  {id:'moderation',label:'Moderación',roles:['admin','owner','superdev']},
  {id:'early',label:'Early Access',roles:['superdev']},
  {id:'sessions',label:'Sesiones',roles:['superdev']},
  {id:'system',label:'Sistema',roles:['superdev']},
  {id:'updates',label:'Novedades',roles:['admin','owner','superdev']},
];
function renderAdmin(main){
  const role=accountSession.user?.role;
  if(!['admin','owner','superdev'].includes(role)){
    main.innerHTML='<div class="pagehead"><h1>Admin</h1><p>No tienes permiso para acceder a esta sección.</p></div>';

  }
  const sections=ADMIN_SECTIONS.filter(section=>section.roles.includes(role));

async function loadAdminSection(section){
  const box=document.getElementById('adminContent');if(!box)return;

  if(section==='sessions'){renderAdminUsersShell(box,true);return;}

  if(section==='bugs'){window.StudyHubBugs.renderAdmin(box,platformUiContext());return;}

function adminUserCard(user,index,actorRole,sessionsOnly){
  const manageable=frontendCanManage(actorRole,user.role)&&user.id!==accountSession.user?.id;
  return `<article class="admin-user-card"><div class="system-row"><div><h3>${escHtml(user.displayName||user.username)} ${user.veteran?'<span class="veteran-badge">Veterano</span>':''}</h3><div class="meta">@${escHtml(user.username||'')} ${user.email?`· ${escHtml(user.email)}`:''}</div></div><div class="admin-user-meta"><span class="role-badge">${roleLabel(user.role)}</span><span class="status-badge ${user.status==='suspended'?'suspended':user.online?'':'offline'}">${user.status==='suspended'?'Suspendido':user.online?'Online':'Offline'}</span></div></div><div class="meta" style="margin-top:8px;">Rango: ${escHtml(user.visibleRank||'Estudiante')} · ${relativeActivity(user.lastActivityAt)} · ${Number(user.activeSessions)||0} sesiones activas${user.section?` · ${escHtml(user.section)}`:''}</div>${sessionsOnly?`${manageable?`<div class="admin-actions"><button class="icon-btn" data-admin-action="revoke-sessions" data-admin-index="${index}">Cerrar sesiones</button></div>`:'<p class="cloud-note">Sesiones protegidas para tu rol.</p>'}`:`<button class="icon-btn" style="margin-top:10px;" data-user-detail="${index}">Abrir usuario</button><div class="admin-detail" id="adminDetail${index}" hidden>${adminUserDetail(user,index,actorRole,manageable)}</div>`}</article>`;
}
function adminUserDetail(user,index,actorRole,manageable){
  if(!manageable)return'<p class="cloud-note">Esta cuenta está protegida para tu rol. Super Dev nunca puede modificarse desde este panel.</p>';
  const isSuper=actorRole==='superdev';
  return `<div class="admin-form-grid"><label>Nombre visible<input id="adminDisplay${index}" maxlength="60" value="${escHtml(user.displayName||user.username)}"></label><label>Rango visible<input id="adminRank${index}" maxlength="40" value="${escHtml(user.visibleRank||'Estudiante')}" ${isSuper?'':'disabled'}></label></div><label class="account-form" style="margin-top:10px;">Razón administrativa (opcional)<input id="adminReason${index}" maxlength="200" placeholder="Motivo para el audit log"></label><div class="admin-actions"><button class="icon-btn" data-admin-action="update-profile" data-admin-index="${index}">Guardar perfil</button>${isSuper?`<button class="icon-btn" data-admin-action="${user.veteran?'remove-veteran':'set-veteran'}" data-admin-index="${index}">${user.veteran?'Quitar Veterano':'Convertir en Veterano'}</button>${user.role==='member'?`<button class="icon-btn" data-admin-action="grant-admin" data-admin-index="${index}">Dar Admin</button>`:user.role==='admin'?`<button class="icon-btn" data-admin-action="revoke-admin" data-admin-index="${index}">Quitar Admin</button>`:''}`:''}<button class="icon-btn" data-admin-action="${user.status==='suspended'?'reactivate':'suspend'}" data-admin-index="${index}">${user.status==='suspended'?'Reactivar':'Suspender'}</button><button class="icon-btn" data-admin-action="revoke-sessions" data-admin-index="${index}">Cerrar sesiones</button><button class="icon-btn" data-admin-action="remove-leaderboard" data-admin-index="${index}">Quitar leaderboard</button><button class="icon-btn" data-admin-action="delete" data-admin-index="${index}">Borrar cuenta</button></div>`;

async function loadAdminUsers(query='',filter='all',sessionsOnly=false){
  const box=document.getElementById('adminList');if(!box)return;
  box.innerHTML='<div class="empty-state"><span class="ic">…</span>Cargando usuarios…</div>';
  try{
    const params=new URLSearchParams({section:'users',q:query,filter:sessionsOnly?'all':filter});
    const data=await adminRequest('GET',null,params.toString());
    const users=Array.isArray(data.users)?data.users:[];
    const actorRole=data.actor?.role||accountSession.user?.role||'member';
    box.innerHTML=users.length?users.map((user,index)=>adminUserCard(user,index,actorRole,sessionsOnly)).join(''):'<div class="empty-state"><span class="ic">○</span>No se encontraron usuarios.</div>';
    box.querySelectorAll('[data-user-detail]').forEach(button=>button.addEventListener('click',()=>{const detail=document.getElementById(`adminDetail${button.dataset.userDetail}`);detail.hidden=!detail.hidden;button.textContent=detail.hidden?'Abrir usuario':'Cerrar detalle';}));
    box.querySelectorAll('[data-admin-action]').forEach(button=>button.addEventListener('click',async()=>{const index=Number(button.dataset.adminIndex),user=users[index];if(user)await window.StudyHubForms.run(button,'Procesando…',()=>runAdminAction(button.dataset.adminAction,user,query,filter,index,sessionsOnly));}));
  }catch(error){box.innerHTML=`<div class="empty-state"><span class="ic">!</span>${escHtml(error.message)}</div>`;}
}
async function runAdminAction(action,user,query,filter,index,sessionsOnly){
  const labels={suspend:'suspender',reactivate:'reactivar','revoke-sessions':'cerrar las sesiones de','remove-leaderboard':'quitar del leaderboard a','set-veteran':'convertir en Veterano a','remove-veteran':'quitar Veterano a','grant-admin':'dar Admin a','revoke-admin':'quitar Admin a',delete:'borrar permanentemente'};
  if(action==='delete'){
    const typed=prompt(`Acción irreversible: escribe exactamente ${user.username} para borrar esta cuenta y sus datos.`);
    if(typed!==user.username){if(typed!==null)showToast('El username no coincide. No se realizó ningún cambio.',true);return;}
  }else if(action!=='update-profile'&&!confirm(`¿Confirmas ${labels[action]} ${user.username}?`))return;
  const body={action,targetUserId:user.id,reason:document.getElementById(`adminReason${index}`)?.value||''};
  if(action==='update-profile'){body.displayName=document.getElementById(`adminDisplay${index}`)?.value||'';body.visibleRank=document.getElementById(`adminRank${index}`)?.value||'';}
  try{await adminRequest('POST',body);showToast('Cambio administrativo guardado ✓');await loadAdminUsers(query,filter,sessionsOnly);}catch(error){showToast(error.message,true);}
}

async function leaderboardRequest(method='GET', body=null){
  return requestJson('/.netlify/functions/leaderboard',{method,body,fallbackMessage:'No se pudo cargar el leaderboard.'});
}
async function submitLeaderboardScore(result){
  if(!result || result.mode!=='examen' || result.subjectId!=='espanol' || !accountSession.user) return;
  try{
    await leaderboardRequest('POST',{
      score:result.correctCount,total:result.total,pct:result.pct,
      topics:result.examTopics||Object.keys(result.byTopic||{}),fullExam:!!result.examFull
    });
  }catch(e){}
}
function topicNamesCompact(ids){
  const names=(ids||[]).map(id=>allTopics().find(t=>t.id===id)?.name).filter(Boolean);
  return names.length?names.join(', '):'Temas no disponibles';
}

async function loadLeaderboard(){
  const box=document.getElementById('leaderList'); if(!box)return;
  try{
    const data=await leaderboardRequest('GET');
    const rows=Array.isArray(data.players)?data.players:[];
    box.innerHTML=rows.length?rows.map((p,i)=>{
      const meta=`${p.bestFullExam?'Examen completo · ':''}${p.bestTotal} preguntas · ${topicNamesCompact(p.bestTopics)}`;
      return `<div class="hist-row"><span><b>${i+1}.</b> ${escHtml(p.name)}${p.isMe?' · Tú':''}<span class="leader-meta">${escHtml(meta)}</span></span><span class="leader-score"><b>${p.bestPct}%</b> · ${p.bestScore}/${p.bestTotal}<span class="leader-meta">${p.exams} ${p.exams===1?'examen':'exámenes'} completados</span></span></div>`;
    }).join(''):`<div class="empty-state"><span class="ic">🏆</span>Todavía no hay notas publicadas.</div>`;
  }catch(e){
    box.innerHTML=`<div class="empty-state"><span class="ic">☁</span>No se pudo cargar el leaderboard ahora mismo.</div>`;
  }
}

    <div class="btn-row"><button class="btn" id="saveSettings">💾 Guardar</button><span class="save-note" id="savedNote">${lastSaveAt?'Guardado automático activo ✓':'Guardado automático activo'}</span></div>`;
  const themeMode=document.getElementById('themeMode');
  const accentColor=document.getElementById('accentColor');
  themeMode.addEventListener('change',()=>{
    state.settings.themeMode=themeMode.value;
    applyThemeMode();
    saveState();
    renderNav();
  });
  accentColor.addEventListener('input',()=>{
    state.settings.accentColor=accentColor.value||'#8B2635';
    applyAccentColor();
  });
  accentColor.addEventListener('change',()=>{
    saveState();
    renderNav();
  });
  document.getElementById('resetWarnings').addEventListener('click',()=>{
    state.settings.hiddenWarnings={};
    saveState();
    showToast('Avisos restablecidos ✓');
  });
  const discardCurrentPractice=document.getElementById('discardCurrentPractice');
  if(discardCurrentPractice)discardCurrentPractice.addEventListener('click',()=>{if(!confirm('¿Descartar esta práctica? Se conservarán tu progreso anterior, historial, errores y guardadas.'))return;discardPausedPractice();goto('practica');});
  window.StudyHubExtras?.mountNotificationPreferences(document.getElementById('notificationPreferences'),platformUiContext());
  document.getElementById('saveSettings').addEventListener('click',()=>{
    const topics=[...document.querySelectorAll('#defaultTopics input:checked')].map(x=>x.value);
    if(!topics.length){ showToast('Selecciona al menos un tema para el examen.',true); return; }
    state.settings.themeMode=themeMode.value;
    state.settings.practiceCountsByDefault=document.getElementById('defaultCount').checked;
    state.settings.strictWrittenAnswers=document.getElementById('strictWritten').checked;
    if(subject.id==='espanol') state.settings.examTopics=topics;
    else state.settings.examTopicsBySubject={...(state.settings.examTopicsBySubject||{}),[subject.id]:topics};
    state.settings.accentColor=accentColor.value||'#8B2635';
    applyThemeMode(); saveState(); renderNav();
    document.getElementById('savedNote').textContent='Guardado ✓';
    setTimeout(()=>{const n=document.getElementById('savedNote');if(n)n.textContent='';},1600);
  });
}

// Guarda de forma periódica y también cuando iOS/Safari oculta o cierra la página.
setInterval(()=>{ saveState(); },5000);

if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

   INICIO
========================================================= */
if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const onScheme=()=>{ if(state.settings.themeMode==='auto'){ applyThemeMode(); renderNav(); } };
  if(mq.addEventListener) mq.addEventListener('change',onScheme); else if(mq.addListener) mq.addListener(onScheme);
}
render();

})();


/* =========================================================
   PRESENCIA: usuarios conectados
   Conteo aproximado de navegadores activos en los últimos 90 s.
========================================================= */
const ONLINE_CLIENT_KEY='studyhub_presence_client_v1';
let presenceTimer=null;
function presenceClientId(){
  try{
    let id=localStorage.getItem(ONLINE_CLIENT_KEY);
    if(!id){
      id=(crypto&&crypto.randomUUID)?crypto.randomUUID():`c_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      localStorage.setItem(ONLINE_CLIENT_KEY,id);
    }
    return id;
  }catch(e){ return `temp_${Math.random().toString(36).slice(2)}`; }
}
function updateOnlineBadge(count){
  const el=document.getElementById('onlineCount');
  if(!el)return;
  if(!Number.isFinite(count)){ el.textContent='Conectados: —'; return; }
  el.textContent=count===1?'1 conectado':`${count} conectados`;
}
async function heartbeatPresence(){
  if(document.visibilityState==='hidden') return;
  try{
    const activeQuestion=state.session?.queue?.[state.session.idx];
    const res=await fetch('/.netlify/functions/presence',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({clientId:presenceClientId(),section:state.view,subjectId:state.activeSubjectId||'',unitId:state.activeUnitId||'',topicId:activeQuestion?.topic||''}),cache:'no-store',credentials:'same-origin'
    });
    const data=await res.json().catch(()=>({}));
    if(res.ok && Number.isFinite(data.count)) updateOnlineBadge(data.count);
    else updateOnlineBadge(NaN);
  }catch(e){ updateOnlineBadge(NaN); }
}
function startPresence(){
  heartbeatPresence();
  clearInterval(presenceTimer);
  presenceTimer=setInterval(heartbeatPresence,30000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') heartbeatPresence(); });
}


startPresence();
</script>
