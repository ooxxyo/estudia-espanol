<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuaderno · Español</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEBE2;
  --bg-soft:#E5E0D3;
  --card:#FFFFFF;
  --ink:#22303A;
  --ink-soft:#5B6670;
  --line:#D9D2C0;
  --accent:#8B2635;
  --accent-soft:#F3DCDD;
  --amber:#B9772E;
  --amber-soft:#F3E3CC;
  --good:#3E7A58;
  --good-soft:#DCEBE1;
  --bad:#A63B3B;
  --bad-soft:#F4DCDC;
  --radius-card:14px;
  --radius-chip:999px;
  --shadow:0 1px 2px rgba(34,48,58,.06), 0 6px 20px rgba(34,48,58,.05);
}
[data-theme="dark"]{
  --bg:#1A1D21;
  --bg-soft:#212429;
  --card:#24272C;
  --ink:#EAE6DC;
  --ink-soft:#A3A99F;
  --line:#33373D;
  --accent:#E2828F;
  --accent-soft:#3A2429;
  --amber:#E0A667;
  --amber-soft:#3A2E1C;
  --good:#7FC49A;
  --good-soft:#1E2E26;
  --bad:#E08A8A;
  --bad-soft:#332022;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
button{font-family:inherit;}
.app{display:flex;min-height:100vh;}

/* ---- Nav rail ---- */
.rail{
  width:220px;flex-shrink:0;
  background:var(--bg-soft);
  border-right:1px solid var(--line);
  padding:22px 14px;
  display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
.rail-brand{
  font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;
  padding:0 10px 18px 10px;line-height:1.25;
  border-bottom:1px solid var(--line);margin-bottom:12px;
}
.rail-brand span{display:block;font-family:'Inter';font-weight:500;font-size:.72rem;color:var(--ink-soft);margin-top:3px;}
.rail-brand-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.version-badge{
  display:inline-flex;align-items:center;
  font-family:'Inter',system-ui,sans-serif;
  font-size:.62rem;font-weight:700;line-height:1;
  padding:4px 6px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);color:var(--ink-soft);
}
.subject-overview{margin-top:20px;}
.subject-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.subject-block{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);}
.subject-block h3{font-size:1rem;margin:0 0 8px;}
.subject-tags{display:flex;gap:7px;flex-wrap:wrap;}
.subject-tag{font-size:.76rem;font-weight:600;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--bg-soft);}
.subject-empty{font-size:.82rem;color:var(--ink-soft);margin:0;}
.system-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.online-badge{
  position:fixed;top:12px;right:14px;z-index:80;
  display:flex;align-items:center;gap:6px;
  padding:7px 10px;border:1px solid var(--line);border-radius:999px;
  background:color-mix(in srgb,var(--card) 94%,transparent);
  color:var(--ink-soft);font-size:.72rem;font-weight:700;
  box-shadow:var(--shadow);backdrop-filter:blur(8px);
}
.online-dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft);}
.experimental-card{border-color:var(--amber);background:linear-gradient(180deg,var(--card),var(--amber-soft));}
.experimental-warning{
  border:1px solid var(--amber);background:var(--amber-soft);border-radius:12px;
  padding:14px 16px;color:var(--ink);font-size:.88rem;line-height:1.5;
}
.experimental-warning b{display:block;margin-bottom:3px;}
.experimental-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.experimental-label{display:block;font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-bottom:7px;}
.experimental-select{
  width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);padding:9px 10px;font:inherit;
}
.experimental-chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;
  border:1px solid var(--amber);background:var(--amber-soft);font-size:.69rem;font-weight:800;
}
.resume-card{
  border:1px solid var(--accent);
  background:linear-gradient(180deg,var(--card),var(--accent-soft));
  margin-bottom:20px;
}
.resume-meta{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;
  color:var(--ink-soft);font-size:.78rem;
}
.resume-pill{
  display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);font-weight:700;
}
.save-exit-btn{border-color:var(--accent);color:var(--accent);}

@media(max-width:820px){.online-badge{top:8px;right:8px;font-size:.66rem;padding:6px 8px;}.experimental-controls{grid-template-columns:1fr;}}

@media (max-width:620px){.subject-columns{grid-template-columns:1fr;}}

.nav-btn{
  display:flex;align-items:center;gap:10px;
  background:none;border:none;text-align:left;
  padding:10px 12px;border-radius:10px;cursor:pointer;
  color:var(--ink-soft);font-size:.92rem;font-weight:500;
  transition:background .15s ease, color .15s ease;
}
.nav-btn:hover{background:var(--card);}
.nav-btn.active{background:var(--accent);color:#fff;}
.nav-btn .ic{width:18px;text-align:center;font-size:1rem;}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);}
.theme-toggle{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;cursor:pointer;color:var(--ink);font-size:.85rem;
}

/* ---- mobile bottom nav ---- */
.mobile-nav{display:none;}
@media (max-width:820px){
  .rail{display:none;}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:var(--bg-soft);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50;overflow-x:auto;gap:2px;
  }
  .mobile-nav .nav-btn{flex-direction:column;gap:3px;font-size:.62rem;padding:7px 8px;min-width:58px;text-align:center;}
  main{padding-bottom:78px !important;}
}

main{flex:1;padding:34px 40px;max-width:980px;margin:0 auto;width:100%;}
@media (max-width:820px){ main{padding:20px 16px;} }

.pagehead{margin-bottom:26px;}
.pagehead h1{font-size:1.7rem;font-weight:600;margin:0 0 4px 0;}
.pagehead p{color:var(--ink-soft);margin:0;font-size:.95rem;}

/* ---- cards / grids ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:20px;box-shadow:var(--shadow);}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:720px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;} }
@media (max-width:480px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} }

/* ---- dashboard ring ---- */
.dash-top{display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
.ring-wrap{position:relative;width:150px;height:150px;flex-shrink:0;}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-num b{font-family:'Fraunces';font-size:2rem;font-weight:600;}
.ring-num span{font-size:.7rem;color:var(--ink-soft);}
.stat-box{padding:14px 16px;}
.stat-box b{display:block;font-family:'Fraunces';font-size:1.5rem;font-weight:600;}
.stat-box span{color:var(--ink-soft);font-size:.8rem;}

.topic-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.topic-row:last-child{border-bottom:none;}
.topic-row .tname{width:150px;flex-shrink:0;font-weight:600;font-size:.9rem;}
.bar-track{flex:1;height:8px;background:var(--bg-soft);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;background:var(--accent);transition:width .4s ease;}
.pill{font-size:.68rem;padding:3px 9px;border-radius:var(--radius-chip);font-weight:600;white-space:nowrap;}
.pill-none{background:var(--bg-soft);color:var(--ink-soft);}
.pill-progress{background:var(--amber-soft);color:var(--amber);}
.pill-almost{background:#DCE6F3;color:#3A5D8A;}
.pill-mastered{background:var(--good-soft);color:var(--good);}

.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:11px 18px;font-size:.92rem;font-weight:600;cursor:pointer;
  transition:transform .1s ease, opacity .15s ease;
}
.btn:hover{opacity:.92;}
.btn:active{transform:scale(.98);}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.soft{background:var(--accent-soft);color:var(--accent);}
.btn.amber{background:var(--amber);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--radius-chip);border:1px solid var(--line);background:var(--card);font-size:.82rem;font-weight:500;cursor:pointer;color:var(--ink);}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
[data-theme="dark"] .chip.active{background:var(--accent);border-color:var(--accent);}

.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 10px 2px;font-weight:600;}
/* deliberately used sparingly, only as small section labels above lists — not as a decorative eyebrow on every block */

.mode-card{cursor:pointer;transition:border-color .15s ease, transform .1s ease;}
.mode-card:hover{border-color:var(--accent);}
.mode-card h3{margin:0 0 6px 0;font-size:1rem;}
.mode-card p{margin:0;color:var(--ink-soft);font-size:.83rem;line-height:1.4;}
.mode-card .ic{font-size:1.4rem;margin-bottom:8px;display:block;}

/* ---- question view ---- */
.q-wrap{max-width:700px;margin:0 auto;}
.q-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:.82rem;color:var(--ink-soft);}
.q-progress{height:6px;background:var(--bg-soft);border-radius:999px;overflow:hidden;margin-bottom:22px;}
.q-progress-fill{height:100%;background:var(--accent);transition:width .3s ease;}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow);}
.q-topic-tag{display:inline-block;background:var(--bg-soft);color:var(--ink-soft);font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:12px;}
.q-prompt{font-size:1.15rem;line-height:1.5;margin:0 0 20px 0;font-weight:500;}
.q-reading{background:var(--bg-soft);border-radius:10px;padding:16px 18px;margin-bottom:18px;font-size:.95rem;line-height:1.65;}
.q-reading .sent{cursor:pointer;padding:1px 2px;border-radius:4px;}
.q-reading .sent:hover{background:var(--accent-soft);}
.q-reading .sent.picked{background:var(--accent);color:#fff;}
.q-reading .sent.correct{background:var(--good-soft);color:var(--good);}
.q-reading .sent.incorrect{background:var(--bad-soft);color:var(--bad);}

.opt-list{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px solid var(--line);
  border-radius:11px;cursor:pointer;background:var(--card);font-size:.95rem;transition:border-color .12s ease, background .12s ease;
}
.opt:hover{border-color:var(--accent);}
.opt.selected{border-color:var(--accent);background:var(--accent-soft);}
.opt.correct{border-color:var(--good);background:var(--good-soft);}
.opt.incorrect{border-color:var(--bad);background:var(--bad-soft);}
.opt-letter{width:26px;height:26px;border-radius:50%;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;flex-shrink:0;}

.tf-row{display:flex;gap:12px;}
.tf-row .opt{flex:1;justify-content:center;}

.seg-word{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;justify-content:center;}
.seg-chunk{display:flex;flex-direction:column;align-items:center;gap:6px;}
.seg-chunk .txt{font-family:'Fraunces';font-size:1.4rem;font-weight:600;padding:6px 10px;background:var(--bg-soft);border-radius:8px;}
.seg-chunk select{padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:.78rem;font-weight:600;}
.seg-chunk select.correct{border-color:var(--good);background:var(--good-soft);}
.seg-chunk select.incorrect{border-color:var(--bad);background:var(--bad-soft);}
.seg-key{font-size:.78rem;color:var(--ink-soft);text-align:center;margin-bottom:10px;}

.fill-input{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:11px;font-size:1rem;background:var(--card);color:var(--ink);}
.fill-input:focus{outline:none;border-color:var(--accent);}
.fill-input.correct{border-color:var(--good);background:var(--good-soft);}
.fill-input.incorrect{border-color:var(--bad);background:var(--bad-soft);}

.feedback{margin-top:18px;padding:15px 17px;border-radius:11px;font-size:.9rem;line-height:1.5;}
.feedback.good{background:var(--good-soft);color:var(--good);}
.feedback.bad{background:var(--bad-soft);color:var(--bad);}
.feedback b{display:block;margin-bottom:4px;font-size:.95rem;}
.feedback .exp{color:var(--ink);margin-top:6px;}
.feedback .detail-block{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb, var(--line) 80%, transparent);}
.feedback .detail-title{font-weight:800;color:var(--ink);margin-bottom:4px;}
.feedback .detail-answer{font-weight:800;}
.feedback .detail-tip{margin-top:8px;color:var(--ink-soft);}
.feedback .detail-tip b{display:inline;color:inherit;font-size:inherit;margin:0;}
.feedback .learning-ref{
  margin-top:12px;
  display:grid;
  gap:9px;
}
.feedback .learning-box{
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--bg-soft);
  line-height:1.55;
}
.feedback .learning-box .learning-label{
  display:block;
  font-size:.7rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.045em;
  color:var(--ink-soft);
  margin-bottom:3px;
}
.feedback .learning-box.example-box{
  border-left:3px solid var(--accent);
}
.feedback .why-box{
  margin-top:10px;
  line-height:1.6;
}


.hint-box{margin-top:14px;background:var(--amber-soft);border-radius:10px;padding:12px 15px;font-size:.87rem;color:var(--ink);}
.hint-box b{color:var(--amber);}

.q-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap;gap:10px;}
.icon-btn{background:none;border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--ink-soft);font-size:.85rem;display:flex;align-items:center;gap:6px;}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-soft);}
.icon-btn.starred{color:var(--amber);border-color:var(--amber);}

.mini-review{background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;padding:18px;margin-bottom:18px;}
.mini-review h4{margin:0 0 8px 0;color:var(--amber);}

.results-hero{text-align:center;padding:30px 20px;}
.results-hero .big{font-family:'Fraunces';font-size:3rem;font-weight:600;}
.err-item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.err-item .q{font-weight:600;margin-bottom:4px;}
.err-item .meta{font-size:.78rem;color:var(--ink-soft);}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .ic{font-size:2.2rem;margin-bottom:10px;display:block;}

.kbd-hint{font-size:.75rem;color:var(--ink-soft);text-align:center;margin-top:10px;}
kbd{background:var(--bg-soft);border-radius:5px;padding:1px 6px;font-family:inherit;border:1px solid var(--line);}

.hist-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:.88rem;}
.hist-row:last-child{border-bottom:none;}
.spark{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:6px;}
.spark div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;}

.trick{background:var(--amber-soft);border-left:3px solid var(--amber);padding:9px 13px;border-radius:0 8px 8px 0;font-size:.85rem;margin-top:14px;}

@media (max-width:520px){
  .q-card{padding:18px;}
  .grid-2{grid-template-columns:1fr;}
}

/* ===== MEJORA VISUAL SEGURA ===== */
:root{
  --bg:#F3F0E8;
  --bg-soft:#E9E4D9;
  --card:#FCFBF7;
  --ink:#28343B;
  --ink-soft:#616B72;
  --line:#D6D0C5;
  --accent:#74414A;
  --accent-soft:#EEE1E3;
  --amber:#8C6B43;
  --amber-soft:#F1E8DB;
  --good:#5D7966;
  --good-soft:#E2ECE5;
  --bad:#925D5D;
  --bad-soft:#F0E3E2;
  --radius-card:15px;
  --shadow:0 1px 2px rgba(40,52,59,.04),0 8px 22px rgba(40,52,59,.05);
}
[data-theme="dark"]{
  --bg:#1C2023;
  --bg-soft:#22272B;
  --card:#282D31;
  --ink:#ECE8DF;
  --ink-soft:#B2B7B3;
  --line:#3A4044;
  --accent:#C1848D;
  --accent-soft:#3A2E31;
  --amber:#C09A68;
  --amber-soft:#382F25;
  --good:#87A48F;
  --good-soft:#28342C;
  --bad:#C78686;
  --bad-soft:#382A2A;
  --shadow:0 1px 2px rgba(0,0,0,.20),0 8px 22px rgba(0,0,0,.18);
}
body{line-height:1.55;}
.nav-btn.active{background:var(--accent);color:#FFF9F7;}
.btn{background:var(--accent);color:#FFF9F7;}
.btn:hover{opacity:.96;}
.card,.q-card{box-shadow:var(--shadow);}
.q-card{border-radius:15px;}
.feedback.good,.feedback.bad{color:var(--ink);}
.feedback.good b{color:var(--good);}
.feedback.bad b{color:var(--bad);}
.hint-box{
  border:1px solid var(--line);
  border-left:3px solid var(--amber);
  background:var(--amber-soft);
  color:var(--ink);
  line-height:1.58;
}
.hint-box b{color:var(--ink);}

/* Repaso visual */
.review-card{text-align:left !important;}
.review-definition{
  font-size:1.05rem;
  line-height:1.68;
  margin:0 auto;
  max-width:62ch;
}
.study-example{
  margin-top:20px;
  padding:16px 18px;
  background:var(--bg-soft);
  border:1px solid var(--line);
  border-radius:12px;
}
.study-example-label{
  display:block;
  font-size:.72rem;
  color:var(--ink-soft);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:10px;
}
.study-quote{
  font-family:'Fraunces',Georgia,serif;
  font-size:1.18rem;
  line-height:1.85;
}
.study-highlight{
  font-weight:700;
  padding:0 2px 1px;
  border-radius:3px;
  background:var(--accent-soft);
  border-bottom:2px solid var(--accent);
}
.study-note{
  border-top:1px solid var(--line);
  margin-top:14px;
  padding-top:12px;
  font-size:.9rem;
  line-height:1.55;
}
.study-note b{color:var(--accent);}

.morph-example{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin:14px 0 4px;
}
.morph-piece{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.morph-word{
  font-family:'Fraunces',Georgia,serif;
  font-size:1.3rem;
  font-weight:650;
  padding:9px 11px;
  border:1px solid var(--line);
  border-bottom:3px solid var(--accent);
  background:var(--card);
  border-radius:9px;
}
.morph-label{
  color:var(--ink-soft);
  font-size:.7rem;
  font-weight:700;
}
.morph-piece.infix .morph-word{
  background:var(--amber-soft);

<script>
/* =========================================================
   DATOS: temas
========================================================= */
const TOPICS = [
  {id:'gramatica', name:'Gramática', icon:'✎'},
  {id:'morfologia', name:'Morfología', icon:'🧩'},
  {id:'narrativa', name:'Narrador', icon:'📖'},
  {id:'cronica', name:'Crónica', icon:'📰'},
  {id:'figuras', name:'Figuras literarias', icon:'✦'},
];

// Metadatos del área actual. Esta estructura queda preparada para
// convertir el proyecto en un hub universal con más materias más adelante.
const SUBJECT = {
  id:'espanol',
  name:'Español',
  currentTopics:TOPICS.map(t=>t.id),
  pastExams:[] // Se añaden aquí solo cuando el usuario provea exámenes anteriores reales.
};

/* =========================================================
   DATOS: preguntas
   tipo: 'mc' | 'tf' | 'seg' | 'fill' | 'eviden'
========================================================= */
let _id = 0;
const nid = () => 'q' + (++_id);

const Q = [];

/* ---------- SECCIÓN 1: GRAMÁTICA ---------- */
Q.push(
{id:nid(), topic:'gramatica', type:'mc', dif:'facil',
 prompt:'¿Cuál disciplina estudia la estructura de una lengua en general: la forma de las palabras, cómo se organizan y cómo se relacionan?',
 options:['Morfología','Sintaxis','Gramática','Crónica'], correct:2,
 hints:['Es el término más amplio de los tres.','Incluye tanto la morfología como la sintaxis.','La palabra que buscas nombra a toda la disciplina, no a una de sus partes.'],
 exp:'La gramática es la disciplina general que estudia la estructura de la lengua; morfología y sintaxis son sus dos partes.'},
{id:nid(), topic:'gramatica', type:'mc', dif:'facil',
 prompt:'"Estudia la estructura interna de las palabras, su formación y sus variaciones." Esta definición corresponde a:',
 options:['Sintaxis','Morfología','Gramática','Narrador'], correct:1,
 hints:['Piensa en la palabra "interna": se enfoca dentro de la palabra.','No es sobre cómo se combinan varias palabras.','Es la parte de la gramática que estudia lexemas y morfemas.'],
 exp:'La morfología mira hacia adentro de la palabra: su formación y variaciones.'},
{id:nid(), topic:'gramatica', type:'mc', dif:'facil',
 prompt:'"Estudia cómo las palabras se combinan y organizan para formar frases y oraciones." Esta definición corresponde a:',
 options:['Morfología','Sintaxis','Crónica','Narrador testigo'], correct:1,
 hints:['Aquí el enfoque está en varias palabras juntas, no en una sola.','Piensa en el orden de las palabras dentro de una oración.','Es la otra mitad de la gramática, junto con la morfología.'],
 exp:'La sintaxis estudia la combinación de palabras para formar frases y oraciones.'},
{id:nid(), topic:'gramatica', type:'tf', dif:'facil',
 prompt:'La morfología y la sintaxis son ambas partes de la gramática.',
 correct:true,
 hints:['La gramática es el término general.','Ambas estudian distintos aspectos de la lengua, pero pertenecen a la misma disciplina.'],
 exp:'Correcto: la gramática incluye la relación entre morfología y sintaxis.'},
{id:nid(), topic:'gramatica', type:'mc', dif:'medio',
 prompt:'Si un ejercicio te pide dividir la palabra "calentadores" en sus partes internas (lexema, sufijo, morfema flexivo), ¿qué disciplina estás practicando?',
 options:['Sintaxis','Morfología','Crónica','Narrador'], correct:1,
 hints:['Estás trabajando con una sola palabra, no con una oración completa.','El análisis interno de una palabra es morfológico.'],
 exp:'Dividir una palabra en lexema y morfemas es un ejercicio de morfología.'},
{id:nid(), topic:'gramatica', type:'mc', dif:'medio',
 prompt:'Si un ejercicio te pide identificar el sujeto y el predicado de una oración, ¿qué disciplina estás practicando?',
 options:['Morfología','Sintaxis','Gramática (en general, sin especificar)','Ninguna de las anteriores'], correct:1,
 hints:['Sujeto y predicado son partes de la oración, no de una sola palabra.','Esto trata sobre cómo se organizan varias palabras juntas.'],
 exp:'Identificar sujeto y predicado es un análisis sintáctico: organización de palabras en la oración.'},
{id:nid(), topic:'gramatica', type:'tf', dif:'medio',
 prompt:'La sintaxis se enfoca en la formación interna de una sola palabra.',
 correct:false,
 hints:['Eso describe mejor a otra disciplina.','La sintaxis trabaja con combinaciones de palabras, no con una palabra aislada.'],
 exp:'Falso: eso describe a la morfología. La sintaxis trabaja con la combinación de palabras.'},
{id:nid(), topic:'gramatica', type:'mc', dif:'dificil',
 prompt:'¿Cuál de las siguientes afirmaciones describe mejor la relación entre gramática, morfología y sintaxis?',
 options:[
   'Son tres disciplinas completamente independientes sin relación entre sí.',
   'La gramática es la disciplina general; la morfología estudia la palabra y la sintaxis estudia la oración.',
   'La sintaxis es una parte de la morfología.',
   'La morfología estudia oraciones completas y la sintaxis estudia palabras sueltas.'],
 correct:1,
 hints:['Piensa en cuál es el término "paraguas" que engloba a los otros dos.','Una mira hacia adentro de la palabra; la otra mira hacia afuera, hacia la oración.'],
 exp:'La gramática engloba ambas: la morfología analiza la palabra por dentro y la sintaxis analiza cómo se combinan las palabras.'}
);

/* ---------- SECCIÓN 2/3: MORFOLOGÍA - conceptos ---------- */
Q.push(
{id:nid(), topic:'morfologia', type:'mc', dif:'facil',
 prompt:'¿Cómo se llama la parte fundamental de una palabra, la que contiene el significado principal?',
 options:['Morfema flexivo','Lexema o raíz','Infijo','Sufijo'], correct:1,
 hints:['A partir de esta parte se forman palabras relacionadas como pan, panadero, panadería.','Es la base sobre la que se añaden los demás elementos.'],
 exp:'El lexema (o raíz) es la parte fundamental de la palabra y contiene el significado principal.'},
{id:nid(), topic:'morfologia', type:'mc', dif:'facil',
 prompt:'¿Cuál es el lexema compartido por "pan", "panadero", "panadería" y "panecillo"?',
 options:['pan','ero','ería','ecillo'], correct:0,
 hints:['Busca la parte que se repite igual en las cuatro palabras.'],
 exp:'"pan-" es el lexema; el resto son morfemas añadidos.'},
{id:nid(), topic:'morfologia', type:'mc', dif:'facil',
 prompt:'Un morfema que expresa información gramatical como género, número, persona, tiempo o modo, sin crear una palabra nueva, se llama:',
 options:['Morfema derivativo','Morfema flexivo','Infijo','Lexema'], correct:1,
 hints:['Piensa en el ejemplo "niñas": la -a y la -s no crean una palabra distinta, solo dan información.'],
 exp:'El morfema flexivo aporta género, número, persona, tiempo o modo, sin crear una palabra completamente nueva.'},
{id:nid(), topic:'morfologia', type:'mc', dif:'facil',
 prompt:'En la palabra "niñas", ¿qué representa la "-s" final?',
 options:['Morfema flexivo de género','Morfema flexivo de número plural','Morfema derivativo prefijo','Infijo'], correct:1,
 hints:['La -a ya marca el género femenino.','La -s marca cuántos son.'],
 exp:'La "-s" es el morfema flexivo de número plural; la "-a" es el morfema flexivo de género femenino.'},
{id:nid(), topic:'morfologia', type:'mc', dif:'medio',
 prompt:'Un morfema que sirve para formar una palabra nueva o modificar el significado del lexema (y puede ser prefijo o sufijo) se llama:',
 options:['Morfema flexivo','Morfema derivativo','Infijo','Lexema'], correct:1,
 hints:['A diferencia del flexivo, este sí puede crear una palabra distinta o cambiar su significado.'],
 exp:'El morfema derivativo forma palabras nuevas o modifica el significado del lexema; incluye prefijos y sufijos.'},
{id:nid(), topic:'morfologia', type:'mc', dif:'medio',
 prompt:'¿Dónde aparece un prefijo respecto al lexema?',
 options:['Después','Antes','En medio, entre el lexema y el sufijo','No tiene posición fija'], correct:1,
 hints:['MDP = Morfema Derivativo Prefijo. "Pre-" significa "antes".'],
 exp:'El prefijo aparece antes del lexema (por ejemplo, "i-" en "ilegal").'},
{id:nid(), topic:'morfologia', type:'mc', dif:'medio',
 prompt:'¿Dónde aparece un infijo?',
 options:['Antes del lexema','Después del sufijo','Entre el lexema y el sufijo','Al final absoluto de la palabra'], correct:2,
 hints:['Funciona como una partícula de enlace.','Ejemplo clave: "panecillo" → pan + ec + illo.'],
 exp:'El infijo aparece entre el lexema y el sufijo, funcionando como enlace (ej. la "-ec-" en "panecillo").'},
{id:nid(), topic:'morfologia', type:'tf', dif:'medio',
 prompt:'El infijo normalmente tiene un significado propio muy importante.',
 correct:false,
 hints:['El documento dice que "normalmente no tiene significado propio importante".'],
 exp:'Falso: el infijo funciona como partícula de enlace y normalmente no aporta un significado propio importante.'},
{id:nid(), topic:'morfologia', type:'mc', dif:'medio',
 prompt:'Una palabra derivada se forma:',
 options:['Combinando dos lexemas completos','Añadiendo uno o más morfemas derivativos a un lexema','Quitando morfemas de un lexema','Repitiendo el mismo lexema dos veces'], correct:1,
 hints:['Ejemplo: casa → casita.'],
 exp:'Una palabra derivada se forma añadiendo uno o más morfemas derivativos a un lexema (casa → casita).'},
{id:nid(), topic:'morfologia', type:'mc', dif:'dificil',
 prompt:'La parasíntesis es un procedimiento de formación de palabras que se practica especialmente con esta estructura:',
 options:['lexema + lexema','sufijo + lexema + prefijo','prefijo + lexema + sufijo','infijo + lexema'], correct:2,
 hints:['Intervienen simultáneamente distintos elementos, con el prefijo y el sufijo "abrazando" al lexema.'],
 exp:'La estructura típica de la parasíntesis es prefijo + lexema + sufijo, con ambos elementos actuando a la vez.'},
{id:nid(), topic:'morfologia', type:'mc', dif:'dificil',
 prompt:'¿Cuál es la diferencia clave entre morfema derivativo y morfema flexivo?',
 options:[
   'El derivativo cambia el significado o forma una palabra nueva; el flexivo solo aporta información gramatical.',
   'El flexivo siempre va antes del lexema; el derivativo siempre va después.',
   'No hay ninguna diferencia real, son sinónimos.',
   'El derivativo solo existe en verbos.'],
 correct:0,
 hints:['Piensa en "niñas": -a y -s no crean una palabra nueva. Piensa en "casita": -ita sí forma una palabra derivada.'],
 exp:'El morfema derivativo forma palabras nuevas o cambia el significado; el flexivo únicamente marca género, número, persona, tiempo o modo.'}
);

/* ---------- SECCIÓN 3: ANÁLISIS MORFOLÓGICO (segmentación) ---------- */
// roles: MDP, LEX, INF, MDS, MF
function segQ(word, parts, dif, note){
  return {id:nid(), topic:'morfologia', type:'seg', dif,
    prompt:`Divide la palabra "${word}" y asigna la función correcta a cada parte.`,
    word, parts,
    hints:[
      'Busca primero el lexema: la parte con el significado principal.',
      'Revisa si hay algo antes del lexema (prefijo) o después (sufijo/flexivo).',
      note || 'Recuerda: MDP = prefijo, LEX = lexema, INF = infijo, MDS = sufijo, MF = morfema flexivo.'
    ],
    exp: explainSeg(word, parts)
  };
}
function explainSeg(word, parts){
  return parts.map(p=>`${p.text.toUpperCase()} (${roleName(p.role)})`).join(' + ');
}
function roleName(r){
  return {MDP:'prefijo', LEX:'lexema', INF:'infijo', MDS:'sufijo', MF:'morfema flexivo'}[r];
}

Q.push(
 segQ('panecillo', [{text:'pan',role:'LEX'},{text:'ec',role:'INF'},{text:'illo',role:'MDS'}], 'medio',
   'Este es el ejemplo fundamental de infijo: pan + ec + illo.'),
 segQ('calentadores', [{text:'calent',role:'LEX'},{text:'ador',role:'MDS'},{text:'es',role:'MF'}], 'medio'),
 segQ('destornillador', [{text:'des',role:'MDP'},{text:'tornill',role:'LEX'},{text:'ador',role:'MDS'}], 'medio'),
 segQ('casita', [{text:'cas',role:'LEX'},{text:'ita',role:'MDS'}], 'facil'),
 segQ('rojizo', [{text:'roj',role:'LEX'},{text:'izo',role:'MDS'}], 'facil'),
 segQ('bombardeo', [{text:'bombard',role:'LEX'},{text:'eo',role:'MDS'}], 'facil'),
 segQ('ilegal', [{text:'i',role:'MDP'},{text:'legal',role:'LEX'}], 'facil'),
 segQ('subterráneos', [{text:'sub',role:'MDP'},{text:'terráne',role:'LEX'},{text:'os',role:'MF'}], 'medio'),
 segQ('antiaéreos', [{text:'anti',role:'MDP'},{text:'aére',role:'LEX'},{text:'os',role:'MF'}], 'medio'),
 segQ('inhospitales', [{text:'in',role:'MDP'},{text:'hospital',role:'LEX'},{text:'es',role:'MF'}], 'dificil'),
 segQ('ilegalidad', [{text:'i',role:'MDP'},{text:'legal',role:'LEX'},{text:'idad',role:'MDS'}], 'dificil'),
 segQ('comparación', [{text:'compar',role:'LEX'},{text:'ación',role:'MDS'}], 'medio'),
 segQ('avispero', [{text:'avisp',role:'LEX'},{text:'ero',role:'MDS'}], 'facil'),
 segQ('descomponer', [{text:'des',role:'MDP'},{text:'componer',role:'LEX'}], 'medio'),
 segQ('pronombres', [{text:'pro',role:'MDP'},{text:'nombre',role:'LEX'},{text:'s',role:'MF'}], 'dificil'),
 // extra "same level" words to check real understanding
 segQ('panadería', [{text:'pan',role:'LEX'},{text:'ader',role:'MDS'},{text:'ía',role:'MDS'}], 'dificil',
   'En este nivel puedes agrupar "-adería" como un sufijo compuesto que forma el lugar donde se hace algo.'),
 segQ('florecillas', [{text:'flor',role:'LEX'},{text:'ec',role:'INF'},{text:'ill',role:'MDS'},{text:'as',role:'MF'}], 'dificil',
   'Igual que en "panecillo": lexema + infijo -ec- + sufijo + flexivo de plural.'),
 segQ('desilusionado', [{text:'des',role:'MDP'},{text:'ilusion',role:'LEX'},{text:'ado',role:'MDS'}], 'dificil')
);

// Palabra compuesta especial (cabizbajo) — no es un simple prefijo+lexema+sufijo
Q.push({id:nid(), topic:'morfologia', type:'mc', dif:'dificil',
 prompt:'"Cabizbajo" se forma a partir de "cabeza" + "bajo". ¿Cómo se describe mejor este tipo de formación?',
 options:['Es solo un morfema flexivo','Es una palabra compuesta a partir de dos lexemas, no un simple prefijo o sufijo','Es un infijo','No tiene ninguna formación morfológica'], correct:1,
 hints:['Observa que "cabeza" y "bajo" son dos palabras completas con significado propio, no un prefijo ni un sufijo.'],
 exp:'"Cabizbajo" une dos lexemas (cabeza + bajo) en una palabra compuesta, un proceso distinto a simplemente añadir un prefijo o sufijo.'});

Q.push(
{id:nid(), topic:'morfologia', type:'mc', dif:'medio',
 prompt:'¿Qué representan las siglas MDP, LEX, INF, MDS y MF en el análisis morfológico?',
 options:[
  'Morfema Derivativo Prefijo, Lexema, Infijo, Morfema Derivativo Sufijo, Morfema Flexivo',
  'Modo, Léxico, Interjección, Modo de Sufijo, Modo Final',
  'Morfema Doble, Léxico, Intención, Morfema del Sujeto, Modo Flexivo',
  'Ninguna de las anteriores'], correct:0,
 hints:['Cada sigla corresponde a un tipo de parte de la palabra que hemos estudiado.'],
 exp:'MDP=Morfema Derivativo Prefijo, LEX=Lexema, INF=Infijo, MDS=Morfema Derivativo Sufijo, MF=Morfema Flexivo.'},
{id:nid(), topic:'morfologia', type:'mc', dif:'dificil',
 prompt:'Un compañero analizó "calentadores" así: "calentador (LEX) + es (MDS)". ¿Qué corrigirías?',
 options:[
   'Está completamente correcto',
   '"calentador" no es un lexema completo; debería ser calent (LEX) + ador (MDS) + es (MF), y "-es" es un morfema flexivo, no derivativo',
   'Falta un infijo',
   '"-es" debería ser un prefijo'], correct:1,
 hints:['El lexema debe ser la raíz mínima con el significado base: "calent-".','La "-es" final solo marca plural: eso es información gramatical, no una palabra nueva.'],
 exp:'El análisis correcto es calent (LEX) + ador (MDS) + es (MF): "-es" marca plural, así que es un morfema flexivo, no derivativo.'}
);

/* ---------- SECCIÓN 9: FIGURAS LITERARIAS ---------- */
function figQ(name, sentence, options, correctIdx, hints, exp, dif){
  return {id:nid(), topic:'figuras', type:'mc', dif: dif||'facil',
   prompt:`¿Qué figura literaria aparece en: "${sentence}"?`,
   options, correct: correctIdx, hints, exp};
}
const FIG_ALL = ['Símil','Metáfora','Personificación','Hipérbole','Antítesis','Anáfora','Retruécano','Aliteración','Asíndeton','Polisíndeton','Onomatopeya','Hipérbaton','Redundancia','Encabalgamiento','Oxímoron','Paradoja','Alegoría'];
function pickOpts(correctName, n){
  const others = FIG_ALL.filter(f=>f!==correctName);
  const shuffled = others.sort(()=>Math.random()-0.5).slice(0,n-1);
  const opts = [correctName, ...shuffled];
  return opts.sort(()=>Math.random()-0.5);
}
function mkFig(name, sentence, hints, exp, dif){
  const opts = pickOpts(name,4);
  return figQ(name, sentence, opts, opts.indexOf(name), hints, exp, dif);
}

   ESTADO Y PERSISTENCIA
========================================================= */
const APP_VERSION = '2.0';
// Clave estable: NO cambiar entre actualizaciones. Así el progreso sobrevive a nuevas versiones.
const STABLE_STORAGE_KEY = 'cuaderno_espanol_hub_progress_v1';
const STORAGE_KEY = 'cuaderno_espanol_v12'; // compatibilidad con versiones anteriores
const STORAGE_BACKUP_KEY = 'cuaderno_espanol_v12_backup';
const IDB_NAME = 'cuaderno_espanol_db';
const IDB_STORE = 'progress';
let hasLocalSavedState = false;
let lastSaveAt = 0;
let accountSession = {status:'checking', user:null};
let suppressCloudSync = false;
let cloudSyncTimer = null;
let cloudSyncInFlight = false;
let lastCloudHash = '';
let lastCloudUpdatedAt = 0;

const state = {
  theme:'light',
  view:'dashboard',
  stats:{}, // topicId -> {attempts, correct, recent:[bool], mastered:false}
  totalAnswered:0, totalCorrect:0, currentStreak:0, bestStreak:0,
  studySeconds:0,
  errors:[], // {qid, userAnswerText, times, last}
  saved:new Set(),
  history:[],
  session:null,
  settings:{
    themeMode:'light',
    practiceCountsByDefault:true,
    examTopics:TOPICS.map(t=>t.id),
    lastSeenUpdate:'',
    accentColor:'#8B2635',
    leaderboardName:'',
    leaderboardDeviceId:''
  }
};
TOPICS.forEach(t=> state.stats[t.id] = {attempts:0, correct:0, recent:[]});

// Los IDs q1, q2… son identificadores heredados y su orden no debe cambiarse.
// Las futuras migraciones pueden añadir alias explícitos sin invalidar datos antiguos.
const QUESTION_ID_ALIASES=Object.freeze({});
function findQuestionById(id){
  const resolved=QUESTION_ID_ALIASES[id]||id;
  return Q.find(question=>question.id===resolved);
}

function snapshotState(){
  return {
    version:APP_VERSION,
    savedAt:Date.now(),
    theme:state.theme,
    view:state.view,
    stats:state.stats,
    totalAnswered:state.totalAnswered,totalCorrect:state.totalCorrect,
    currentStreak:state.currentStreak,bestStreak:state.bestStreak,
    studySeconds:state.studySeconds,errors:state.errors,
    saved:[...state.saved],history:state.history,lastResult:state.lastResult||null,
    settings:state.settings,
    session:state.session && !state.session.experimental?{...state.session,queueIds:state.session.queue.map(q=>q.id),queue:undefined}:null
  };
}
function applySavedData(d){
  if(!d || typeof d!=='object') return false;
  if(d.stats && typeof d.stats==='object') TOPICS.forEach(t=>{
    const incoming=d.stats[t.id];
    if(!incoming || typeof incoming!=='object') return;
    state.stats[t.id]={
      attempts:Number.isFinite(incoming.attempts)?Math.max(0,incoming.attempts):state.stats[t.id].attempts,
      correct:Number.isFinite(incoming.correct)?Math.max(0,incoming.correct):state.stats[t.id].correct,
      recent:Array.isArray(incoming.recent)?incoming.recent.slice(-20).map(Boolean):state.stats[t.id].recent
    };
  });
  ['totalAnswered','totalCorrect','currentStreak','bestStreak','studySeconds'].forEach(k=>{ if(Number.isFinite(d[k])) state[k]=d[k]; });
  if(Array.isArray(d.errors)) state.errors=d.errors.filter(e=>e&&typeof e.qid==='string').slice(-1000);
  if(Array.isArray(d.saved)) state.saved=new Set(d.saved.filter(id=>typeof id==='string').slice(-1000));
  if(Array.isArray(d.history)) state.history=d.history.filter(entry=>entry&&typeof entry==='object').slice(-500);
  if(d.lastResult && typeof d.lastResult==='object'){
    const result=d.lastResult;
    const byTopic={};
    if(result.byTopic && typeof result.byTopic==='object') TOPICS.forEach(topic=>{
      const row=result.byTopic[topic.id];
      if(row && typeof row==='object') byTopic[topic.id]={c:Math.max(0,Number(row.c)||0),t:Math.max(0,Number(row.t)||0)};
    });
    state.lastResult={
      ...result,
      total:Math.max(0,Number(result.total)||0),
      correctCount:Math.max(0,Number(result.correctCount)||0),
      pct:Math.max(0,Math.min(100,Number(result.pct)||0)),
      elapsed:Math.max(0,Number(result.elapsed)||0),
      byTopic,
      answers:Array.isArray(result.answers)?result.answers.filter(a=>a&&typeof a.qid==='string').slice(0,500):[],
      mode:result.mode==='examen'?'examen':'practica',
      experimental:result.experimental===true
    };
  }
  if(d.settings && typeof d.settings==='object'){
    const incoming=d.settings;
    if(['light','dark','auto'].includes(incoming.themeMode)) state.settings.themeMode=incoming.themeMode;
    if(typeof incoming.practiceCountsByDefault==='boolean') state.settings.practiceCountsByDefault=incoming.practiceCountsByDefault;
    if(Array.isArray(incoming.examTopics)) state.settings.examTopics=incoming.examTopics.filter(id=>TOPICS.some(t=>t.id===id));
    if(typeof incoming.lastSeenUpdate==='string') state.settings.lastSeenUpdate=incoming.lastSeenUpdate.slice(0,20);
    if(typeof incoming.accentColor==='string' && /^#[0-9A-Fa-f]{6}$/.test(incoming.accentColor)) state.settings.accentColor=incoming.accentColor;
    if(typeof incoming.leaderboardName==='string') state.settings.leaderboardName=incoming.leaderboardName.slice(0,40);
    if(typeof incoming.leaderboardDeviceId==='string') state.settings.leaderboardDeviceId=incoming.leaderboardDeviceId.slice(0,120);
  }
  if(typeof d.view==='string' && d.view!=='session') state.view=d.view;
  if(d.session && Array.isArray(d.session.queueIds)){
    const queue=d.session.queueIds.map(findQuestionById).filter(Boolean);
    if(queue.length){
      const idx=Math.max(0,Math.min(Number.isFinite(d.session.idx)?d.session.idx:0,queue.length-1));
      const answers=Array.isArray(d.session.answers)?d.session.answers.filter(a=>a&&typeof a==='object').slice(0,queue.length):[];
      state.session={...d.session,idx,answers,queue};
    }
  }
  lastSaveAt=Number.isFinite(d.savedAt)?d.savedAt:Date.now();
  return true;
}
function openProgressDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB unavailable')); return; }
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function saveToIndexedDB(data){
  try{
    const db=await openProgressDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(data,'latest');
      tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error);
    });
    db.close();
  }catch(e){}
}
async function loadFromIndexedDB(){
  try{
    const db=await openProgressDB();
    const data=await new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).get('latest');
      req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error);
    });
    db.close();
    return data;
  }catch(e){ return null; }
}
function saveState(){
  const data=snapshotState();
  const raw=JSON.stringify(data);
  let localSaved=false;
  try{
    const previous=localStorage.getItem(STABLE_STORAGE_KEY);
    if(previous && previous!==raw) localStorage.setItem(STORAGE_BACKUP_KEY,previous);
    localStorage.setItem(STABLE_STORAGE_KEY,raw);
    localStorage.setItem(STORAGE_KEY,raw); // compatibilidad con versiones anteriores
    localSaved=true;
  }catch(e){}
  lastSaveAt=data.savedAt;
  if(localSaved) hasLocalSavedState=true;
  saveToIndexedDB(data);
  if(!suppressCloudSync && accountSession.user) scheduleCloudSync();
}
function loadState(){
  let candidates=[];
  try{
    candidates=[
      localStorage.getItem(STABLE_STORAGE_KEY),
      localStorage.getItem(STORAGE_KEY),
      localStorage.getItem(STORAGE_BACKUP_KEY)
    ].filter(Boolean);
  }catch(e){}
  for(const raw of candidates){
    try{
      const ok=applySavedData(JSON.parse(raw));
      if(ok){ hasLocalSavedState=true; return true; }
    }catch(e){}
  }
  return false;
}
async function restoreIndexedDBFallback(){
  if(hasLocalSavedState) return;
  const data=await loadFromIndexedDB();
  if(data && applySavedData(data)){
    hasLocalSavedState=true;
    try{ const raw=JSON.stringify(data); localStorage.setItem(STABLE_STORAGE_KEY,raw); localStorage.setItem(STORAGE_KEY,raw); localStorage.setItem(STORAGE_BACKUP_KEY,raw); }catch(e){}
    applyThemeMode();
    render();
  }
}
function hexToRgb(hex){ const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||''); return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:null; }
function applyAccentColor(){
  const hex=state.settings.accentColor||'#8B2635';
  const rgb=hexToRgb(hex)||{r:139,g:38,b:53};
  document.documentElement.style.setProperty('--accent',hex);
  const alpha=state.theme==='dark'?.18:.14;
  document.documentElement.style.setProperty('--accent-soft',`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`);
}
function applyThemeMode(){
  const mode=state.settings.themeMode||'light';
  const actual=mode==='auto' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : mode;
  state.theme=actual;
  document.body.setAttribute('data-theme',actual);
  applyAccentColor();
}
const loadedExistingState=loadState();
applyThemeMode();
if(loadedExistingState) saveState(); // migra automáticamente a la clave estable sin borrar nada

async function accountRequest(method='GET', body=null){
  const opts={method,headers:{'Content-Type':'application/json'},credentials:'same-origin'};
  if(body) opts.body=JSON.stringify(body);
  const res=await fetch('/.netlify/functions/account',opts);
  const data=await res.json().catch(()=>({}));
  if(!res.ok){ const err=new Error(data.error||`Cuenta ${res.status}`); err.status=res.status; err.data=data; throw err; }
  return data;
}
function stableCloudPayload(){
  const snap=snapshotState();
  // El progreso general siempre se sincroniza. Una práctica normal pausada también
  // viaja con la cuenta para poder continuarla en otro dispositivo.
  // Exámenes incompletos y sesiones experimentales permanecen locales.
  snap.view='dashboard';
  if(!(state.session && state.session.mode==='practica' && !state.session.experimental)){
    snap.session=null;
  }
  return snap;
}
function cloudPayloadHash(data){
  try{const comparable={...data};delete comparable.savedAt;return JSON.stringify(comparable);}catch{return '';}
}
function scheduleCloudSync(){
  if(!accountSession.user || suppressCloudSync) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(syncCloudState,1200);
}
async function syncCloudState(){
  if(!accountSession.user || cloudSyncInFlight || suppressCloudSync) return;
  const payload=stableCloudPayload();
  const hash=cloudPayloadHash(payload);
  if(hash===lastCloudHash) return;
  cloudSyncInFlight=true;
  let retry=false;
  try{
    const result=await accountRequest('POST',{action:'sync',state:payload,baseUpdatedAt:lastCloudUpdatedAt});
    lastCloudUpdatedAt=Number(result.updatedAt)||lastCloudUpdatedAt;
    lastCloudHash=hash;
    const el=document.getElementById('cloudSyncStatus'); if(el) el.textContent='Sincronizado ✓';
  }catch(e){
    if(e.status===401){ accountSession={status:'ready',user:null}; renderNav(); }
    if(e.status===409 && e.data?.cloudState){
      const cloud=e.data.cloudState;
      lastCloudUpdatedAt=Number(e.data.cloudUpdatedAt)||lastCloudUpdatedAt;
      const localSession=payload.session;
      const cloudSession=cloud.session;
      const localProgress=localSession?(localSession.answers?.length||0)*1000+(localSession.idx||0):-1;
      const cloudProgress=cloudSession?(cloudSession.answers?.length||0)*1000+(cloudSession.idx||0):-1;
      const cloudIsNewer=(Number(cloud.savedAt)||0)>(Number(payload.savedAt)||0);
      if(cloudIsNewer && cloudProgress>=localProgress) applyCloudCanonical(cloud);
      else { lastCloudHash=''; retry=true; }
    }
    const el=document.getElementById('cloudSyncStatus'); if(el) el.textContent='Pendiente de sincronizar';
  }finally{cloudSyncInFlight=false;}
  if(retry) setTimeout(syncCloudState,100);
}
function applyCloudCanonical(cloudState){
  if(!cloudState || typeof cloudState!=='object') return false;
  suppressCloudSync=true;
  try{
    const currentView=state.view;
    const localSession=state.session && state.session.mode==='practica' && !state.session.experimental?state.session:null;
    applySavedData(cloudState);
    state.view=currentView;
    const cloudSession=state.session && state.session.mode==='practica' && !state.session.experimental?state.session:null;
    const localProgress=localSession?(localSession.answers?.length||0)*1000+(localSession.idx||0):-1;
    const cloudProgress=cloudSession?(cloudSession.answers?.length||0)*1000+(cloudSession.idx||0):-1;
    const keptLocal=localSession && localProgress>cloudProgress;
    if(keptLocal) state.session=localSession;
    applyThemeMode();
    saveState();
    lastCloudHash=keptLocal?'':cloudPayloadHash(stableCloudPayload());
    return true;
  }finally{suppressCloudSync=false;}
}
async function restoreAccountSession(){
  try{
    const data=await accountRequest('GET');
    accountSession={status:'ready',user:data.authenticated?data.user:null};
    lastCloudUpdatedAt=Number(data.cloudUpdatedAt)||0;
    if(data.authenticated && data.cloudState) applyCloudCanonical(data.cloudState);
    renderNav();
    render();
    if(data.authenticated && !lastCloudHash) scheduleCloudSync();
  }catch(e){accountSession={status:'ready',user:null}; renderNav();}
}
function accountLabel(){ return accountSession.user?accountSession.user.username:'Cuenta'; }

function computeMastery(topicId){
  const s = state.stats[topicId];
  if(!s || s.attempts===0) return {pct:0, status:'none'};
  const overall = s.correct/s.attempts;
  const recentArr = s.recent.slice(-8);
  const recentAcc = recentArr.length? recentArr.filter(Boolean).length/recentArr.length : 0;
  let pct = Math.round((overall*0.4 + recentAcc*0.6)*100);
  let status;
  if(s.attempts < 3) status='progress';
  else if(pct>=80 && s.attempts>=8 && recentArr.length>=5 && recentArr.slice(-5).filter(Boolean).length>=4) status='mastered';
  else if(pct>=55) status='almost';
  else status='progress';
  return {pct, status};
}
function overallMastery(){
  const all = TOPICS.map(t=>computeMastery(t.id).pct);
  return Math.round(all.reduce((a,b)=>a+b,0)/all.length);
}
function statusLabel(s){
  return {none:'No estudiado', progress:'En progreso', almost:'Casi dominado', mastered:'Dominado'}[s];
}
function statusPillClass(s){
  return {none:'pill-none', progress:'pill-progress', almost:'pill-almost', mastered:'pill-mastered'}[s];
}

function recordAnswer(q, correct){
  if(state.session && state.session.mode==='practica' && state.session.countStats===false) return;
  state.totalAnswered++;
  if(correct) state.totalCorrect++;
  state.currentStreak = correct? state.currentStreak+1 : 0;
  state.bestStreak = Math.max(state.bestStreak, state.currentStreak);
  const s = state.stats[q.topic];
  s.attempts++;
  if(correct) s.correct++;
  s.recent.push(correct);
  if(s.recent.length>20) s.recent.shift();
  if(!correct){
    let ex = state.errors.find(e=>e.qid===q.id);
    if(ex){ ex.times++; ex.last=Date.now(); }
    else state.errors.push({qid:q.id, times:1, last:Date.now()});
  } else {
    // remove from errors after 2 consecutive later correct answers handled elsewhere; keep simple: leave record but could be re-practiced
  }
  saveState();
}

function navigateFromNav(view){
  if(state.session){
    if(state.session.mode==='practica' && !state.session.experimental){
      if(state.view!=='session'){ goto(view); return; }
      if(!confirm('Hay una práctica en curso. Se guardará para que puedas continuarla después. ¿Salir de la práctica?')) return;
      state.session.pausedAt=Date.now();
      state.session.attemptStage=attemptStage;
      state.view=view;
      saveState();
      render();
      window.scrollTo(0,0);
      return;
    }
    if(!confirm('Tienes una sesión en progreso. ¿Quieres salir y abrir otra sección?')) return;
    state.session=null;
    attemptStage=0;
  }
  goto(view);
}
function toggleTheme(){
  state.theme = state.theme==='light'?'dark':'light';
  state.settings.themeMode=state.theme;
  document.body.setAttribute('data-theme', state.theme);
  saveState();
  renderNav();
}
function hasResumablePractice(){
  return !!(state.session && state.session.mode==='practica' && !state.session.experimental && Array.isArray(state.session.queue) && state.session.queue.length);
}
function resumablePracticeProgress(){
  if(!hasResumablePractice()) return null;
  const s=state.session;
  const current=Math.min((Number.isFinite(s.idx)?s.idx:0)+1,s.queue.length);
  const answered=Array.isArray(s.answers)?s.answers.length:0;
  const q=s.queue[Math.min(s.idx||0,s.queue.length-1)];
  const topic=q?TOPICS.find(t=>t.id===q.topic):null;
  return {current,total:s.queue.length,answered,topic:topic?topic.name:'Práctica'};
}
function saveAndExitPractice(){
  const s=state.session;
  if(!s || s.mode!=='practica' || s.experimental){ goto('practica'); return; }
  s.pausedAt=Date.now();
  s.hintLevel=Number.isFinite(s.hintLevel)?s.hintLevel:0;
  s.answered=!!s.answered;
  s.attemptStage=attemptStage;
  state.view='practica';
  saveState();
  render();
  window.scrollTo(0,0);
}
function discardPausedPractice(){
  if(!hasResumablePractice()) return;
  state.session=null;
  saveState();
}
function goto(view){ state.view=view; saveState(); render(); window.scrollTo(0,0); }
function render(){
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML='';
  const renderers = {
    dashboard: renderDashboard, cuenta: renderCuenta, repaso: renderRepasoHome, practica: renderPracticaHome,
    experimental: renderExperimentalHome, examen: renderExamenHome, errores: renderErrores, guardadas: renderGuardadas,
    historial: renderHistorial, leaderboard: renderLeaderboard, admin: renderAdmin, novedades: renderNovedades, ajustes: renderAjustes,
    session: renderSession, results: renderResults, repasoCards: renderRepasoCards,
  };
  (renderers[state.view]||renderDashboard)(main);
}

function ringSvg(pct, size=150, stroke=12){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const off = c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg-soft)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .5s ease"/>
  </svg>`;
}
function weakestTopic(){
  const studied=TOPICS.filter(t=>state.stats[t.id]?.attempts>0);
  if(!studied.length) return null;
  return studied.reduce((best,t)=>computeMastery(t.id).pct<computeMastery(best.id).pct?t:best, studied[0]);
}

function shuffleCopy(arr){ return [...arr].sort(()=>Math.random()-.5); }
function makeExperimentalMC(topic,prompt,correctText,distractors,explanation,hints=[]){
  const options=shuffleCopy([correctText,...distractors].slice(0,4));
  return {
    id:`xq_${Date.now()}_${Math.random().toString(36).slice(2,9)}`,
    topic,type:'mc',dif:'experimental',prompt,options,
    correct:options.indexOf(correctText),
    hints:hints.length?hints:['Busca la evidencia exacta en el ejemplo.','Compara la definición con cada opción.'],
    exp:explanation,
    experimental:true
  };
}
function experimentalBank(topic){
  const bank=[];
  const add=(...args)=>bank.push(makeExperimentalMC(topic,...args));

  if(topic==='figuras'){
    [
      ['“Tus palabras son como flechas.”','Símil',['Metáfora','Hipérbole','Anáfora'],'Es símil porque compara explícitamente usando “como”.'],

      ['“La noche es un manto negro.”','Metáfora',['Símil','Personificación','Onomatopeya'],'Identifica directamente la noche con un manto sin utilizar una comparación explícita.'],
      ['“Corre, salta, gira, cae.”','Asíndeton',['Polisíndeton','Anáfora','Hipérbaton'],'Se omiten conjunciones entre una serie de acciones.'],
      ['“Y canta, y ríe, y baila, y sueña.”','Polisíndeton',['Asíndeton','Retruécano','Metáfora'],'La conjunción “y” se repite deliberadamente.'],
      ['“Poco a poco Pablo pasa por el parque.”','Aliteración',['Anáfora','Paradoja','Hipérbole'],'Se repite de forma marcada el sonido de la letra p.'],
      ['“Oscura claridad.”','Oxímoron',['Antítesis','Símil','Onomatopeya'],'Dos términos de significado aparentemente contradictorio aparecen unidos en una expresión breve.'],
      ['“Vivo sin vivir en mí.”','Paradoja',['Hipérbole','Aliteración','Asíndeton'],'La idea parece contradictoria, pero busca expresar un sentido más profundo.'],
      ['“Hoy quiero paz. Hoy quiero silencio. Hoy quiero descansar.”','Anáfora',['Aliteración','Retruécano','Polisíndeton'],'“Hoy quiero” se repite al comienzo de varias expresiones.']
    ].forEach(x=>add(`¿Qué figura literaria predomina en ${x[0]}`,x[1],x[2],x[3],['Fíjate en la forma del lenguaje, no solo en el significado general.']));
  }

  if(topic==='morfologia'){
    [
      ['En “panecillo”, ¿qué función cumple “ec”?','Infijo',['Lexema','Prefijo','Morfema flexivo'],'pan + ec + illo: “ec” aparece entre el lexema y el sufijo, por eso funciona como infijo.'],
      ['En “casita”, ¿qué parte es un morfema derivativo sufijo?','ita',['cas','a','s'],'cas es el lexema y -ita se añade después para formar una palabra derivada.'],
      ['En “niñas”, ¿qué elemento indica número plural?','s',['niñ','a','niñas'],'La -s final es un morfema flexivo que marca el plural.'],
      ['En “ilegal”, ¿dónde está el prefijo?','i-',['legal','-al','-gal'],'El elemento i- aparece antes de la base y modifica el significado.'],
      ['¿Cuál es el lexema más evidente en “panadero”?','pan',['adero','ero','panadero'],'“pan” aporta el significado principal y aparece en otras palabras de la misma familia.'],
      ['En “destornillador”, ¿qué elemento aparece al principio como prefijo?','des-',['tornill','-ador','-dor'],'des- aparece antes de la base; -ador aparece después.'],
      ['En “calentadores”, ¿qué elemento funciona como sufijo derivativo?','ador',['calent','es','s'],'En el análisis de estudio usado en este cuaderno: calent + ador + es; -ador forma el derivado.']
    ].forEach(x=>add(x[0],x[1],x[2],x[3],['Ubica primero la base o lexema y luego observa qué aparece antes, en medio o después.']));
  }

  if(topic==='gramatica'){
    [
      ['Si analizas cómo se forma internamente una palabra, ¿qué disciplina estás usando?','Morfología',['Sintaxis','Crónica','Narrador'],'La morfología estudia la estructura interna y formación de las palabras.'],
      ['Si estudias cómo se organizan palabras para formar una oración, ¿qué disciplina estás usando?','Sintaxis',['Morfología','Crónica','Lexema'],'La sintaxis estudia cómo se combinan las palabras dentro de frases y oraciones.'],
      ['¿Cuál término engloba tanto morfología como sintaxis?','Gramática',['Crónica','Lexema','Narrador'],'La gramática es la disciplina general; morfología y sintaxis son áreas dentro de ella.'],
      ['Identificar sujeto y predicado es principalmente un ejercicio de:','Sintaxis',['Morfología','Lexema','Crónica'],'Sujeto y predicado se refieren a la organización de la oración, por lo que corresponde a sintaxis.']
    ].forEach(x=>add(x[0],x[1],x[2],x[3]));
  }

  if(topic==='narrativa'){
    [
      ['“Yo corrí hasta la puerta porque sabía que la carta era para mí.” ¿Qué tipo de narrador sugiere el fragmento?','Narrador protagonista',['Narrador testigo','Crónica','Narrador externo'],'La voz cuenta en primera persona una acción que vive directamente como personaje central.'],
      ['“Vi a Marcos entrar, dejar la mochila y marcharse; nunca supe qué había dentro.” ¿Qué tipo de narrador es más probable?','Narrador testigo',['Narrador protagonista','Narrador omnisciente','Autor de crónica'],'El narrador presencia lo ocurrido, pero el foco de la acción está en Marcos.'],
      ['¿Qué distingue mejor al narrador testigo del protagonista?','Presencia los hechos sin ser necesariamente el personaje principal',['Siempre conoce todos los pensamientos','Nunca usa primera persona','Es el autor real del texto'],'El testigo puede narrar lo que observa sin ocupar el centro de la historia.']
    ].forEach(x=>add(x[0],x[1],x[2],x[3]));
  }

  if(topic==='cronica'){
    [
      ['“A las 8:15 de la mañana del lunes, frente al gimnasio escolar…” ¿Qué característica de la crónica se destaca?','Exactitud y veracidad',['Afán descriptivo','Recursos retóricos y literarios','Intención narrativa'],'La hora, el día y el lugar aportan datos específicos y verificables.'],
      ['“El pasillo estaba húmedo, oscuro y cubierto de papeles.” ¿Qué característica se destaca?','Afán descriptivo',['Autor testigo','Exactitud y veracidad','Intención narrativa'],'El fragmento se concentra en describir el ambiente y sus detalles.'],
      ['Organizar un hecho desde lo que ocurrió primero hasta sus consecuencias demuestra principalmente:','Intención narrativa',['Exactitud y veracidad','Autor testigo','Recursos retóricos y literarios'],'La intención narrativa organiza los acontecimientos con secuencia y desarrollo.'],
      ['“El humo se extendía como una sábana gris.” ¿Qué característica se observa por el uso del símil?','Recursos retóricos y literarios',['Exactitud y veracidad','Autor testigo','Afán descriptivo solamente'],'El símil es un recurso literario usado para dar expresividad al relato.'],
      ['Cuando el cronista indica que estuvo presente y vio directamente el acontecimiento, se relaciona con:','Autor testigo',['Intención narrativa','Afán descriptivo','Exactitud y veracidad'],'El autor testigo relata desde la experiencia de haber presenciado los hechos.']
    ].forEach(x=>add(x[0],x[1],x[2],x[3]));
  }
  return bank;
}
function generateExperimentalQuestions(topics,count){
  // Quita las preguntas experimentales de la sesión anterior para evitar acumulación en memoria.
  for(let i=Q.length-1;i>=0;i--) if(Q[i].experimental) Q.splice(i,1);
  let bank=[];
  topics.forEach(t=>{ bank=bank.concat(experimentalBank(t)); });
  if(!bank.length) bank=experimentalBank('figuras');
  let generated=[];
  // Si piden más preguntas que plantillas, se regeneran variaciones reordenando opciones.
  while(generated.length<count){
    for(const base of shuffleCopy(bank)){
      const copy={...base,id:`xq_${Date.now()}_${generated.length}_${Math.random().toString(36).slice(2,7)}`};
      if(Array.isArray(base.options)){
        const correctText=base.options[base.correct];
        copy.options=shuffleCopy(base.options);
        copy.correct=copy.options.indexOf(correctText);
      }
      copy.experimental=true;
      generated.push(copy);
      if(generated.length>=count) break;
    }
  }
  Q.push(...generated);
  return generated;
}

function shuffle(arr){ return arr.map(a=>[Math.random(),a]).sort((a,b)=>a[0]-b[0]).map(a=>a[1]); }

function startSession(opts){
  if(opts.mode==='practica' && hasResumablePractice() && state.view!=='session' && !opts.forceNew){
    const ok=confirm('Tienes una práctica guardada. Aceptar la descarta y comienza una nueva; Cancelar conserva la práctica para continuarla.');
    if(!ok) return;
    state.session=null;
  }
  attemptStage = 0;
  let pool;
  if(opts.special==='debiles'){
    const sorted = [...TOPICS].sort((a,b)=>computeMastery(a.id).pct - computeMastery(b.id).pct);
    const weakIds = sorted.slice(0,2).map(t=>t.id);
    pool = Q.filter(q=>weakIds.includes(q.topic));
  } else if(opts.special==='adaptativo'){
    // Prioriza temas débiles sin duplicar preguntas dentro de la misma sesión.
    pool = Q.map(q=>{
      const m=computeMastery(q.topic);
      const weight=m.pct<50?3:m.pct<80?2:1;
      const u=Math.max(Math.random(),1e-9);
      return {q, key:-Math.log(u)/weight};
    }).sort((a,b)=>a.key-b.key).map(x=>x.q);
  } else if(opts.topics && opts.topics.length){
    pool = Q.filter(q=>opts.topics.includes(q.topic));
  } else if(opts.topic){
    pool = Q.filter(q=>q.topic===opts.topic);
  } else if(opts.errorsOnly){
    pool = state.errors.map(e=>findQuestionById(e.qid)).filter(Boolean);
  } else if(opts.savedOnly){
    pool = [...state.saved].map(findQuestionById).filter(Boolean);
  } else {
    pool = Q.slice();
  }
  pool = shuffle(pool);
  if(opts.limit) pool = pool.slice(0, Math.min(opts.limit, pool.length));
  if(pool.length===0) pool = shuffle(Q).slice(0, opts.limit||10);

  state.session = {
    mode: opts.mode, // 'practica' | 'examen'
    queue: pool,
    idx: 0,
    answers: [], // {qid, correct, userAnswer, usedHint}
    hintsUsed: 0,
    hintLevel: 0,
    answered:false,
    startedAt: Date.now(),
    miniReviewShown:false,
    countStats: opts.mode==='examen' ? true : opts.countStats!==false,
    returnView: opts.mode==='examen' ? 'examen' : 'practica',
    examTopics: opts.mode==='examen' ? (opts.topics||[]).slice() : [],
    examFull: opts.mode==='examen' ? !!opts.fullExam : false,
  };
  saveState();
  goto('session');
}

function currentQ(){ const s=state.session; return s.queue[s.idx]; }

  // check for "mini repaso" trigger: 3 consecutive fails on same topic recently in this session
  const recentSameTopicFails = s.answers.filter(a=>a.qid && findQuestionById(a.qid)?.topic===q.topic).slice(-3);
  const needsMini = s.mode==='practica' && !s.miniReviewShown && recentSameTopicFails.length===3 && recentSameTopicFails.every(a=>!a.correct);

    document.getElementById('quitSession').addEventListener('click', saveAndExitPractice);
    document.getElementById('miniOk').addEventListener('click', ()=>{ s.miniReviewShown=true; render(); });

  }
  s.miniReviewShown=false;

  const isExam = s.mode==='examen';

  main.innerHTML = `
    <div class="q-wrap">
      ${isExperimental?`<div class="experimental-warning" style="margin-bottom:14px;"><b>🧪 Experimental</b>Esta pregunta puede contener errores y no cuenta para tu progreso oficial.</div>`:''}
      <div class="q-topbar">
        <div class="btn-row">
          <button class="icon-btn ${!isExam&&!isExperimental?'save-exit-btn':''}" id="quitSession">${isExam?'✕ Abandonar examen':isExperimental?'✕ Salir':'💾 Guardar y salir'}</button>
          ${s.answers.length?'<button class="icon-btn" id="reviewPreviousBtn">← Ver anterior</button>':''}
        </div>
        <span>${t.icon} ${t.name} · ${s.idx+1} / ${total} ${isExam?'':''}</span>
      </div>
      <div class="q-progress"><div class="q-progress-fill" style="width:${(s.idx)/total*100}%"></div></div>
      <div class="q-card">
        <span class="q-topic-tag">${t.name} · ${q.dif}</span>
        <div id="qBody"></div>
        <div id="feedbackZone"></div>
        <div id="hintZone"></div>
      </div>
      <div class="q-actions">
        <div class="btn-row">
          ${isExperimental?'<span class="experimental-chip">No se guarda</span>':`<button class="icon-btn ${starred?'starred':''}" id="starBtn">${starred?'★ Guardada':'☆ Guardar'}</button>`}
          <button class="icon-btn" id="skipBtn">Saltar</button>
          <button class="icon-btn" id="restartQBtn">↺ Reiniciar</button>
        </div>
        <div class="btn-row">
          ${!isExam? `<button class="icon-btn" id="hintBtn">💡 Pista (${q.hints? Math.min(s.hintLevel,q.hints.length):0}/${q.hints?q.hints.length:0})</button>`:''}
          <button class="btn" id="submitBtn" disabled>Responder</button>
        </div>
      </div>
      <p class="kbd-hint">Atajo: presiona <kbd>Enter</kbd> para responder/continuar</p>
    </div>`;

  document.getElementById('quitSession').addEventListener('click', ()=>{
    if(isExam || isExperimental) confirmQuit();
    else saveAndExitPractice();
  });
  const reviewPrevBtn=document.getElementById('reviewPreviousBtn');
  if(reviewPrevBtn) reviewPrevBtn.addEventListener('click', ()=>renderAnsweredReview(s.answers.length-1));
  const starBtn=document.getElementById('starBtn');
  if(starBtn) starBtn.addEventListener('click', ()=>{
    if(state.saved.has(q.id)) state.saved.delete(q.id); else state.saved.add(q.id);
    saveState();
    render();
  });
  document.getElementById('skipBtn').addEventListener('click', ()=> nextQuestion(null,false,true));
  document.getElementById('restartQBtn').addEventListener('click', ()=>{ attemptStage=0; sessionSelection=null; s.hintLevel=0; s.answered=false; render(); });

}

function renderAnsweredReview(answerIndex){
  const s=state.session;
  if(!s || !s.answers.length){ render(); return; }
  const idx=Math.max(0,Math.min(answerIndex,s.answers.length-1));
  const a=s.answers[idx];
  const q=findQuestionById(a.qid);
  if(!q){ render(); return; }
  const t=TOPICS.find(x=>x.id===q.topic);
  const main=document.getElementById('main');
  main.innerHTML=`
    <div class="q-wrap">
      <div class="q-topbar">
        <button class="icon-btn" id="backCurrent">← Volver a la pregunta actual</button>
        <span>Revisión · ${idx+1} / ${s.answers.length}</span>
      </div>
      <div class="q-card">
        <span class="q-topic-tag">${t.icon} ${t.name} · ${q.dif}</span>
        <h2 style="font-size:1.18rem;margin:12px 0;">${q.prompt}</h2>
        <div class="feedback ${a.correct?'good':'bad'}">
          <b>${a.skipped?'○ Saltada':a.correct?'✓ La sacaste bien':'✗ La sacaste mal'}</b>
          ${a.skipped
            ? `<div class="detail-block"><div class="detail-title">Respuesta correcta</div><div><span class="detail-answer">${escHtml(correctAnswerLabel(q))}</span></div><div class="why-box">${escHtml(q.exp||recognitionTip(q))}</div>${learningReferenceHtml(q,null,false)}<div class="detail-tip"><b>Cómo reconocerlo la próxima vez:</b> ${escHtml(recognitionTip(q))}</div></div>`
            : detailedExplanation(q,a.userAnswer,a.correct)}
        </div>
        <div class="btn-row" style="margin-top:16px;justify-content:space-between;">
          <button class="icon-btn" id="reviewPrev" ${idx===0?'disabled':''}>← Más anterior</button>
          <button class="icon-btn" id="reviewNext" ${idx===s.answers.length-1?'disabled':''}>Más reciente →</button>
        </div>
      </div>
    </div>`;
  document.getElementById('backCurrent').addEventListener('click',render);
  document.getElementById('reviewPrev').addEventListener('click',()=>renderAnsweredReview(idx-1));
  document.getElementById('reviewNext').addEventListener('click',()=>renderAnsweredReview(idx+1));
}

function confirmQuit(){
  const s=state.session;
  if(!s){ goto('dashboard'); return; }
  if(s.mode==='practica' && !s.experimental){
    saveAndExitPractice();
    return;
  }
  const label=s.mode==='examen'?'¿Abandonar este examen? El examen incompleto no contará.':'¿Salir de esta sesión experimental?';
  if(confirm(label)){
    const back=s.returnView || (s.mode==='examen'?'examen':'practica');
    state.session=null;
    saveState();
    goto(back);
  }
}
