<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Study Hub · Dev Design Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system-p0.css">
  <link rel="stylesheet" href="/css/study-hub-account-p0.css">
  <style>
    html,body{margin:0;min-height:100%;background:var(--shds-color-paper,#f7f4ed)}
    body{min-width:0}
    [data-dev-design-lab]{min-height:100vh}
    .dev-lab-banner{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 22px;border-bottom:1px solid var(--shds-color-line);background:color-mix(in srgb,var(--shds-color-warning-soft) 94%,transparent);backdrop-filter:blur(14px)}
    .dev-lab-banner p{margin:0 0 2px;color:var(--shds-color-warning);font-size:.68rem;font-weight:800;letter-spacing:.13em}
    .dev-lab-banner strong{font-family:var(--shds-font-display);font-size:1.05rem}
    .dev-lab-actions{display:flex;gap:8px;flex-wrap:wrap}
    .dev-lab-actions button,.dev-lab-controls button{min-height:44px;border:1px solid var(--shds-color-line);border-radius:var(--shds-radius-control);background:var(--shds-color-surface);color:var(--shds-color-ink);font:600 .85rem var(--shds-font-body);cursor:pointer}
    .dev-lab-actions button{padding:0 14px}
    .dev-lab-layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 70px)}
    .dev-lab-controls{position:sticky;top:70px;align-self:start;display:grid;gap:28px;max-height:calc(100vh - 70px);overflow:auto;padding:28px 18px;border-right:1px solid var(--shds-color-line);background:var(--shds-color-recess)}
    .dev-lab-controls section{display:grid;gap:8px}
    .dev-lab-controls button{display:grid;gap:2px;width:100%;padding:10px 12px;text-align:left}
    .dev-lab-controls button span{color:var(--shds-color-ink-soft);font-size:.74rem;font-weight:400}
    .dev-lab-controls button[aria-pressed="true"]{border-color:var(--shds-color-action);background:var(--shds-color-action-soft);color:var(--shds-color-action)}
    .dev-lab-controls button:disabled{cursor:not-allowed;opacity:.56}
    .dev-lab-state-list,.dev-lab-screen-list{display:grid;gap:6px}
    .dev-lab-preview{width:min(980px,100%);margin:0 auto;padding:42px 48px 80px;outline:0}
    .dev-lab-preview-meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:28px;padding-bottom:12px;border-bottom:1px solid var(--shds-color-line);color:var(--shds-color-ink-soft);font-size:.75rem}
    .dev-lab-preview-meta b{color:var(--shds-color-warning)}
    .dev-lab-blocked{display:grid;place-content:center;min-height:100vh;padding:24px;text-align:center}
    .dev-lab-blocked h1{font-family:var(--shds-font-display)}
    [data-shds-reduced="true"] *,[data-shds-reduced="true"] *::before,[data-shds-reduced="true"] *::after{scroll-behavior:auto!important;animation-duration:1ms!important;transition-duration:1ms!important}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--shds-color-info);outline-offset:2px}
    @media(max-width:820px){
      .dev-lab-banner{position:static;align-items:flex-start;flex-direction:column}
      .dev-lab-layout{grid-template-columns:1fr}
      .dev-lab-controls{position:static;display:block;max-height:none;padding:18px;border-right:0;border-bottom:1px solid var(--shds-color-line)}
      .dev-lab-controls section+section{margin-top:20px}
      .dev-lab-state-list{grid-template-columns:repeat(2,minmax(0,1fr))}
      .dev-lab-screen-list{display:flex;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
      .dev-lab-screen-list button{flex:0 0 auto;width:auto;white-space:nowrap}
      .dev-lab-preview{padding:30px 18px 70px}
    }
    @media(max-width:390px){.dev-lab-state-list{grid-template-columns:1fr}.dev-lab-banner{padding-inline:16px}.dev-lab-actions{width:100%}.dev-lab-actions button{flex:1 1 0}}
  </style>
</head>
<body data-shds="p0" data-shds-shell="p0" data-shds-theme="light" data-view="cuenta">
  <div data-dev-design-lab aria-live="off">
    <main class="dev-lab-blocked"><h1>Preparando Design Lab…</h1></main>
  </div>
  <script type="module" src="./design-lab.mjs"></script>
</body>
</html>
